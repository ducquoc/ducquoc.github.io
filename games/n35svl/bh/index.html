<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BOUNTY HUNTER</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #1a1608; color: #f3e7d4;
    font-family: 'Courier New', Courier, monospace;
    overflow: hidden; height: 100vh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
  }
  canvas {
    display: block; border: 2px solid #5c4033;
    box-shadow: 0 0 60px rgba(212,175,55,0.15), inset 0 0 60px rgba(0,0,0,0.9);
    background: linear-gradient(#2d1b0f, #4a2c0f); max-width: 100%; max-height: 90vh;
    cursor: crosshair;
  }
  #hud {
    position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 55px; pointer-events: none; z-index: 10;
    text-transform: uppercase; letter-spacing: 2px;
  }
  .hud-item { text-align: center; }
  .hud-label { font-size: 11px; color: #d4a373; margin-bottom: 4px; }
  .hud-value { font-size: 24px; font-weight: bold; text-shadow: 0 0 12px currentColor; }
  .hud-value.hp { color: #f87171; }
  .hud-value.ammo { color: #d4af37; }
  .hud-value.bounty { color: #fbbf24; }
  .hud-value.wave { color: #a78bfa; }
  .hud-value.best { color: #34d399; }
  #start-screen {
    position: absolute; inset: 0; background: radial-gradient(circle, #4a2c0f 0%, #1a1608 100%);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    z-index: 20; text-align: center; backdrop-filter: blur(8px);
  }
  .title { font-size: 56px; font-weight: bold; color: #d4af37; letter-spacing: 10px;
    margin-bottom: 10px; text-shadow: 0 0 30px rgba(212,175,55,0.8); }
  .subtitle { font-size: 16px; color: #d4a373; letter-spacing: 6px; margin-bottom: 40px;
    text-shadow: 0 0 15px rgba(212,158,97,0.4); font-style: italic; }
  .controls { display: grid; grid-template-columns: repeat(3,1fr); gap: 14px;
    max-width: 360px; margin-bottom: 40px; }
  .control { padding: 10px 16px; border: 1px solid #5c4033; border-radius: 6px;
    background: rgba(60,40,20,0.5); color: #f3e7d4; font-size: 12px;
    text-transform: uppercase; letter-spacing: 1px; }
  .control kbd { color: #d4af37; font-weight: bold; }
  .press-start {
    padding: 14px 42px; font-size: 20px; font-family: inherit; font-weight: bold;
    color: #d4af37; background: transparent; border: 2px solid #d4af37;
    border-radius: 6px; cursor: pointer; text-transform: uppercase;
    letter-spacing: 4px; transition: all 0.2s;
    box-shadow: 0 0 20px rgba(212,175,55,0.4);
  }
  .press-start:hover { background: #d4af37; color: #1a1608;
    box-shadow: 0 0 35px rgba(212,175,55,0.9); }
  #game-over {
    position: absolute; inset: 0; background: rgba(26,22,8,0.94);
    display: none; flex-direction: column; align-items: center; justify-content: center;
    z-index: 20; text-align: center; backdrop-filter: blur(10px);
  }
  #game-over.visible { display: flex; }
  .game-title { font-size: 52px; font-weight: bold; color: #f87171; margin-bottom: 16px;
    text-shadow: 0 0 25px rgba(248,113,113,0.8); }
  .final-stats { font-size: 20px; color: #f3e7d4; margin-bottom: 8px; }
  .press-r {
    padding: 14px 42px; font-size: 20px; font-family: inherit; font-weight: bold;
    color: #d4af37; background: transparent; border: 2px solid #d4af37;
    border-radius: 6px; cursor: pointer; text-transform: uppercase;
    letter-spacing: 4px; transition: all 0.2s;
    box-shadow: 0 0 20px rgba(212,175,55,0.4);
  }
  .press-r:hover { background: #d4af37; color: #1a1608;
    box-shadow: 0 0 35px rgba(212,175,55,0.9); }
  .scanlines {
    position: absolute; inset: 0; pointer-events: none; z-index: 30;
    background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%,
      rgba(0,0,0,0.35) 50%, rgba(0,0,0,0.35)); background-size: 100% 4px;
  }
  .vignette {
    position: absolute; inset: 0; pointer-events: none; z-index: 31;
    background: radial-gradient(circle at center, transparent 40%, rgba(0,0,0,0.9) 100%);
  }
</style>
</head>
<body>
  <div class="scanlines"></div>
  <div class="vignette"></div>
  <canvas id="gameCanvas" width="1000" height="700"></canvas>
  <div id="hud">
    <div class="hud-item"><div class="hud-label">hp</div><div class="hud-value hp" id="hpDisplay">100</div></div>
    <div class="hud-item"><div class="hud-label">ammo</div><div class="hud-value ammo" id="ammoDisplay">6</div></div>
    <div class="hud-item"><div class="hud-label">bounty</div><div class="hud-value bounty" id="bountyDisplay">0</div></div>
    <div class="hud-item"><div class="hud-label">wave</div><div class="hud-value wave" id="waveDisplay">1</div></div>
    <div class="hud-item"><div class="hud-label">best</div><div class="hud-value best" id="bestBountyDisplay">0</div></div>
  </div>
  <div id="start-screen">
    <div class="title">BOUNTY HUNTER</div>
    <div class="subtitle">Draw fast. Collect the bounty.</div>
    <div class="controls">
      <div class="control">Move <kbd>WASD</kbd></div>
      <div class="control">Aim <kbd>MOUSE</kbd> / Fire <kbd>CLICK</kbd></div>
      <div class="control">Dodge <kbd>SPACE</kbd></div>
    </div>
    <button class="press-start" id="startBtn">Saddle Up</button>
  </div>
  <div id="game-over">
    <div class="game-title">Dead Man</div>
    <div class="final-stats" id="finalScore">Bounty: $0</div>
    <div class="final-stats" id="finalBest">Best bounty: $0</div>
    <button class="press-r" id="restartBtn">Restart (R)</button>
  </div>
<script>
(function(){
  'use strict';
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const CW = canvas.width, CH = canvas.height;

  const hpDisplay = document.getElementById('hpDisplay');
  const ammoDisplay = document.getElementById('ammoDisplay');
  const bountyDisplay = document.getElementById('bountyDisplay');
  const waveDisplay = document.getElementById('waveDisplay');
  const bestBountyDisplay = document.getElementById('bestBountyDisplay');
  const startScreen = document.getElementById('start-screen');
  const gameOverScreen = document.getElementById('game-over');
  const startBtn = document.getElementById('startBtn');
  const restartBtn = document.getElementById('restartBtn');
  const finalScore = document.getElementById('finalScore');
  const finalBest = document.getElementById('finalBest');

  let bestBounty = 0;
  try {
    const s = localStorage.getItem('bountyHunterBestBounty');
    if (s !== null) bestBounty = parseInt(s, 10) || 0;
  } catch (e) {}
  bestBountyDisplay.textContent = '$' + bestBounty;

  const mouse = { x: CW/2, y: CH/2, down: false, justClicked: false };
  window.addEventListener('mousemove', (e) => {
    const rect = canvas.getBoundingClientRect();
    mouse.x = e.clientX - rect.left;
    mouse.y = e.clientY - rect.top;
  });
  window.addEventListener('mousedown', () => { mouse.down = true; mouse.justClicked = true; });
  window.addEventListener('mouseup', () => { mouse.down = false; });
  window.addEventListener('click', () => { mouse.justClicked = false; });
  canvas.addEventListener('contextmenu', e => e.preventDefault());

  const keys = {};
  window.addEventListener('keydown', (e) => { keys[e.code] = true; });
  window.addEventListener('keyup', (e) => { keys[e.code] = false; });

  function random(min, max) { return Math.random() * (max - min) + min; }
  function dist(x1, y1, x2, y2) {
    const dx = x2 - x1, dy = y2 - y1;
    return Math.sqrt(dx * dx + dy * dy);
  }
  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
  function angleTo(tx, ty, sx, sy) { return Math.atan2(ty - sy, tx - sx); }

  class Bullet {
    constructor(x, y, angle, damage, speed, color) {
      this.x = x; this.y = y; this.angle = angle;
      this.damage = damage; this.speed = speed; this.color = color;
      this.life = 50; this.radius = 3;
      this.vx = Math.cos(angle) * speed;
      this.vy = Math.sin(angle) * speed;
    }
    update() {
      this.x += this.vx; this.y += this.vy;
      this.life--;
    }
    draw() {
      ctx.fillStyle = this.color; ctx.shadowColor = this.color; ctx.shadowBlur = 6;
      ctx.beginPath(); ctx.arc(this.x, this.y, this.radius, 0, Math.PI*2); ctx.fill();
      ctx.shadowBlur = 0;
    }
  }
  class Bandit {
    constructor(wave) {
      this.radius = 10 + wave * 0.6;
      this.hp = 30 + wave * 10;
      this.maxHp = this.hp;
      this.speed = 1.3 + wave * 0.07;
      this.damage = 12 + wave * 1.5;
      this.bounty = 25 + wave * 5;
      this.dead = false;
      this.hitFlash = 0;
      this.shootTimer = 0;
      const side = Math.floor(random(0, 4));
      const margin = 60;
      if (side === 0) { this.x = random(-margin, CW + margin); this.y = random(-margin, -margin); }
      else if (side === 1) { this.x = CW + margin; this.y = random(0, CH); }
      else if (side === 2) { this.x = random(-margin, CW + margin); this.y = CH + margin; }
      else { this.x = random(-margin, -margin); this.y = random(0, CH); }
    }
    update(player, cover) {
      if (this.dead) return;
      if (this.hitFlash > 0) this.hitFlash--;
      const ang = angleTo(player.x, player.y, this.x, this.y);
      this.x += Math.cos(ang) * this.speed;
      this.y += Math.sin(ang) * this.speed;
      // Cover collision
      for (const c of cover) {
        if (this.x > c.x - this.radius && this.x < c.x + c.w + this.radius &&
            this.y > c.y - this.radius && this.y < c.y + c.h + this.radius) {
          const cx = clamp(this.x, c.x, c.x + c.w);
          const cy = clamp(this.y, c.y, c.y + c.h);
          const dx = this.x - cx, dy = this.y - cy;
          const d = Math.sqrt(dx*dx + dy*dy);
          if (d < this.radius && d > 0) {
            this.x += (dx/d) * (this.radius - d);
            this.y += (dy/d) * (this.radius - d);
          }
        }
      }
      this.shootTimer--;
      if (this.shootTimer <= 0 && dist(this.x, this.y, player.x, player.y) < 300) {
        this.shootTimer = random(90, 160);
        return true; // shoot
      }
      return false;
    }
    draw() {
      if (this.dead) return;
      ctx.save();
      ctx.translate(this.x, this.y);
      ctx.fillStyle = this.hitFlash > 0 ? '#fbbf24' : '#d4a373';
      ctx.shadowColor = '#d4a373'; ctx.shadowBlur = 10;
      ctx.fillRect(-10, -6, 20, 12);
      ctx.shadowBlur = 0;
      ctx.restore();
    }
  }
  class Wanted {
    constructor(wave) {
      this.radius = 16;
      this.hp = 120 + wave * 30;
      this.maxHp = this.hp;
      this.speed = 1.0 + wave * 0.04;
      this.damage = 20 + wave * 2;
      this.bounty = 200 + wave * 50;
      this.dead = false;
      this.hitFlash = 0;
      this.shootTimer = 0;
      const side = Math.floor(random(0, 4));
      const margin = 100;
      if (side === 0) { this.x = random(-margin, CW + margin); this.y = random(-margin, -margin); }
      else if (side === 1) { this.x = CW + margin; this.y = random(0, CH); }
      else if (side === 2) { this.x = random(-margin, CW + margin); this.y = CH + margin; }
      else { this.x = random(-margin, -margin); this.y = random(0, CH); }
    }
    update(player) {
      if (this.dead) return;
      if (this.hitFlash > 0) this.hitFlash--;
      const ang = angleTo(player.x, player.y, this.x, this.y);
      this.x += Math.cos(ang) * this.speed;
      this.y += Math.sin(ang) * this.speed;
      this.shootTimer--;
      if (this.shootTimer <= 0 && dist(this.x, this.y, player.x, player.y) < 350) {
        this.shootTimer = random(100, 180);
        return true;
      }
      return false;
    }
    draw() {
      if (this.dead) return;
      ctx.save();
      ctx.translate(this.x, this.y);
      ctx.fillStyle = this.hitFlash > 0 ? '#fbbf24' : '#b45309';
      ctx.shadowColor = '#b45309'; ctx.shadowBlur = 14;
      ctx.beginPath(); ctx.arc(0, 0, this.radius, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = '#d4af37'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(0, 0, this.radius - 4, 0, Math.PI*2); ctx.stroke();
      ctx.shadowBlur = 0;
      ctx.restore();
    }
  }
  class Particle {
    constructor(x, y, color) {
      this.x = x; this.y = y; this.color = color;
      const ang = random(0, Math.PI*2);
      const sp = random(1, 6);
      this.vx = Math.cos(ang) * sp; this.vy = Math.sin(ang) * sp;
      this.life = random(20, 40); this.maxLife = this.life;
      this.size = random(2, 5);
    }
    update() {
      this.x += this.vx; this.y += this.vy;
      this.vx *= 0.92; this.vy *= 0.92;
      this.life--;
    }
    draw() {
      const a = this.life / this.maxLife;
      ctx.globalAlpha = a; ctx.fillStyle = this.color;
      ctx.fillRect(this.x - this.size/2, this.y - this.size/2, this.size, this.size);
      ctx.globalAlpha = 1;
    }
  }

  let player;
  let bullets = [];
  let bandits = [];
  let wanteds = [];
  let particles = [];
  let explosions = [];
  let cover = [];
  let wave = 1;
  let score = 0;
  let bounty = 0;
  let gameRunning = false;
  let gameOver = false;
  let frameCount = 0;
  let spawnTimer = 0;
  let enemiesToSpawn = 0;
  let waveActive = false;
  let waveStartDelay = 60;
  let screenShake = 0;
  let shootCooldown = 0;
  let dodgeCooldown = 0;
  let dodgeTimer = 0;
  let dodging = false;
  let ammo = 6;
  let maxAmmo = 12;

  function updateHUD() {
    if (!player) return;
    hpDisplay.textContent = Math.ceil(player.hp);
    ammoDisplay.textContent = ammo;
    bountyDisplay.textContent = '$' + bounty;
    waveDisplay.textContent = wave;
    bestBountyDisplay.textContent = '$' + bestBounty;
  }

  function addBounty(amount) {
    bounty += amount;
    score += amount;
    if (bounty > bestBounty) {
      bestBounty = bounty;
      try { localStorage.setItem('bountyHunterBestBounty', String(bestBounty)); } catch (e) {}
    }
    updateHUD();
  }

  function createExplosion(x, y, color, count, speed) {
    for (let i = 0; i < count; i++) particles.push(new Particle(x, y, color));
  }

  function startGame() {
    startScreen.style.display = 'none';
    gameOverScreen.classList.remove('visible');
    initGame();
    gameRunning = true;
    requestAnimationFrame(loop);
  }

  startBtn.addEventListener('click', startGame);
  restartBtn.addEventListener('click', startGame);

  function initGame() {
    player = { x: CW/2, y: CH/2, hp: 100, maxHp: 100, angle: 0, invulnerable: 0, dead: false, radius: 12,
      speed: 4.2, damageMult: 1, fireCooldown: 14 };
    bullets = []; bandits = []; wanteds = []; particles = []; explosions = []; cover = [];
    wave = 1; score = 0; bounty = 0;
    ammo = 6; maxAmmo = 12;
    gameOver = false; frameCount = 0; spawnTimer = 0;
    enemiesToSpawn = 0; waveActive = false; waveStartDelay = 60; screenShake = 0;
    dodgeCooldown = 0; dodgeTimer = 0; dodging = false;
    cover = [
      { x: 250, y: 300, w: 70, h: 100 },
      { x: 500, y: 450, w: 90, h: 60 },
      { x: 750, y: 300, w: 70, h: 110 },
      { x: 350, y: 550, w: 100, h: 70 },
      { x: 650, y: 550, w: 60, h: 90 },
    ];
    updateHUD();
    startWave(1);
  }

  function startWave(w) {
    wave = w; waveActive = true;
    enemiesToSpawn = 5 + w * 3;
    spawnTimer = 0;
    waveStartDelay = 0;
    updateHUD();
  }

  function spawnEnemy() {
    if (enemiesToSpawn <= 0) return;
    const isWanted = random(0, 1) < 0.15 + wave * 0.01;
    if (isWanted) wanteds.push(new Wanted(wave));
    else bandits.push(new Bandit(wave));
    enemiesToSpawn--;
    spawnTimer = random(30, 70) / (1 + wave * 0.05);
  }

  function loop() {
    if (!gameRunning) return;
    frameCount++;

    if (keys['KeyR'] && gameOver) { startGame(); keys['KeyR'] = false; return; }

    if (mouse.down && shootCooldown <= 0 && ammo > 0 && !player.dead) {
      const angle = player.angle;
      const bx = player.x + Math.cos(angle) * 18;
      const by = player.y + Math.sin(angle) * 18;
      bullets.push(new Bullet(bx, by, angle, 35 * player.damageMult, 15, '#d4af37'));
      ammo--;
      shootCooldown = player.fireCooldown;
      screenShake = 5;
      createExplosion(bx, by, '#d4af37', 3, 12);
      updateHUD();
    }
    if (shootCooldown > 0) shootCooldown--;

    // Dodge
    if (keys['Space'] && dodgeCooldown <= 0 && !player.dodging) {
      player.dodging = true;
      player.dodgeTimer = 10;
      player.dodgeCooldown = 50;
      const ang = player.angle;
      player.x += Math.cos(ang) * 50;
      player.y += Math.sin(ang) * 50;
      player.x = clamp(player.x, 20, CW - 20);
      player.y = clamp(player.y, 20, CH - 20);
      screenShake = 7;
    }
    if (dodgeCooldown > 0) dodgeCooldown--;
    if (dodgeTimer > 0) { dodgeTimer--; if (dodgeTimer <= 0) player.dodging = false; }

    // Movement
    let dx = 0, dy = 0;
    if (keys['KeyW'] || keys['ArrowUp']) dy -= 1;
    if (keys['KeyS'] || keys['ArrowDown']) dy += 1;
    if (keys['KeyA'] || keys['ArrowLeft']) dx -= 1;
    if (keys['KeyD'] || keys['ArrowRight']) dx += 1;
    const len = Math.sqrt(dx*dx + dy*dy);
    if (len > 0) { dx /= len; dy /= len; }
    player.x += dx * player.speed;
    player.y += dy * player.speed;
    player.x = clamp(player.x, 20, CW - 20);
    player.y = clamp(player.y, 20, CH - 20);
    player.angle = angleTo(mouse.x, mouse.y, player.x, player.y);
    if (player.invulnerable > 0) player.invulnerable--;

    // Wave
    if (waveStartDelay > 0) {
      waveStartDelay--;
      if (waveStartDelay <= 0) startWave(wave);
    }

    if (waveActive) {
      if (enemiesToSpawn > 0 && spawnTimer <= 0) spawnEnemy();
      if (spawnTimer > 0) spawnTimer--;
      if (enemiesToSpawn <= 0 && bandits.length === 0 && wanteds.length === 0) {
        waveActive = false;
        bounty += 150 + wave * 40;
        score += 150 + wave * 40;
        updateHUD();
        waveStartDelay = 180;
        setTimeout(() => { if (gameRunning && !gameOver) startWave(wave + 1); }, 1700);
      }
    }

    // Bullets
    for (let i = bullets.length - 1; i >= 0; i--) {
      bullets[i].update();
      if (bullets[i].life <= 0 || bullets[i].x < 0 || bullets[i].x > CW || bullets[i].y < 0 || bullets[i].y > CH) {
        bullets.splice(i, 1); continue;
      }
      let hitBandit = false;
      for (let e = bandits.length - 1; e >= 0; e--) {
        const b = bandits[e];
        if (b.dead) continue;
        if (dist(bullets[i].x, bullets[i].y, b.x, b.y) < b.radius + 3) {
          b.hp -= bullets[i].damage;
          b.hitFlash = 6;
          bullets.splice(i, 1);
          hitBandit = true;
          if (b.hp <= 0) {
            b.dead = true;
            addBounty(b.bounty);
            createExplosion(b.x, b.y, '#d4af37', 8, 20);
            bandits.splice(e, 1);
          }
          break;
        }
      }
      if (hitBandit) continue;
      for (let e = wanteds.length - 1; e >= 0; e--) {
        const w = wanteds[e];
        if (w.dead) continue;
        if (dist(bullets[i].x, bullets[i].y, w.x, w.y) < w.radius + 3) {
          w.hp -= bullets[i].damage;
          w.hitFlash = 6;
          bullets.splice(i, 1);
          if (w.hp <= 0) {
            w.dead = true;
            addBounty(w.bounty);
            createExplosion(w.x, w.y, '#d4af37', 15, 30);
            wanteds.splice(e, 1);
          }
          break;
        }
      }
    }

    // Bandits
    for (let i = bandits.length - 1; i >= 0; i--) {
      const b = bandits[i];
      const shoot = b.update(player, cover);
      if (shoot) {
        const ang = angleTo(player.x, player.y, b.x, b.y);
        bullets.push(new Bullet(b.x, b.y, ang, 15, 11, '#f87171'));
      }
      if (dist(b.x, b.y, player.x, player.y) < b.radius + player.radius && player.invulnerable <= 0) {
        player.hp -= b.damage;
        player.invulnerable = 60;
        screenShake = 10;
        if (player.hp <= 0) player.dead = true;
      }
    }

    // Wanted
    for (let i = wanteds.length - 1; i >= 0; i--) {
      const w = wanteds[i];
      const shoot = w.update(player);
      if (shoot) {
        const ang = angleTo(player.x, player.y, w.x, w.y);
        bullets.push(new Bullet(w.x, w.y, ang, 25, 11, '#f87171'));
      }
      if (dist(w.x, w.y, player.x, player.y) < w.radius + player.radius && player.invulnerable <= 0) {
        player.hp -= w.damage;
        player.invulnerable = 60;
        screenShake = 12;
        if (player.hp <= 0) player.dead = true;
      }
    }

    // Particles
    for (let i = particles.length - 1; i >= 0; i--) {
      particles[i].update();
      if (particles[i].life <= 0) particles.splice(i, 1);
    }
    for (let i = explosions.length - 1; i >= 0; i--) {
      const e = explosions[i];
      e.x += e.vx; e.y += e.vy;
      e.vx *= 0.9; e.vy *= 0.9;
      e.life--;
      if (e.life <= 0) explosions.splice(i, 1);
    }

    if (screenShake > 0) screenShake *= 0.9;

    // Player death
    if (player.dead) {
      endGame();
      return;
    }

    // Draw
    ctx.save();
    if (screenShake > 0) ctx.translate(random(-screenShake, screenShake), random(-screenShake, screenShake));

    ctx.fillStyle = '#1a1608';
    ctx.fillRect(0, 0, CW, CH);

    // Desert ground
    ctx.fillStyle = '#2d1b0f';
    ctx.fillRect(0, 0, CW, CH);
    ctx.fillStyle = '#4a3228';
    ctx.fillRect(0, CH * 0.55, CW, CH * 0.45);

    // Cover objects (rocks/barrels)
    ctx.fillStyle = '#5d4037'; ctx.strokeStyle = '#3e2723'; ctx.lineWidth = 2;
    for (const c of cover) {
      ctx.beginPath();
      ctx.arc(c.x + c.w/2, c.y + c.h/2, c.w/2, 0, Math.PI*2);
      ctx.fill();
      ctx.stroke();
    }

    // Bullets
    for (const b of bullets) b.draw();

    // Bandits
    for (const b of bandits) b.draw();

    // Wanted
    for (const w of wanteds) w.draw();

    // Particles
    for (const p of particles) p.draw();

    // Explosions
    for (const e of explosions) {
      ctx.globalAlpha = e.life / 30;
      ctx.strokeStyle = e.color; ctx.lineWidth = 2; ctx.shadowColor = e.color; ctx.shadowBlur = 10;
      ctx.beginPath(); ctx.arc(e.x, e.y, e.size * (30 - e.life)/10, 0, Math.PI*2); ctx.stroke();
      ctx.shadowBlur = 0; ctx.globalAlpha = 1;
    }

    // Player
    ctx.save();
    ctx.translate(player.x, player.y);
    ctx.rotate(player.angle);
    const flash = player.invulnerable > 0 && frameCount % 6 < 3;
    if (flash) ctx.globalAlpha = 0.4;
    ctx.fillStyle = '#d4af37'; ctx.shadowColor = '#d4af37'; ctx.shadowBlur = 14;
    ctx.beginPath();
    ctx.moveTo(0, -player.radius);
    ctx.lineTo(player.radius * 0.866, player.radius * 0.5);
    ctx.lineTo(0, -player.radius * 0.2);
    ctx.lineTo(-player.radius * 0.866, player.radius * 0.5);
    ctx.closePath(); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.restore();

    ctx.restore();
    updateHUD();
    requestAnimationFrame(loop);
  }

  function endGame() {
    gameOver = true;
    gameRunning = false;
    finalScore.textContent = 'Bounty: $' + bounty;
    finalBest.textContent = 'Best bounty: $' + bestBounty;
    gameOverScreen.classList.add('visible');
    updateHUD();
  }

  startScreen.style.display = 'flex';
  gameOverScreen.classList.remove('visible');
  updateHUD();

})();
</script>
</body>
</html>
