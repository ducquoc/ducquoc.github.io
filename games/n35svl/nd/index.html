<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEON DRIFT</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #05050a; color: #fff;
    font-family: 'Courier New', Courier, monospace;
    overflow: hidden; height: 100vh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
  }
  canvas {
    display: block; border: 2px solid #334155;
    box-shadow: 0 0 50px rgba(255,0,255,0.2), inset 0 0 50px rgba(255,0,255,0.1);
    background: #020205; max-width: 100%; max-height: 90vh;
  }
  #hud {
    position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 60px; pointer-events: none; z-index: 10;
    text-transform: uppercase; letter-spacing: 2px;
  }
  .hud-item { text-align: center; }
  .hud-label { font-size: 11px; color: #94a3b8; margin-bottom: 4px; }
  .hud-value { font-size: 26px; font-weight: bold; text-shadow: 0 0 12px currentColor; }
  .hud-value.pos { color: #ff00ff; }
  .hud-value.lap { color: #00ffff; }
  .hud-value.speed { color: #ffff00; }
  .hud-value.bestlap { color: #ffaa00; }
  #start-screen {
    position: absolute; inset: 0; background: rgba(2,2,8,0.9);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    z-index: 20; text-align: center; backdrop-filter: blur(6px);
  }
  .title { font-size: 64px; font-weight: bold; color: #ff00ff; letter-spacing: 10px;
    margin-bottom: 10px; text-shadow: 0 0 30px rgba(255,0,255,0.9); }
  .subtitle { font-size: 18px; color: #00ffff; letter-spacing: 6px; margin-bottom: 40px;
    text-shadow: 0 0 20px rgba(0,255,255,0.6); }
  .controls { display: grid; grid-template-columns: repeat(3,1fr); gap: 14px;
    max-width: 320px; margin-bottom: 40px; }
  .control { padding: 10px 16px; border: 1px solid #334155; border-radius: 6px;
    background: rgba(30,41,59,0.6); color: #cbd5e1; font-size: 12px;
    text-transform: uppercase; letter-spacing: 1px; }
  .control kbd { color: #ff00ff; font-weight: bold; }
  .press-start {
    padding: 14px 40px; font-size: 20px; font-family: inherit; font-weight: bold;
    color: #ff00ff; background: transparent; border: 2px solid #ff00ff;
    border-radius: 6px; cursor: pointer; text-transform: uppercase;
    letter-spacing: 4px; transition: all 0.2s;
    box-shadow: 0 0 20px rgba(255,0,255,0.4);
  }
  .press-start:hover { background: #ff00ff; color: #020205;
    box-shadow: 0 0 35px rgba(255,0,255,0.9); }
  #race-over {
    position: absolute; inset: 0; background: rgba(2,2,8,0.92);
    display: none; flex-direction: column; align-items: center; justify-content: center;
    z-index: 20; text-align: center; backdrop-filter: blur(8px);
  }
  #race-over.visible { display: flex; }
  .race-title { font-size: 52px; font-weight: bold; color: #00ffff; margin-bottom: 16px;
    text-shadow: 0 0 25px rgba(0,255,255,0.8); }
  .final-stats { font-size: 20px; color: #e2e8f0; margin-bottom: 8px; }
  .press-r {
    padding: 14px 40px; font-size: 20px; font-family: inherit; font-weight: bold;
    color: #00ffff; background: transparent; border: 2px solid #00ffff;
    border-radius: 6px; cursor: pointer; text-transform: uppercase;
    letter-spacing: 4px; transition: all 0.2s;
    box-shadow: 0 0 20px rgba(0,255,255,0.4);
  }
  .press-r:hover { background: #00ffff; color: #020205;
    box-shadow: 0 0 35px rgba(0,255,255,0.9); }
  .scanlines {
    position: absolute; inset: 0; pointer-events: none; z-index: 30;
    background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%,
      rgba(0,0,0,0.25) 50%, rgba(0,0,0,0.25)); background-size: 100% 4px;
  }
  .vignette {
    position: absolute; inset: 0; pointer-events: none; z-index: 31;
    background: radial-gradient(circle at center, transparent 45%, rgba(0,0,0,0.8) 100%);
  }
</style>
</head>
<body>
  <div class="scanlines"></div>
  <div class="vignette"></div>
  <canvas id="gameCanvas" width="960" height="720"></canvas>
  <div id="hud">
    <div class="hud-item"><div class="hud-label">pos</div><div class="hud-value pos" id="posDisplay">1</div></div>
    <div class="hud-item"><div class="hud-label">lap</div><div class="hud-value lap" id="lapDisplay">1/3</div></div>
    <div class="hud-item"><div class="hud-label">speed</div><div class="hud-value speed" id="speedDisplay">0</div></div>
    <div class="hud-item"><div class="hud-label">best lap</div><div class="hud-value bestlap" id="bestLapDisplay">--.--</div></div>
  </div>
  <div id="start-screen">
    <div class="title">NEON DRIFT</div>
    <div class="subtitle">Drift the neon grid. Master the turn.</div>
    <div class="controls">
      <div class="control">Steer <kbd>ARROWS</kbd> / <kbd>WASD</kbd></div>
      <div class="control">Accelerate <kbd>UP</kbd> / <kbd>W</kbd></div>
      <div class="control">Reverse <kbd>DOWN</kbd> / <kbd>S</kbd></div>
    </div>
    <button class="press-start" id="startBtn">Start Race</button>
  </div>
  <div id="race-over">
    <div class="race-title">Race Complete</div>
    <div class="final-stats" id="finalPosition">Position: 1</div>
    <div class="final-stats" id="finalBestLap">Best Lap: --.--</div>
    <div class="final-stats" id="finalTotalTime">Total Time: --.--</div>
    <button class="press-r" id="restartBtn">Restart (R)</button>
  </div>
<script>
(function(){
  'use strict';
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const CW = canvas.width, CH = canvas.height;

  const posDisplay = document.getElementById('posDisplay');
  const lapDisplay = document.getElementById('lapDisplay');
  const speedDisplay = document.getElementById('speedDisplay');
  const bestLapDisplay = document.getElementById('bestLapDisplay');
  const startScreen = document.getElementById('start-screen');
  const raceOverScreen = document.getElementById('race-over');
  const startBtn = document.getElementById('startBtn');
  const restartBtn = document.getElementById('restartBtn');
  const finalPosition = document.getElementById('finalPosition');
  const finalBestLap = document.getElementById('finalBestLap');
  const finalTotalTime = document.getElementById('finalTotalTime');

  const CAR_ACCEL = 0.18;
  const CAR_REVERSE_ACCEL = 0.10;
  const CAR_MAX_SPEED = 10;
  const CAR_TURN_BASE = 0.055;
  const CAR_TURN_MIN = 0.02;
  const CAR_FRICTION = 0.972;
  const CAR_DRIFT_FRICTION = 0.992;
  const DRIFT_ANGLE_THRESHOLD = 0.45;
  const TRAIL_LIFE = 22;
  const PARTICLE_LIFE = 30;
  const BOOST_SPEED = 15;
  const BOOST_DURATION = 45;
  const TOTAL_LAPS = 3;

  let bestLap = 0;
  try {
    const s = localStorage.getItem('neonDriftBestLap');
    if (s !== null) bestLap = parseFloat(s) || 0;
  } catch (e) {}
  if (bestLap > 0) {
    bestLapDisplay.textContent = (bestLap / 60).toFixed(2);
  }

  const keys = {};
  window.addEventListener('keydown', (e) => { keys[e.code] = true; });
  window.addEventListener('keyup', (e) => { keys[e.code] = false; });

  function random(min, max) { return Math.random() * (max - min) + min; }
  function dist(x1, y1, x2, y2) {
    const dx = x2 - x1, dy = y2 - y1;
    return Math.sqrt(dx * dx + dy * dy);
  }
  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
  function deg2rad(d) { return d * Math.PI / 180; }
  function angleDiff(a, b) {
    let d = a - b;
    while (d > Math.PI) d -= Math.PI * 2;
    while (d < -Math.PI) d += Math.PI * 2;
    return d;
  }

  class TrailParticle {
    constructor(x, y, color) {
      this.x = x; this.y = y; this.color = color;
      this.life = TRAIL_LIFE; this.maxLife = TRAIL_LIFE;
      this.size = random(2, 5);
    }
    update() { this.life--; }
    draw() {
      const a = this.life / this.maxLife;
      ctx.globalAlpha = a * 0.5;
      ctx.fillStyle = this.color;
      ctx.fillRect(this.x - this.size/2, this.y - this.size/2, this.size, this.size);
      ctx.globalAlpha = 1;
    }
  }
  class Particle {
    constructor(x, y, color) {
      this.x = x; this.y = y;
      const ang = random(0, Math.PI*2);
      const sp = random(1, 5);
      this.vx = Math.cos(ang) * sp;
      this.vy = Math.sin(ang) * sp;
      this.life = PARTICLE_LIFE; this.maxLife = PARTICLE_LIFE;
      this.color = color; this.size = random(2, 4);
    }
    update() {
      this.x += this.vx; this.y += this.vy;
      this.vx *= 0.94; this.vy *= 0.94;
      this.life--;
    }
    draw() {
      const a = this.life / this.maxLife;
      ctx.globalAlpha = a;
      ctx.fillStyle = this.color;
      ctx.beginPath(); ctx.arc(this.x, this.y, this.size * a, 0, Math.PI*2);
      ctx.fill(); ctx.globalAlpha = 1;
    }
  }
  class Car {
    constructor(x, y, color, isPlayer = false) {
      this.x = x; this.y = y;
      this.angle = -Math.PI / 2;
      this.vx = 0; this.vy = 0;
      this.color = color;
      this.isPlayer = isPlayer;
      this.width = 26; this.length = 40;
      this.lap = 1;
      this.nextCp = 0;
      this.checkpointsHit = 0;
      this.finished = false;
      this.finishTime = 0;
      this.boostTimer = 0;
      this.drift = false;
      this.trailTimer = 0;
    }
    get speed() { return Math.sqrt(this.vx * this.vx + this.vy * this.vy); }
    get forwardAngle() { return this.angle; }
    update(track) {
      const accel = keys['ArrowUp'] || keys['KeyW'];
      const brake = keys['ArrowDown'] || keys['KeyS'];
      const left = keys['ArrowLeft'] || keys['KeyA'];
      const right = keys['ArrowRight'] || keys['KeyD'];

      let turnInput = 0;
      if (left) turnInput -= 1;
      if (right) turnInput += 1;

      if (this.boostTimer > 0) {
        this.boostTimer--;
        if (this.boostTimer === 0) {
          this.vx *= 0.6; this.vy *= 0.6;
        }
      }

      const spd = this.speed;
      const turnSpeed = CAR_TURN_BASE - (spd / CAR_MAX_SPEED) * (CAR_TURN_BASE - CAR_TURN_MIN);
      this.angle += turnInput * turnSpeed * (spd / 3 + 0.5);

      const forwardAx = Math.cos(this.angle);
      const forwardAy = Math.sin(this.angle);

      if (accel) {
        this.vx += forwardAx * CAR_ACCEL;
        this.vy += forwardAy * CAR_ACCEL;
      } else if (brake) {
        this.vx -= forwardAx * CAR_REVERSE_ACCEL;
        this.vy -= forwardAy * CAR_REVERSE_ACCEL;
      }

      const friction = this.drift ? CAR_DRIFT_FRICTION : CAR_FRICTION;
      this.vx *= friction; this.vy *= friction;

      if (this.speed > CAR_MAX_SPEED && !this.boostTimer) {
        const scale = CAR_MAX_SPEED / this.speed;
        this.vx *= scale; this.vy *= scale;
      }

      this.x += this.vx; this.y += this.vy;

      const velAng = Math.atan2(this.vy, this.vx);
      const driftDiff = Math.abs(angleDiff(velAng, this.angle));
      this.drift = (spd > 1.5 && driftDiff > DRIFT_ANGLE_THRESHOLD && Math.abs(turnInput) > 0);

      if (this.drift) {
        this.trailTimer++;
        if (this.trailTimer >= 3) {
          this.trailTimer = 0;
          const rx = this.x - Math.cos(this.angle) * (this.length / 2 - 4);
          const ry = this.y - Math.sin(this.angle) * (this.length / 2 - 4);
          const color = this.isPlayer ? '#ff00ff' : '#00ffff';
          trails.push(new TrailParticle(rx, ry, color));
          trails.push(new TrailParticle(rx + random(-4,4), ry + random(-4,4), color));
        }
      } else {
        this.trailTimer = 0;
      }

      if (this.isPlayer) {
        track.checkBorderCollision(this);
      }
    }
    draw() {
      ctx.save();
      ctx.translate(this.x, this.y);
      ctx.rotate(this.angle);
      ctx.lineWidth = 2.5;
      ctx.strokeStyle = this.color;
      ctx.shadowColor = this.color; ctx.shadowBlur = 14;
      ctx.beginPath();
      ctx.moveTo(this.length/2, -this.width/2);
      ctx.lineTo(-this.length/2, -this.width/2);
      ctx.lineTo(-this.length/2 + 6, this.width/2);
      ctx.lineTo(this.length/2 - 6, this.width/2);
      ctx.closePath();
      ctx.stroke();
      ctx.fillStyle = this.color; ctx.globalAlpha = 0.15; ctx.fill();
      ctx.globalAlpha = 1; ctx.shadowBlur = 0;

      if (this.drift) {
        ctx.strokeStyle = '#ffff00'; ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(-this.length/2 + 4, -this.width/2);
        ctx.lineTo(-this.length/2 + 4, this.width/2);
        ctx.stroke();
      }
      ctx.restore();
    }
  }
  class Track {
    constructor() {
      this.centerline = [];
      this.width = 130;
      this.checkpoints = [];
      this.boostPads = [];
      this.build();
    }
    build() {
      const cx = CW / 2, cy = CH / 2;
      const pts = [];
      const turns = 14;
      for (let i = 0; i <= turns; i++) {
        const t = i / turns;
        const ang = t * Math.PI * 2;
        const r = 260 + 140 * Math.sin(t * Math.PI * 3);
        const r2 = 260 + 140 * Math.sin(t * Math.PI * 3 + 2);
        pts.push({ x: cx + Math.cos(ang) * r, y: cy + Math.sin(ang) * r2 });
      }
      this.centerline = pts;
      this.closedLen = pts.length;
      this.buildCheckpoints();
      this.buildBoostPads();
    }
    buildCheckpoints() {
      this.checkpoints = [];
      const step = Math.ceil(this.closedLen / 12);
      for (let i = 0; i < this.closedLen; i += step) {
        const p1 = this.centerline[i];
        const p2 = this.centerline[(i + 1) % this.closedLen];
        const dx = p2.x - p1.x, dy = p2.y - p1.y;
        const len = Math.sqrt(dx*dx + dy*dy);
        const nx = -dy / len, ny = dx / len;
        this.checkpoints.push({
          x: p1.x, y: p1.y, nx, ny, index: this.checkpoints.length,
          active: false
        });
      }
    }
    buildBoostPads() {
      this.boostPads = [];
      const step = Math.ceil(this.closedLen / 6);
      for (let i = step; i < this.closedLen; i += step * 2) {
        const p = this.centerline[i];
        const p2 = this.centerline[(i + 1) % this.closedLen];
        this.boostPads.push({ x: p.x, y: p.y, r: 34, active: true });
      }
    }
    getPointAtIndex(i) {
      return this.centerline[((i % this.closedLen) + this.closedLen) % this.closedLen];
    }
    nearestPointOnCenterline(x, y) {
      let best = null, bestDist = 1e9;
      const n = this.closedLen;
      for (let i = 0; i < n; i++) {
        const a = this.centerline[i];
        const b = this.centerline[(i + 1) % n];
        const dx = b.x - a.x, dy = b.y - a.y;
        const len2 = dx*dx + dy*dy;
        let t = ((x - a.x) * dx + (y - a.y) * dy) / len2;
        t = clamp(t, 0, 1);
        const px = a.x + dx * t, py = a.y + dy * t;
        const d = dist(x, y, px, py);
        if (d < bestDist) { bestDist = d; best = { x: px, y: py, t, i }; }
      }
      return best;
    }
    checkBorderCollision(car) {
      const np = this.nearestPointOnCenterline(car.x, car.y);
      if (!np) return;
      const lateral = (car.x - np.x) * this.centerline[(np.i + 1) % this.closedLen].x;
      const a = this.centerline[np.i];
      const b = this.centerline[(np.i + 1) % this.closedLen];
      const dx = b.x - a.x, dy = b.y - a.y;
      const len = Math.sqrt(dx*dx + dy*dy);
      const nx = -dy / len, ny = dx / len;
      const offset = (car.x - np.x) * nx + (car.y - np.y) * ny;
      const halfW = this.width / 2;
      if (Math.abs(offset) > halfW - 16) {
        const push = (offset > 0 ? 1 : -1) * (halfW - 16 - Math.abs(offset));
        car.x += nx * push; car.y += ny * push;
        car.vx *= -0.4; car.vy *= -0.4;
        car.x = clamp(car.x, 0, CW); car.y = clamp(car.y, 0, CH);
      }
    }
    draw() {
      const n = this.closedLen;
      ctx.lineJoin = 'round'; ctx.lineCap = 'round';
      ctx.strokeStyle = '#ff00ff'; ctx.lineWidth = 5;
      ctx.shadowColor = '#ff00ff'; ctx.shadowBlur = 18;
      ctx.beginPath();
      for (let i = 0; i < n; i++) {
        const p = this.centerline[i];
        if (i === 0) ctx.moveTo(p.x, p.y);
        else ctx.lineTo(p.x, p.y);
      }
      ctx.closePath(); ctx.stroke();

      const inner = [], outer = [];
      for (let i = 0; i < n; i++) {
        const a = this.centerline[i];
        const b = this.centerline[(i + 1) % n];
        const dx = b.x - a.x, dy = b.y - a.y;
        const len = Math.sqrt(dx*dx + dy*dy);
        const nx = -dy / len, ny = dx / len;
        const hw = this.width / 2;
        inner.push({ x: a.x - nx * hw, y: a.y - ny * hw });
        outer.push({ x: a.x + nx * hw, y: a.y + ny * hw });
      }
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#0a0a14';
      ctx.beginPath();
      for (let i = 0; i < n; i++) ctx.lineTo(outer[i].x, outer[i].y);
      for (let i = n - 1; i >= 0; i--) ctx.lineTo(inner[i].x, inner[i].y);
      ctx.closePath(); ctx.fill();

      ctx.strokeStyle = '#222'; ctx.lineWidth = 3;
      ctx.beginPath();
      for (let i = 0; i < n; i++) ctx.lineTo(outer[i].x, outer[i].y);
      ctx.closePath(); ctx.stroke();
      ctx.beginPath();
      for (let i = 0; i < n; i++) ctx.lineTo(inner[i].x, inner[i].y);
      ctx.closePath(); ctx.stroke();

      ctx.fillStyle = '#ff00ff'; ctx.globalAlpha = 0.35;
      for (const pad of this.boostPads) {
        if (!pad.active) continue;
        ctx.beginPath(); ctx.arc(pad.x, pad.y, pad.r, 0, Math.PI*2);
        ctx.fill();
        ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(pad.x, pad.y, pad.r, 0, Math.PI*2);
        ctx.stroke();
      }
      ctx.globalAlpha = 1;

      for (let i = 0; i < this.checkpoints.length; i++) {
        const cp = this.checkpoints[i];
        ctx.strokeStyle = (i === 0) ? '#ffff00' : '#00ffff';
        ctx.lineWidth = 3; ctx.shadowColor = ctx.strokeStyle; ctx.shadowBlur = 10;
        ctx.beginPath();
        ctx.moveTo(cp.x - cp.nx * 110, cp.y - cp.ny * 110);
        ctx.lineTo(cp.x + cp.nx * 110, cp.y + cp.ny * 110);
        ctx.stroke();
        ctx.shadowBlur = 0;
        ctx.fillStyle = '#fff'; ctx.font = '12px Courier New';
        ctx.fillText('CP' + (i+1), cp.x + 6, cp.y - 6);
      }
    }
  }

  let track;
  let player;
  let aiCars = [];
  let trails = [];
  let particles = [];
  let raceRunning = false;
  let raceOver = false;
  let frameCount = 0;
  let raceStartTime = 0;
  let currentLapTime = 0;
  let playerFinished = false;

  function createExplosion(x, y, color, count) {
    for (let i = 0; i < count; i++) particles.push(new Particle(x, y, color));
  }

  function initRace() {
    track = new Track();
    const sp = track.centerline[0];
    const p2 = track.centerline[1];
    const ang = Math.atan2(p2.y - sp.y, p2.x - sp.x);
    player = new Car(sp.x, sp.y, '#ff00ff', true);
    player.angle = ang;
    player.nextCp = 1;
    aiCars = [];
    const aiColors = ['#00ffff', '#ffff00', '#ffaa00'];
    for (let i = 0; i < 3; i++) {
      const ap = track.centerline[(i + 2) * 3 % track.closedLen];
      const ai = new Car(ap.x, ap.y, aiColors[i], false);
      ai.angle = ang + random(-0.3, 0.3);
      ai.nextCp = 1;
      aiCars.push(ai);
    }
    trails = []; particles = [];
    raceStartTime = Date.now();
    currentLapTime = 0;
    frameCount = 0;
    playerFinished = false;
    raceOver = false;
    raceRunning = true;
    updateHUD();
  }

  function updateAI(ai) {
    const cp = track.checkpoints[ai.nextCp];
    if (!cp) return;
    const targetAng = Math.atan2(cp.y - ai.y, cp.x - ai.x);
    let turnInput = 0;
    const d = angleDiff(targetAng, ai.angle);
    if (d > 0.05) turnInput = 1;
    else if (d < -0.05) turnInput = -1;
    const spd = ai.speed;
    const turnSpeed = CAR_TURN_BASE - (spd / CAR_MAX_SPEED) * (CAR_TURN_BASE - CAR_TURN_MIN);
    ai.angle += turnInput * turnSpeed * (spd / 3 + 0.5);
    const ax = Math.cos(ai.angle), ay = Math.sin(ai.angle);
    ai.vx += ax * CAR_ACCEL * 0.9;
    ai.vy += ay * CAR_ACCEL * 0.9;
    ai.vx *= CAR_FRICTION; ai.vy *= CAR_FRICTION;
    if (ai.speed > CAR_MAX_SPEED) {
      const sc = CAR_MAX_SPEED / ai.speed;
      ai.vx *= sc; ai.vy *= sc;
    }
    ai.x += ai.vx; ai.y += ai.vy;
    const np = track.nearestPointOnCenterline(ai.x, ai.y);
    if (np) {
      const a = track.centerline[np.i];
      const b = track.centerline[(np.i + 1) % track.closedLen];
      const dx = b.x - a.x, dy = b.y - a.y;
      const len = Math.sqrt(dx*dx + dy*dy);
      const nx = -dy / len, ny = dx / len;
      const offset = (ai.x - np.x) * nx + (ai.y - np.y) * ny;
      const halfW = track.width / 2;
      if (Math.abs(offset) > halfW - 14) {
        const push = (offset > 0 ? 1 : -1) * (halfW - 14 - Math.abs(offset));
        ai.x += nx * push; ai.y += ny * push;
        ai.vx *= -0.3; ai.vy *= -0.3;
      }
    }
    if (dist(ai.x, ai.y, cp.x, cp.y) < 60) {
      ai.nextCp = (ai.nextCp + 1) % track.checkpoints.length;
      ai.checkpointsHit++;
      if (ai.nextCp === 0) {
        ai.lap++;
        if (ai.lap > TOTAL_LAPS && !ai.finished) {
          ai.finished = true;
          ai.finishTime = Date.now() - raceStartTime;
        }
      }
    }
    ai.drift = Math.abs(d) > DRIFT_ANGLE_THRESHOLD && spd > 1.5;
    if (ai.drift) {
      ai.trailTimer = (ai.trailTimer || 0) + 1;
      if (ai.trailTimer >= 3) {
        ai.trailTimer = 0;
        trails.push(new TrailParticle(ai.x - Math.cos(ai.angle)*14, ai.y - Math.sin(ai.angle)*14, '#00ffff'));
      }
    } else {
      ai.trailTimer = 0;
    }
  }

  function updateHUD() {
    const pos = getPlayerPosition();
    posDisplay.textContent = pos;
    lapDisplay.textContent = Math.min(player.lap, TOTAL_LAPS) + '/' + TOTAL_LAPS;
    speedDisplay.textContent = Math.floor(player.speed);
    if (bestLap > 0) bestLapDisplay.textContent = (bestLap / 60).toFixed(2);
    else bestLapDisplay.textContent = '--.--';
  }

  function getPlayerPosition() {
    const all = [player, ...aiCars];
    all.sort((a, b) => {
      if (a.lap !== b.lap) return b.lap - a.lap;
      return b.checkpointsHit - a.checkpointsHit;
    });
    return all.indexOf(player) + 1;
  }

  function checkPlayerCheckpoint() {
    const cp = track.checkpoints[player.nextCp];
    if (!cp) return;
    if (dist(player.x, player.y, cp.x, cp.y) < 55) {
      player.nextCp = (player.nextCp + 1) % track.checkpoints.length;
      player.checkpointsHit++;
      if (player.nextCp === 0) {
        const lapTime = Date.now() - raceStartTime - currentLapTime;
        currentLapTime = Date.now() - raceStartTime;
        if (player.lap === 1) {
          player.lap = 2;
        } else if (player.lap === 2) {
          player.lap = 3;
        } else {
          player.lap = 4;
          finishRace();
        }
        if (bestLap === 0 || lapTime < bestLap) {
          bestLap = lapTime;
          try { localStorage.setItem('neonDriftBestLap', String(bestLap)); } catch (e) {}
          bestLapDisplay.textContent = (bestLap / 60).toFixed(2);
        }
        createExplosion(player.x, player.y, '#ffff00', 12);
      }
      updateHUD();
    }
  }

  function checkBoostPads() {
    for (const pad of track.boostPads) {
      if (!pad.active) continue;
      if (dist(player.x, player.y, pad.x, pad.y) < pad.r) {
        pad.active = false;
        player.boostTimer = BOOST_DURATION;
        player.vx = Math.cos(player.angle) * BOOST_SPEED;
        player.vy = Math.sin(player.angle) * BOOST_SPEED;
        createExplosion(pad.x, pad.y, '#ffff00', 10);
        setTimeout(() => { pad.active = true; }, 5000);
      }
    }
  }

  function checkCollisions() {
    const all = [player, ...aiCars];
    for (let i = 0; i < all.length; i++) {
      for (let j = i + 1; j < all.length; j++) {
        const a = all[i], b = all[j];
        const d = dist(a.x, a.y, b.x, b.y);
        const minD = (a.width + b.width) / 2 + 6;
        if (d < minD) {
          const nx = (b.x - a.x) / d, ny = (b.y - a.y) / d;
          const overlap = minD - d;
          a.x -= nx * overlap/2; a.y -= ny * overlap/2;
          b.x += nx * overlap/2; b.y += ny * overlap/2;
          const rvx = b.vx - a.vx, rvy = b.vy - a.vy;
          const velAlongNormal = rvx * nx + rvy * ny;
          if (velAlongNormal > 0) continue;
          const e = 0.5;
          const j = -(1 + e) * velAlongNormal / 2;
          a.vx -= j * nx; a.vy -= j * ny;
          b.vx += j * nx; b.vy += j * ny;
          createExplosion((a.x+b.x)/2, (a.y+b.y)/2, '#ffffff', 4);
        }
      }
    }
  }

  function finishRace() {
    playerFinished = true;
    raceRunning = false;
    raceOver = true;
    const totalTime = Date.now() - raceStartTime;
    finalPosition.textContent = 'Position: ' + getPlayerPosition();
    finalBestLap.textContent = 'Best Lap: ' + (bestLap > 0 ? (bestLap/60).toFixed(2) : '--.--');
    finalTotalTime.textContent = 'Total Time: ' + (totalTime/1000).toFixed(2) + 's';
    raceOverScreen.classList.add('visible');
  }

  function startRace() {
    startScreen.style.display = 'none';
    raceOverScreen.classList.remove('visible');
    initRace();
    requestAnimationFrame(loop);
  }

  startBtn.addEventListener('click', startRace);
  restartBtn.addEventListener('click', startRace);

  let lapAccum = 0;
  function loop() {
    if (!raceRunning) return;
    frameCount++;
    const now = Date.now();

    if (keys['KeyR']) { startRace(); keys['KeyR'] = false; return; }

    player.update(track);
    aiCars.forEach(ai => updateAI(ai));
    checkPlayerCheckpoint();
    checkBoostPads();
    checkCollisions();

    for (let i = trails.length - 1; i >= 0; i--) {
      trails[i].update();
      if (trails[i].life <= 0) trails.splice(i, 1);
    }
    for (let i = particles.length - 1; i >= 0; i--) {
      particles[i].update();
      if (particles[i].life <= 0) particles.splice(i, 1);
    }

    ctx.fillStyle = '#020205';
    ctx.fillRect(0, 0, CW, CH);

    track.draw();
    for (const t of trails) t.draw();
    for (const p of particles) p.draw();
    aiCars.forEach(ai => ai.draw());
    player.draw();

    const spd = Math.floor(player.speed);
    speedDisplay.textContent = spd;
    ctx.restore && null;

    requestAnimationFrame(loop);
  }

  startScreen.style.display = 'flex';
  raceOverScreen.classList.remove('visible');
  updateHUD();

})();
</script>
