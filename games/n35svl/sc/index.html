<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STAR COLONY</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a0f; color: #e2e8f0;
    font-family: 'Courier New', Courier, monospace;
    overflow: hidden; height: 100vh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
  }
  canvas {
    display: block; border: 2px solid #1e293b;
    box-shadow: 0 0 60px rgba(56,189,248,0.15), inset 0 0 60px rgba(0,0,0,0.9);
    background: linear-gradient(#0f172a, #020617); max-width: 100%; max-height: 90vh;
    cursor: crosshair;
  }
  #hud {
    position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 55px; pointer-events: none; z-index: 10;
    text-transform: uppercase; letter-spacing: 2px;
  }
  .hud-item { text-align: center; }
  .hud-label { font-size: 11px; color: #94a3b8; margin-bottom: 4px; }
  .hud-value { font-size: 22px; font-weight: bold; text-shadow: 0 0 12px currentColor; }
  .hud-value.energy { color: #fbbf24; }
  .hud-value.minerals { color: #94a3b8; }
  .hud-value.food { color: #4ade80; }
  .hud-value.pop { color: #38bdf8; }
  .hud-value.day { color: #a78bfa; }
  .hud-value.best { color: #34d399; }
  #build-panel {
    position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 10px; z-index: 10;
    background: rgba(15,23,42,0.85); padding: 12px 16px;
    border-radius: 10px; border: 1px solid #334155;
    backdrop-filter: blur(8px);
  }
  .build-btn {
    width: 52px; height: 52px; border-radius: 8px;
    border: 2px solid transparent; cursor: pointer;
    background: rgba(30,41,59,0.8); color: #e2e8f0;
    font-size: 22px; display: flex; align-items: center; justify-content: center;
    transition: all 0.15s;
  }
  .build-btn:hover { border-color: #38bdf8; background: rgba(30,41,59,1); transform: translateY(-2px); }
  .build-btn.selected { border-color: #38bdf8; background: rgba(56,189,248,0.2); }
  .build-btn.disabled { opacity: 0.5; cursor: not-allowed; }
  .build-cost { position: absolute; top: -14px; left: 50%; transform: translateX(-50%);
    font-size: 10px; color: #fbbf24; font-weight: bold; pointer-events: none; }
  #start-screen {
    position: absolute; inset: 0; background: radial-gradient(circle, #1e1b4b 0%, #0a0a0f 100%);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    z-index: 20; text-align: center; backdrop-filter: blur(8px);
  }
  .title { font-size: 56px; font-weight: bold; color: #38bdf8; letter-spacing: 10px;
    margin-bottom: 10px; text-shadow: 0 0 30px rgba(56,189,248,0.8); }
  .subtitle { font-size: 16px; color: #94a3b8; letter-spacing: 6px; margin-bottom: 40px;
    text-shadow: 0 0 15px rgba(148,163,184,0.4); font-style: italic; }
  .controls { display: grid; grid-template-columns: repeat(3,1fr); gap: 14px;
    max-width: 360px; margin-bottom: 40px; }
  .control { padding: 10px 16px; border: 1px solid #334155; border-radius: 6px;
    background: rgba(30,41,59,0.5); color: #cbd5e1; font-size: 12px;
    text-transform: uppercase; letter-spacing: 1px; }
  .control kbd { color: #38bdf8; font-weight: bold; }
  .press-start {
    padding: 14px 42px; font-size: 20px; font-family: inherit; font-weight: bold;
    color: #38bdf8; background: transparent; border: 2px solid #38bdf8;
    border-radius: 6px; cursor: pointer; text-transform: uppercase;
    letter-spacing: 4px; transition: all 0.2s;
    box-shadow: 0 0 20px rgba(56,189,248,0.4);
  }
  .press-start:hover { background: #38bdf8; color: #0a0a0f;
    box-shadow: 0 0 35px rgba(56,189,248,0.9); }
  #game-over {
    position: absolute; inset: 0; background: rgba(10,10,15,0.94);
    display: none; flex-direction: column; align-items: center; justify-content: center;
    z-index: 20; text-align: center; backdrop-filter: blur(10px);
  }
  #game-over.visible { display: flex; }
  .game-title { font-size: 52px; font-weight: bold; color: #f87171; margin-bottom: 16px;
    text-shadow: 0 0 25px rgba(248,113,113,0.8); }
  .final-stats { font-size: 20px; color: #e2e8f0; margin-bottom: 8px; }
  .press-r {
    padding: 14px 42px; font-size: 20px; font-family: inherit; font-weight: bold;
    color: #38bdf8; background: transparent; border: 2px solid #38bdf8;
    border-radius: 6px; cursor: pointer; text-transform: uppercase;
    letter-spacing: 4px; transition: all 0.2s;
    box-shadow: 0 0 20px rgba(56,189,248,0.4);
  }
  .press-r:hover { background: #38bdf8; color: #0a0a0f;
    box-shadow: 0 0 35px rgba(56,189,248,0.9); }
  .scanlines {
    position: absolute; inset: 0; pointer-events: none; z-index: 30;
    background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%,
      rgba(0,0,0,0.35) 50%, rgba(0,0,0,0.35)); background-size: 100% 4px;
  }
  .vignette {
    position: absolute; inset: 0; pointer-events: none; z-index: 31;
    background: radial-gradient(circle at center, transparent 40%, rgba(0,0,0,0.9) 100%);
  }
</style>
</head>
<body>
  <div class="scanlines"></div>
  <div class="vignette"></div>
  <canvas id="gameCanvas" width="1000" height="700"></canvas>
  <div id="hud">
    <div class="hud-item"><div class="hud-label">energy</div><div class="hud-value energy" id="energyDisplay">100</div></div>
    <div class="hud-item"><div class="hud-label">minerals</div><div class="hud-value minerals" id="mineralsDisplay">100</div></div>
    <div class="hud-item"><div class="hud-label">food</div><div class="hud-value food" id="foodDisplay">100</div></div>
    <div class="hud-item"><div class="hud-label">pop</div><div class="hud-value pop" id="popDisplay">10</div></div>
    <div class="hud-item"><div class="hud-label">day</div><div class="hud-value day" id="dayDisplay">1</div></div>
    <div class="hud-item"><div class="hud-label">best</div><div class="hud-value best" id="bestScoreDisplay">0</div></div>
  </div>
  <div id="build-panel">
    <div class="build-btn" id="buildGen" title="Generator (50 E)">⚡</div>
    <div class="build-btn" id="buildMine" title="Mine (50 M)">⛏</div>
    <div class="build-btn" id="buildFarm" title="Farm (50 F)">🌾</div>
    <div class="build-btn" id="buildHab" title="Habitat (100 M)">🏠</div>
    <div class="build-btn" id="buildTurret" title="Turret (75 E + 50 M)">🔫</div>
    <div class="build-btn" id="buildLab" title="Lab (100 E + 100 M)">🔬</div>
  </div>
  <div id="start-screen">
    <div class="title">STAR COLONY</div>
    <div class="subtitle">Build. Expand. Survive the night.</div>
    <div class="controls">
      <div class="control">Build <kbd>CLICK</kbd></div>
      <div class="control">Select <kbd>TOOLBAR</kbd></div>
      <div class="control">Survive <kbd>NIGHT</kbd></div>
    </div>
    <button class="press-start" id="startBtn">Colonize</button>
  </div>
  <div id="game-over">
    <div class="game-title">Colony Lost</div>
    <div class="final-stats" id="finalScore">Population: 0</div>
    <div class="final-stats" id="finalBest">Best pop: 0</div>
    <button class="press-r" id="restartBtn">Restart (R)</button>
  </div>
<script>
(function(){
  'use strict';
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const CW = canvas.width, CH = canvas.height;

  const energyDisplay = document.getElementById('energyDisplay');
  const mineralsDisplay = document.getElementById('mineralsDisplay');
  const foodDisplay = document.getElementById('foodDisplay');
  const popDisplay = document.getElementById('popDisplay');
  const dayDisplay = document.getElementById('dayDisplay');
  const bestScoreDisplay = document.getElementById('bestScoreDisplay');
  const startScreen = document.getElementById('start-screen');
  const gameOverScreen = document.getElementById('game-over');
  const startBtn = document.getElementById('startBtn');
  const restartBtn = document.getElementById('restartBtn');
  const finalScore = document.getElementById('finalScore');
  const finalBest = document.getElementById('finalBest');

  let bestPop = 0;
  try {
    const s = localStorage.getItem('starColonyBestPop');
    if (s !== null) bestPop = parseInt(s, 10) || 0;
  } catch (e) {}
  bestScoreDisplay.textContent = bestPop;

  const mouse = { x: 0, y: 0, down: false, justClicked: false };
  window.addEventListener('mousemove', (e) => {
    const rect = canvas.getBoundingClientRect();
    mouse.x = e.clientX - rect.left;
    mouse.y = e.clientY - rect.top;
  });
  window.addEventListener('mousedown', () => { mouse.down = true; mouse.justClicked = true; });
  window.addEventListener('mouseup', () => { mouse.down = false; });
  window.addEventListener('click', () => { mouse.justClicked = false; });
  canvas.addEventListener('contextmenu', e => e.preventDefault());

  const keys = {};
  window.addEventListener('keydown', (e) => { keys[e.code] = true; });
  window.addEventListener('keyup', (e) => { keys[e.code] = false; });

  function random(min, max) { return Math.random() * (max - min) + min; }
  function dist(x1, y1, x2, y2) {
    const dx = x2 - x1, dy = y2 - y1;
    return Math.sqrt(dx * dx + dy * dy);
  }
  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

  const BUILDINGS = {
    gen:  { name: 'Generator',  cost: { e: 50 },  prod: { e: 2 },  color: '#fbbf24',  emoji: '⚡' },
    mine: { name: 'Mine',       cost: { m: 50 },  prod: { m: 2 },  color: '#94a3b8',  emoji: '⛏' },
    farm: { name: 'Farm',       cost: { f: 50 },  prod: { f: 2 },  color: '#4ade80',  emoji: '🌾' },
    hab:  { name: 'Habitat',    cost: { m: 100 }, prod: { pop: 1 }, color: '#38bdf8',  emoji: '🏠' },
    turret: { name: 'Turret',   cost: { e: 75, m: 50 }, prod: {}, color: '#ef4444',  emoji: '🔫' },
    lab:  { name: 'Lab',        cost: { e: 100, m: 100 }, prod: {}, color: '#a78bfa', emoji: '🔬' },
  };

  class Building {
    constructor(type, x, y) {
      this.type = type;
      this.x = x; this.y = y;
      const b = BUILDINGS[type];
      this.name = b.name;
      this.color = b.color;
      this.emoji = b.emoji;
      this.hp = 100;
      this.maxHp = 100;
      this.prod = b.prod || {};
      this.range = type === 'turret' ? 140 : 0;
      this.damage = type === 'turret' ? 25 : 0;
      this.cooldown = 0;
    }
    draw() {
      ctx.save();
      ctx.translate(this.x, this.y);
      ctx.fillStyle = this.color;
      ctx.shadowColor = this.color; ctx.shadowBlur = 10;
      ctx.beginPath();
      ctx.moveTo(0, -14);
      ctx.lineTo(14, 10);
      ctx.lineTo(-14, 10);
      ctx.closePath(); ctx.fill();
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#ffffff'; ctx.font = '14px sans-serif'; ctx.textAlign = 'center';
      ctx.fillText(this.emoji, 0, 4);
      ctx.restore();
    }
  }

  class Creature {
    constructor(day) {
      this.radius = 10 + day * 0.5;
      this.hp = 20 + day * 10;
      this.maxHp = this.hp;
      this.speed = 1.0 + day * 0.05;
      this.damage = 8 + day * 1;
      this.dead = false;
      this.hitFlash = 0;
      const side = Math.floor(random(0, 4));
      const margin = 40;
      if (side === 0) { this.x = random(-margin, CW + margin); this.y = random(-margin, -margin); }
      else if (side === 1) { this.x = CW + margin; this.y = random(0, CH); }
      else if (side === 2) { this.x = random(-margin, CW + margin); this.y = CH + margin; }
      else { this.x = random(-margin, -margin); this.y = random(0, CH); }
    }
    update(buildings, player) {
      if (this.dead) return;
      if (this.hitFlash > 0) this.hitFlash--;
      // Find nearest building
      let target = null, tDist = 1e9;
      for (const b of buildings) {
        const d = dist(this.x, this.y, b.x, b.y);
        if (d < tDist) { tDist = d; target = b; }
      }
      if (target) {
        const ang = angleTo(target.x, target.y, this.x, this.y);
        this.x += Math.cos(ang) * this.speed;
        this.y += Math.sin(ang) * this.speed;
        if (dist(this.x, this.y, target.x, target.y) < this.radius + 14) {
          target.hp -= this.damage;
          this.hitFlash = 10;
          if (target.hp <= 0) {
            const idx = buildings.indexOf(target);
            if (idx >= 0) buildings.splice(idx, 1);
          }
        }
      }
    }
    draw() {
      if (this.dead) return;
      ctx.save();
      ctx.translate(this.x, this.y);
      ctx.fillStyle = this.hitFlash > 0 ? '#fbbf24' : '#f87171';
      ctx.shadowColor = '#f87171'; ctx.shadowBlur = 10;
      ctx.beginPath();
      ctx.moveTo(0, -this.radius);
      ctx.lineTo(this.radius * 0.866, this.radius * 0.5);
      ctx.lineTo(0, -this.radius * 0.2);
      ctx.lineTo(-this.radius * 0.866, this.radius * 0.5);
      ctx.closePath(); ctx.fill();
      ctx.shadowBlur = 0;
      ctx.restore();
    }
  }
  class Projectile {
    constructor(x, y, angle, damage, color) {
      this.x = x; this.y = y; this.angle = angle;
      this.damage = damage; this.color = color;
      this.speed = 12; this.life = 45; this.radius = 3;
      this.vx = Math.cos(angle) * this.speed;
      this.vy = Math.sin(angle) * this.speed;
    }
    update() {
      this.x += this.vx; this.y += this.vy;
      this.life--;
    }
    draw() {
      ctx.fillStyle = this.color; ctx.shadowColor = this.color; ctx.shadowBlur = 6;
      ctx.beginPath(); ctx.arc(this.x, this.y, this.radius, 0, Math.PI*2); ctx.fill();
      ctx.shadowBlur = 0;
    }
  }
  class Particle {
    constructor(x, y, color) {
      this.x = x; this.y = y; this.color = color;
      const ang = random(0, Math.PI*2);
      const sp = random(1, 5);
      this.vx = Math.cos(ang) * sp; this.vy = Math.sin(ang) * sp;
      this.life = random(20, 40); this.maxLife = this.life;
      this.size = random(2, 5);
    }
    update() {
      this.x += this.vx; this.y += this.vy;
      this.vx *= 0.92; this.vy *= 0.92;
      this.life--;
    }
    draw() {
      const a = this.life / this.maxLife;
      ctx.globalAlpha = a; ctx.fillStyle = this.color;
      ctx.fillRect(this.x - this.size/2, this.y - this.size/2, this.size, this.size);
      ctx.globalAlpha = 1;
    }
  }

  function angleTo(tx, ty, sx, sy) { return Math.atan2(ty - sy, tx - sx); }

  let buildings = [];
  let creatures = [];
  let projectiles = [];
  let particles = [];
  let explosions = [];
  let energy = 100;
  let minerals = 100;
  let food = 100;
  let pop = 10;
  let maxPop = 10;
  let day = 1;
  let score = 0;
  let gameRunning = false;
  let gameOver = false;
  let frameCount = 0;
  let spawnTimer = 0;
  let isNight = false;
  let nightTimer = 0;
  let selectedBuild = null;
  let screenShake = 0;
  let techLevel = 1;

  function updateHUD() {
    energyDisplay.textContent = Math.ceil(energy);
    mineralsDisplay.textContent = Math.ceil(minerals);
    foodDisplay.textContent = Math.ceil(food);
    popDisplay.textContent = pop + '/' + maxPop;
    dayDisplay.textContent = day;
    bestScoreDisplay.textContent = bestPop;
  }

  function canAfford(type) {
    const c = BUILDINGS[type].cost;
    return (c.e || 0) <= energy && (c.m || 0) <= minerals && (c.f || 0) <= food;
  }

  function build(type) {
    if (!canAfford(type)) return false;
    const c = BUILDINGS[type].cost;
    energy -= c.e || 0;
    minerals -= c.m || 0;
    food -= c.f || 0;
    buildings.push(new Building(type, mouse.x, mouse.y));
    updateHUD();
    return true;
  }

  function initGame() {
    buildings = []; creatures = []; projectiles = []; particles = []; explosions = [];
    energy = 100; minerals = 100; food = 100; pop = 10; maxPop = 10;
    day = 1; score = 0;
    gameOver = false; frameCount = 0; spawnTimer = 0; isNight = false; nightTimer = 0;
    selectedBuild = null; screenShake = 0; techLevel = 1;
    // Starting buildings
    buildings.push(new Building('gen', CW/2 - 100, CH/2));
    buildings.push(new Building('hab', CW/2 + 100, CH/2));
    updateHUD();
  }

  function startGame() {
    startScreen.style.display = 'none';
    gameOverScreen.classList.remove('visible');
    initGame();
    gameRunning = true;
    requestAnimationFrame(loop);
  }

  startBtn.addEventListener('click', startGame);
  restartBtn.addEventListener('click', startGame);

  // Build buttons
  const buildBtns = {
    buildGen: 'gen', buildMine: 'mine', buildFarm: 'farm',
    buildHab: 'hab', buildTurret: 'turret', buildLab: 'lab',
  };
  for (const [id, type] of Object.entries(buildBtns)) {
    document.getElementById(id).onclick = () => {
      selectedBuild = selectedBuild === type ? null : type;
      updateBuildUI();
    };
  }

  function updateBuildUI() {
    for (const [id, type] of Object.entries(buildBtns)) {
      const btn = document.getElementById(id);
      btn.classList.toggle('selected', selectedBuild === type);
      btn.classList.toggle('disabled', !canAfford(type));
    }
  }

  function loop() {
    if (!gameRunning) return;
    frameCount++;

    if (keys['KeyR'] && gameOver) { startGame(); keys['KeyR'] = false; return; }

    // Day/night cycle
    if (frameCount % 600 === 0) {
      isNight = !isNight;
      nightTimer = 0;
      if (!isNight) day++;
    }
    if (isNight) nightTimer++;

    // Resource production
    if (frameCount % 60 === 0) {
      for (const b of buildings) {
        if (b.prod.e) energy += b.prod.e;
        if (b.prod.m) minerals += b.prod.m;
        if (b.prod.f) food += b.prod.f;
        if (b.prod.pop) maxPop += b.prod.pop;
      }
      // Consumption
      energy -= pop * 0.1;
      minerals -= pop * 0.05;
      food -= pop * 0.15;
      if (energy < 0) energy = 0;
      if (minerals < 0) minerals = 0;
      if (food < 0) food = 0;
      // Pop growth
      if (food > 50 && pop < maxPop) {
        pop += 0.1;
        if (pop > maxPop) pop = maxPop;
      }
      if (food <= 0) pop -= 0.2;
      if (pop < 0) pop = 0;
      score = Math.floor(pop * 10 + day * 5);
      updateHUD();
    }

    // Spawn creatures at night
    if (isNight) {
      if (spawnTimer <= 0) {
        creatures.push(new Creature(day));
        spawnTimer = random(60, 140) / (1 + day * 0.03);
      }
      if (spawnTimer > 0) spawnTimer--;
    }

    // Turrets fire
    if (frameCount % 20 === 0) {
      for (const b of buildings) {
        if (b.type === 'turret' && b.cooldown <= 0) {
          let target = null, tDist = 1e9;
          for (const c of creatures) {
            if (!c.dead) {
              const d = dist(b.x, b.y, c.x, c.y);
              if (d < b.range && d < tDist) { tDist = d; target = c; }
            }
          }
          if (target) {
            const ang = angleTo(target.x, target.y, b.x, b.y);
            projectiles.push(new Projectile(b.x, b.y, ang, b.damage, '#ef4444'));
            b.cooldown = 40;
          }
        }
        if (b.cooldown > 0) b.cooldown--;
      }
    }

    // Projectiles
    for (let i = projectiles.length - 1; i >= 0; i--) {
      projectiles[i].update();
      if (projectiles[i].life <= 0 || projectiles[i].x < 0 || projectiles[i].x > CW || projectiles[i].y < 0 || projectiles[i].y > CH) {
        projectiles.splice(i, 1); continue;
      }
      for (let c = creatures.length - 1; c >= 0; c--) {
        const cr = creatures[c];
        if (cr.dead) continue;
        if (dist(projectiles[i].x, projectiles[i].y, cr.x, cr.y) < cr.radius + 3) {
          cr.hp -= projectiles[i].damage;
          cr.hitFlash = 6;
          projectiles.splice(i, 1);
          if (cr.hp <= 0) {
            cr.dead = true;
            score += 20 + day * 2;
            createExplosion(cr.x, cr.y, '#f87171', 6, 18);
            creatures.splice(c, 1);
          }
          break;
        }
      }
    }

    // Creatures
    for (let i = creatures.length - 1; i >= 0; i--) {
      creatures[i].update(buildings, null);
    }

    // Particles
    for (let i = particles.length - 1; i >= 0; i--) {
      particles[i].update();
      if (particles[i].life <= 0) particles.splice(i, 1);
    }
    for (let i = explosions.length - 1; i >= 0; i--) {
      const e = explosions[i];
      e.x += e.vx; e.y += e.vy;
      e.vx *= 0.9; e.vy *= 0.9;
      e.life--;
      if (e.life <= 0) explosions.splice(i, 1);
    }

    if (screenShake > 0) screenShake *= 0.9;

    // Game over - HQ destroyed (first building)
    if (buildings.length === 0 || pop <= 0) {
      endGame();
      return;
    }

    // Draw
    ctx.save();
    if (screenShake > 0) ctx.translate(random(-screenShake, screenShake), random(-screenShake, screenShake));

    ctx.fillStyle = isNight ? '#02040a' : '#0f172a';
    ctx.fillRect(0, 0, CW, CH);

    // Stars at night
    if (isNight) {
      ctx.fillStyle = '#e2e8f0';
      for (let i = 0; i < 40; i++) {
        const sx = (i * 97) % CW;
        const sy = (i * 131) % CH;
        ctx.fillRect(sx, sy, 1.5, 1.5);
      }
    }

    // Ground grid
    ctx.strokeStyle = isNight ? 'rgba(56,189,248,0.06)' : 'rgba(56,189,248,0.12)';
    ctx.lineWidth = 1;
    const gs = 60;
    const off = (frameCount * 0.1) % gs;
    for (let x = -gs + off; x < CW; x += gs) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, CH); ctx.stroke(); }
    for (let y = -gs + off; y < CH; y += gs) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(CW, y); ctx.stroke(); }

    // Buildings
    for (const b of buildings) b.draw();

    // Turret range
    ctx.strokeStyle = 'rgba(239,68,68,0.15)'; ctx.lineWidth = 1;
    for (const b of buildings) {
      if (b.type === 'turret') {
        ctx.beginPath(); ctx.arc(b.x, b.y, b.range, 0, Math.PI*2); ctx.stroke();
      }
    }

    // Projectiles
    for (const p of projectiles) p.draw();

    // Creatures
    for (const c of creatures) c.draw();

    // Particles
    for (const p of particles) p.draw();

    // Explosions
    for (const e of explosions) {
      ctx.globalAlpha = e.life / 30;
      ctx.strokeStyle = e.color; ctx.lineWidth = 2; ctx.shadowColor = e.color; ctx.shadowBlur = 10;
      ctx.beginPath(); ctx.arc(e.x, e.y, e.size * (30 - e.life)/10, 0, Math.PI*2); ctx.stroke();
      ctx.shadowBlur = 0; ctx.globalAlpha = 1;
    }

    // Build preview
    if (selectedBuild && mouse.x >= 0 && mouse.x < CW && mouse.y >= 0 && mouse.y < CH) {
      const b = BUILDINGS[selectedBuild];
      const affordable = canAfford(selectedBuild);
      ctx.fillStyle = affordable ? b.color : '#ef4444';
      ctx.globalAlpha = 0.4;
      ctx.beginPath();
      ctx.moveTo(mouse.x, mouse.y - 14);
      ctx.lineTo(mouse.x + 14, mouse.y + 10);
      ctx.lineTo(mouse.x - 14, mouse.y + 10);
      ctx.closePath(); ctx.fill();
      ctx.globalAlpha = 1;
      ctx.strokeStyle = b.color; ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(mouse.x, mouse.y - 14);
      ctx.lineTo(mouse.x + 14, mouse.y + 10);
      ctx.lineTo(mouse.x - 14, mouse.y + 10);
      ctx.closePath(); ctx.stroke();
      ctx.fillStyle = '#ffffff'; ctx.font = '14px sans-serif'; ctx.textAlign = 'center';
      ctx.fillText(b.emoji, mouse.x, mouse.y + 4);
    }

    ctx.restore();
    updateHUD();
    requestAnimationFrame(loop);
  }

  function createExplosion(x, y, color, count, speed) {
    for (let i = 0; i < count; i++) particles.push(new Particle(x, y, color));
  }

  function endGame() {
    gameOver = true;
    gameRunning = false;
    finalScore.textContent = 'Population: ' + Math.floor(pop);
    finalBest.textContent = 'Best pop: ' + bestPop;
    if (pop > bestPop) {
      bestPop = Math.floor(pop);
      try { localStorage.setItem('starColonyBestPop', String(bestPop)); } catch (e) {}
    }
    gameOverScreen.classList.add('visible');
    updateHUD();
  }

  startScreen.style.display = 'flex';
  gameOverScreen.classList.remove('visible');
  updateHUD();

})();
</script>
</body>
</html>
