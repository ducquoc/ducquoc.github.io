<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DEAD SIGNAL</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #020205; color: #e2e8f0;
    font-family: 'Courier New', Courier, monospace;
    overflow: hidden; height: 100vh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
  }
  canvas {
    display: block; border: 2px solid #334155;
    box-shadow: 0 0 60px rgba(255,0,0,0.12), inset 0 0 60px rgba(0,0,0,0.8);
    background: #05050a; max-width: 100%; max-height: 90vh;
    cursor: crosshair;
  }
  #hud {
    position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 55px; pointer-events: none; z-index: 10;
    text-transform: uppercase; letter-spacing: 2px;
  }
  .hud-item { text-align: center; }
  .hud-label { font-size: 11px; color: #64748b; margin-bottom: 4px; }
  .hud-value { font-size: 26px; font-weight: bold; text-shadow: 0 0 12px currentColor; }
  .hud-value.health { color: #ff4444; }
  .hud-value.ammo { color: #00ffff; }
  .hud-value.wave { color: #ff00ff; }
  .hud-value.score { color: #ffff00; }
  .hud-value.best { color: #ffaa00; }
  #start-screen {
    position: absolute; inset: 0; background: radial-gradient(circle, #0a0202 0%, #020205 100%);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    z-index: 20; text-align: center; backdrop-filter: blur(8px);
  }
  .title { font-size: 64px; font-weight: bold; color: #ff4444; letter-spacing: 12px;
    margin-bottom: 10px; text-shadow: 0 0 30px rgba(255,68,68,0.9); }
  .subtitle { font-size: 16px; color: #94a3b8; letter-spacing: 6px; margin-bottom: 40px;
    text-shadow: 0 0 15px rgba(148,163,184,0.4); font-style: italic; }
  .controls { display: grid; grid-template-columns: repeat(3,1fr); gap: 14px;
    max-width: 340px; margin-bottom: 40px; }
  .control { padding: 10px 16px; border: 1px solid #334155; border-radius: 6px;
    background: rgba(30,41,59,0.5); color: #cbd5e1; font-size: 12px;
    text-transform: uppercase; letter-spacing: 1px; }
  .control kbd { color: #ff4444; font-weight: bold; }
  .press-start {
    padding: 14px 42px; font-size: 20px; font-family: inherit; font-weight: bold;
    color: #ff4444; background: transparent; border: 2px solid #ff4444;
    border-radius: 6px; cursor: pointer; text-transform: uppercase;
    letter-spacing: 4px; transition: all 0.2s;
    box-shadow: 0 0 20px rgba(255,68,68,0.4);
  }
  .press-start:hover { background: #ff4444; color: #020205;
    box-shadow: 0 0 35px rgba(255,68,68,0.9); }
  #game-over {
    position: absolute; inset: 0; background: rgba(2,2,5,0.94);
    display: none; flex-direction: column; align-items: center; justify-content: center;
    z-index: 20; text-align: center; backdrop-filter: blur(10px);
  }
  #game-over.visible { display: flex; }
  .game-title { font-size: 52px; font-weight: bold; color: #ff4444; margin-bottom: 16px;
    text-shadow: 0 0 25px rgba(255,68,68,0.8); }
  .final-stats { font-size: 20px; color: #e2e8f0; margin-bottom: 8px; }
  .press-r {
    padding: 14px 42px; font-size: 20px; font-family: inherit; font-weight: bold;
    color: #00ffff; background: transparent; border: 2px solid #00ffff;
    border-radius: 6px; cursor: pointer; text-transform: uppercase;
    letter-spacing: 4px; transition: all 0.2s;
    box-shadow: 0 0 20px rgba(0,255,255,0.4);
  }
  .press-r:hover { background: #00ffff; color: #020205;
    box-shadow: 0 0 35px rgba(0,255,255,0.9); }
  .scanlines {
    position: absolute; inset: 0; pointer-events: none; z-index: 30;
    background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%,
      rgba(0,0,0,0.35) 50%, rgba(0,0,0,0.35)); background-size: 100% 4px;
  }
  .vignette {
    position: absolute; inset: 0; pointer-events: none; z-index: 31;
    background: radial-gradient(circle at center, transparent 40%, rgba(0,0,0,0.85) 100%);
  }
  .grain {
    position: absolute; inset: 0; pointer-events: none; z-index: 32;
    opacity: 0.15; background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='1'/%3E%3C/svg%3E");
  }
</style>
</head>
<body>
  <div class="scanlines"></div>
  <div class="vignette"></div>
  <div class="grain"></div>
  <canvas id="gameCanvas" width="960" height="720"></canvas>
  <div id="hud">
    <div class="hud-item"><div class="hud-label">health</div><div class="hud-value health" id="healthDisplay">100</div></div>
    <div class="hud-item"><div class="hud-label">ammo</div><div class="hud-value ammo" id="ammoDisplay">24</div></div>
    <div class="hud-item"><div class="hud-label">wave</div><div class="hud-value wave" id="waveDisplay">1</div></div>
    <div class="hud-item"><div class="hud-label">score</div><div class="hud-value score" id="scoreDisplay">0</div></div>
    <div class="hud-item"><div class="hud-label">best</div><div class="hud-value best" id="bestScoreDisplay">0</div></div>
  </div>
  <div id="start-screen">
    <div class="title">DEAD SIGNAL</div>
    <div class="subtitle">The darkness is hunting. Don't let it find you.</div>
    <div class="controls">
      <div class="control">Move <kbd>WASD</kbd></div>
      <div class="control">Aim <kbd>MOUSE</kbd></div>
      <div class="control">Fire <kbd>CLICK</kbd></div>
    </div>
    <button class="press-start" id="startBtn">Begin Transmission</button>
  </div>
  <div id="game-over">
    <div class="game-title">Signal Lost</div>
    <div class="final-stats" id="finalScore">Score: 0</div>
    <div class="final-stats" id="finalWave">Wave reached: 1</div>
    <div class="final-stats" id="finalBest">Best score: 0</div>
    <button class="press-r" id="restartBtn">Restart (R)</button>
  </div>
<script>
(function(){
  'use strict';
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const CW = canvas.width, CH = canvas.height;

  const healthDisplay = document.getElementById('healthDisplay');
  const ammoDisplay = document.getElementById('ammoDisplay');
  const waveDisplay = document.getElementById('waveDisplay');
  const scoreDisplay = document.getElementById('scoreDisplay');
  const bestScoreDisplay = document.getElementById('bestScoreDisplay');
  const startScreen = document.getElementById('start-screen');
  const gameOverScreen = document.getElementById('game-over');
  const startBtn = document.getElementById('startBtn');
  const restartBtn = document.getElementById('restartBtn');
  const finalScore = document.getElementById('finalScore');
  const finalWave = document.getElementById('finalWave');
  const finalBest = document.getElementById('finalBest');

  let bestScore = 0;
  try {
    const s = localStorage.getItem('deadSignalBestScore');
    if (s !== null) bestScore = parseInt(s, 10) || 0;
  } catch (e) {}
  bestScoreDisplay.textContent = bestScore;

  const keys = {};
  const mouse = { x: CW/2, y: CH/2, worldX: CW/2, worldY: CH/2 };
  window.addEventListener('keydown', (e) => { keys[e.code] = true; });
  window.addEventListener('keyup', (e) => { keys[e.code] = false; });
  window.addEventListener('mousemove', (e) => {
    const rect = canvas.getBoundingClientRect();
    mouse.x = e.clientX - rect.left;
    mouse.y = e.clientY - rect.top;
  });
  window.addEventListener('mousedown', () => { mouse.down = true; });
  window.addEventListener('mouseup', () => { mouse.down = false; });
  canvas.addEventListener('contextmenu', e => e.preventDefault());

  function random(min, max) { return Math.random() * (max - min) + min; }
  function dist(x1, y1, x2, y2) {
    const dx = x2 - x1, dy = y2 - y1;
    return Math.sqrt(dx * dx + dy * dy);
  }
  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
  function angleTo(tx, ty, sx, sy) { return Math.atan2(ty - sy, tx - sx); }

  class Player {
    constructor() { this.reset(); }
    reset() {
      this.x = CW / 2; this.y = CH / 2;
      this.vx = 0; this.vy = 0;
      this.health = 100;
      this.maxHealth = 100;
      this.ammo = 24;
      this.maxAmmo = 60;
      this.radius = 12;
      this.invulnerable = 0;
      this.angle = 0;
    }
    update() {
      let dx = 0, dy = 0;
      if (keys['KeyW'] || keys['ArrowUp']) dy -= 1;
      if (keys['KeyS'] || keys['ArrowDown']) dy += 1;
      if (keys['KeyA'] || keys['ArrowLeft']) dx -= 1;
      if (keys['KeyD'] || keys['ArrowRight']) dx += 1;
      const len = Math.sqrt(dx*dx + dy*dy);
      if (len > 0) { dx /= len; dy /= len; }
      const speed = 4.2;
      this.vx = dx * speed; this.vy = dy * speed;
      this.x += this.vx; this.y += this.vy;
      this.x = clamp(this.x, 20, CW - 20);
      this.y = clamp(this.y, 20, CH - 20);

      this.angle = angleTo(mouse.x, mouse.y, this.x, this.y);

      if (this.invulnerable > 0) this.invulnerable--;
    }
    draw() {
      ctx.save();
      ctx.translate(this.x, this.y);
      ctx.rotate(this.angle);
      ctx.lineWidth = 3;
      ctx.strokeStyle = '#00ffff'; ctx.shadowColor = '#00ffff'; ctx.shadowBlur = 14;
      ctx.beginPath();
      ctx.moveTo(14, 0); ctx.lineTo(-10, -9); ctx.lineTo(-6, 0); ctx.lineTo(-10, 9); ctx.closePath();
      ctx.stroke();
      ctx.fillStyle = '#00ffff'; ctx.globalAlpha = 0.25; ctx.fill();
      ctx.globalAlpha = 1; ctx.shadowBlur = 0;
      ctx.restore();
    }
  }
  class Bullet {
    constructor(x, y, angle) {
      this.x = x; this.y = y; this.angle = angle;
      this.speed = 14; this.life = 45; this.radius = 3;
      this.vx = Math.cos(angle) * this.speed;
      this.vy = Math.sin(angle) * this.speed;
    }
    update() {
      this.x += this.vx; this.y += this.vy;
      this.life--;
    }
    draw() {
      ctx.fillStyle = '#ffff00'; ctx.shadowColor = '#ffff00'; ctx.shadowBlur = 8;
      ctx.beginPath(); ctx.arc(this.x, this.y, this.radius, 0, Math.PI*2);
      ctx.fill(); ctx.shadowBlur = 0;
    }
  }
  class Enemy {
    constructor(wave) {
      this.radius = 10 + wave * 1.5;
      this.hp = 20 + wave * 12;
      this.maxHp = this.hp;
      this.speed = 1.6 + wave * 0.18;
      this.damage = 12 + wave * 2;
      this.spawn();
    }
    spawn() {
      const side = Math.floor(random(0, 4));
      const margin = 60;
      if (side === 0) { this.x = random(-margin, CW + margin); this.y = random(-margin, -margin); }
      else if (side === 1) { this.x = random(CW + margin, CW + margin*2); this.y = random(0, CH); }
      else if (side === 2) { this.x = random(-margin, CW + margin); this.y = random(CH + margin, CH + margin*2); }
      else { this.x = random(-margin, -margin); this.y = random(0, CH); }
      this.angle = 0;
      this.hitTimer = 0;
      if (this.hitTimer < 0) this.hitTimer = 0;
    }
    update(player) {
      this.angle = angleTo(player.x, player.y, this.x, this.y);
      this.x += Math.cos(this.angle) * this.speed;
      this.y += Math.sin(this.angle) * this.speed;
      if (this.hitTimer > 0) this.hitTimer--;
    }
    draw() {
      ctx.save();
      ctx.translate(this.x, this.y);
      ctx.rotate(this.angle);
      ctx.lineWidth = 2.5;
      ctx.strokeStyle = '#ff4444'; ctx.shadowColor = '#ff4444'; ctx.shadowBlur = 10;
      ctx.beginPath();
      ctx.moveTo(11, 0); ctx.lineTo(-9, -7); ctx.lineTo(-5, 0); ctx.lineTo(-9, 7); ctx.closePath();
      ctx.stroke();
      ctx.fillStyle = '#ff4444'; ctx.globalAlpha = this.hitTimer > 0 ? 0.9 : 0.25; ctx.fill();
      ctx.globalAlpha = 1; ctx.shadowBlur = 0;
      ctx.restore();
    }
  }
  class AmmoPickup {
    constructor() {
      this.radius = 8;
      const side = Math.floor(random(0, 4));
      const margin = 40;
      if (side === 0) { this.x = random(0, CW); this.y = -margin; }
      else if (side === 1) { this.x = CW + margin; this.y = random(0, CH); }
      else if (side === 2) { this.x = random(0, CW); this.y = CH + margin; }
      else { this.x = -margin; this.y = random(0, CH); }
      this.angle = random(0, Math.PI*2);
      this.vx = Math.cos(this.angle) * 1.2;
      this.vy = Math.sin(this.angle) * 1.2;
      this.life = 600;
      this.bob = 0;
    }
    update() {
      this.x += this.vx; this.y += this.vy;
      this.x = clamp(this.x, 0, CW); this.y = clamp(this.y, 0, CH);
      this.bob += 0.15;
      this.life--;
    }
    draw() {
      const pulse = 0.7 + 0.3 * Math.sin(Date.now() / 120);
      ctx.save();
      ctx.translate(this.x, this.y + Math.sin(this.bob) * 4);
      ctx.rotate(this.angle);
      ctx.lineWidth = 2;
      ctx.strokeStyle = '#00ffff'; ctx.shadowColor = '#00ffff'; ctx.shadowBlur = 14;
      ctx.beginPath();
      ctx.moveTo(0, -this.radius); ctx.lineTo(this.radius * pulse, this.radius * pulse);
      ctx.lineTo(0, 0); ctx.lineTo(-this.radius * pulse, this.radius * pulse); ctx.closePath();
      ctx.stroke();
      ctx.fillStyle = '#00ffff'; ctx.globalAlpha = 0.3 * pulse; ctx.fill();
      ctx.globalAlpha = 1; ctx.shadowBlur = 0;
      ctx.restore();
    }
  }
  class Particle {
    constructor(x, y, color) {
      this.x = x; this.y = y; this.color = color;
      const ang = random(0, Math.PI*2);
      const sp = random(1, 6);
      this.vx = Math.cos(ang) * sp; this.vy = Math.sin(ang) * sp;
      this.life = random(20, 40); this.maxLife = this.life;
      this.size = random(2, 5);
    }
    update() {
      this.x += this.vx; this.y += this.vy;
      this.vx *= 0.92; this.vy *= 0.92;
      this.life--;
    }
    draw() {
      const a = this.life / this.maxLife;
      ctx.globalAlpha = a;
      ctx.fillStyle = this.color;
      ctx.fillRect(this.x - this.size/2, this.y - this.size/2, this.size, this.size);
      ctx.globalAlpha = 1;
    }
  }

  let player;
  let bullets = [];
  let enemies = [];
  let ammos = [];
  let particles = [];
  let wave = 1;
  let score = 0;
  let gameRunning = false;
  let gameOver = false;
  let frameCount = 0;
  let enemySpawnTimer = 0;
  let enemiesRemaining = 0;
  let waveActive = false;
  let waveStartDelay = 0;
  let screenShake = 0;
  let flashlightRange = 260;

  function initGame() {
    player = new Player();
    bullets = []; enemies = []; ammos = []; particles = [];
    wave = 1; score = 0;
    gameOver = false; frameCount = 0;
    enemySpawnTimer = 0; enemiesRemaining = 0;
    waveActive = false; waveStartDelay = 60;
    screenShake = 0;
    updateHUD();
    startWave(wave);
  }

  function startWave(w) {
    wave = w; waveActive = true;
    enemiesRemaining = 4 + w * 3;
    enemySpawnTimer = 0;
    waveStartDelay = 60;
    updateHUD();
  }

  function spawnEnemy() {
    if (enemiesRemaining <= 0) return;
    enemies.push(new Enemy(wave));
    enemiesRemaining--;
    enemySpawnTimer = random(25, 70) / (1 + wave * 0.08);
  }

  function updateHUD() {
    healthDisplay.textContent = Math.ceil(player.health);
    ammoDisplay.textContent = player.ammo + '/' + player.maxAmmo;
    waveDisplay.textContent = wave;
    scoreDisplay.textContent = score;
    bestScoreDisplay.textContent = bestScore;
  }

  function takeDamage(amount) {
    if (player.invulnerable > 0) return;
    player.health -= amount;
    player.invulnerable = 45;
    screenShake = 14;
    for (let i = 0; i < 10; i++) particles.push(new Particle(player.x, player.y, '#ff4444'));
    if (player.health <= 0) {
      player.health = 0;
      endGame();
    }
    updateHUD();
  }

  function addScore(amount) {
    score += amount;
    if (score > bestScore) {
      bestScore = score;
      try { localStorage.setItem('deadSignalBestScore', String(bestScore)); } catch (e) {}
    }
    updateHUD();
  }

  function endGame() {
    gameOver = true;
    gameRunning = false;
    finalScore.textContent = 'Score: ' + score;
    finalWave.textContent = 'Wave reached: ' + wave;
    finalBest.textContent = 'Best score: ' + bestScore;
    gameOverScreen.classList.add('visible');
  }

  function startGame() {
    startScreen.style.display = 'none';
    gameOverScreen.classList.remove('visible');
    initGame();
    gameRunning = true;
    requestAnimationFrame(loop);
  }

  startBtn.addEventListener('click', startGame);
  restartBtn.addEventListener('click', startGame);
  let shootCooldown = 0;
  function loop() {
    if (!gameRunning) return;
    frameCount++;
    const now = Date.now();

    if (keys['KeyR']) { startGame(); keys['KeyR'] = false; return; }

    player.update();

    if (mouse.down && shootCooldown <= 0 && player.ammo > 0) {
      const angle = player.angle;
      const bx = player.x + Math.cos(angle) * 16;
      const by = player.y + Math.sin(angle) * 16;
      bullets.push(new Bullet(bx, by, angle));
      player.ammo--;
      shootCooldown = 14;
      screenShake = 3;
      for (let i = 0; i < 3; i++) {
        particles.push(new Particle(bx, by, '#ffff00'));
      }
      updateHUD();
    }
    if (shootCooldown > 0) shootCooldown--;

    for (let i = bullets.length - 1; i >= 0; i--) {
      bullets[i].update();
      if (bullets[i].life <= 0 || bullets[i].x < 0 || bullets[i].x > CW ||
          bullets[i].y < 0 || bullets[i].y > CH) bullets.splice(i, 1);
    }

    if (waveStartDelay > 0) {
      waveStartDelay--;
      if (waveStartDelay <= 0 && !waveActive) startWave(wave);
    }

    if (waveActive) {
      if (enemiesRemaining > 0 && enemySpawnTimer <= 0) spawnEnemy();
      if (enemySpawnTimer > 0) enemySpawnTimer--;
      if (enemiesRemaining <= 0 && enemies.length === 0) {
        waveActive = false;
        setTimeout(() => { startWave(wave + 1); }, 1400);
      }
    }

    for (let i = enemies.length - 1; i >= 0; i--) {
      const e = enemies[i];
      e.update(player);
      if (dist(e.x, e.y, player.x, player.y) < e.radius + player.radius) {
        takeDamage(e.damage);
        e.x = player.x - Math.cos(e.angle) * (e.radius + player.radius + 8);
        e.y = player.y - Math.sin(e.angle) * (e.radius + player.radius + 8);
      }
      for (let j = bullets.length - 1; j >= 0; j--) {
        const b = bullets[j];
        if (dist(b.x, b.y, e.x, e.y) < e.radius + b.radius) {
          e.hp -= 18;
          e.hitTimer = 8;
          bullets.splice(j, 1);
          screenShake = 2;
          for (let k = 0; k < 4; k++) particles.push(new Particle(e.x, e.y, '#ff4444'));
          if (e.hp <= 0) {
            addScore(50 + wave * 5);
            enemies.splice(i, 1);
            if (random(0, 1) < 0.18) ammos.push(new AmmoPickup());
          }
          break;
        }
      }
    }

    for (let i = ammos.length - 1; i >= 0; i--) {
      const a = ammos[i];
      a.update();
      if (dist(a.x, a.y, player.x, player.y) < a.radius + player.radius) {
        player.ammo = Math.min(player.maxAmmo, player.ammo + 12);
        addScore(25);
        ammos.splice(i, 1);
      } else if (a.life <= 0) {
        ammos.splice(i, 1);
      }
    }

    for (let i = particles.length - 1; i >= 0; i--) {
      particles[i].update();
      if (particles[i].life <= 0) particles.splice(i, 1);
    }

    if (screenShake > 0) screenShake *= 0.88;

    ctx.save();
    if (screenShake > 0) {
      ctx.translate(random(-screenShake, screenShake), random(-screenShake, screenShake));
    }
    ctx.fillStyle = '#05050a';
    ctx.fillRect(0, 0, CW, CH);

    const aimAng = player.angle;
    const grad = ctx.createRadialGradient(
      player.x, player.y, 6,
      player.x, player.y, flashlightRange
    );
    grad.addColorStop(0, 'rgba(255,255,220,0.35)');
    grad.addColorStop(0.45, 'rgba(255,255,220,0.06)');
    grad.addColorStop(1, 'rgba(255,255,220,0)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, CW, CH);

    ctx.save();
    ctx.translate(player.x, player.y);
    ctx.rotate(aimAng);
    ctx.fillStyle = 'rgba(255,255,220,0.5)';
    ctx.beginPath();
    ctx.moveTo(0, -8); ctx.lineTo(flashlightRange, -flashlightRange * 0.62);
    ctx.lineTo(flashlightRange, flashlightRange * 0.62); ctx.lineTo(0, 8); ctx.closePath();
    ctx.fill();
    ctx.restore();

    for (const b of bullets) b.draw();
    for (const e of enemies) e.draw();
    for (const a of ammos) a.draw();
    for (const p of particles) p.draw();
    player.draw();

    ctx.restore();

    const hpPct = player.health / player.maxHealth;
    if (hpPct < 0.25 && frameCount % 10 < 5) {
      ctx.fillStyle = 'rgba(255,0,0,0.12)';
      ctx.fillRect(0, 0, CW, CH);
    }

    updateHUD();
    requestAnimationFrame(loop);
  }

  startScreen.style.display = 'flex';
  gameOverScreen.classList.remove('visible');
  updateHUD();

})();
</script>
</body>
</html>
