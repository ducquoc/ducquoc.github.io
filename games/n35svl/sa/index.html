<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SKY ACE</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #05050a; color: #e2e8f0;
    font-family: 'Courier New', Courier, monospace;
    overflow: hidden; height: 100vh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
  }
  canvas {
    display: block; border: 2px solid #1e293b;
    box-shadow: 0 0 60px rgba(56,189,248,0.15), inset 0 0 60px rgba(0,0,0,0.9);
    background: linear-gradient(#0f172a, #1e293b); max-width: 100%; max-height: 90vh;
    cursor: crosshair;
  }
  #hud {
    position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 55px; pointer-events: none; z-index: 10;
    text-transform: uppercase; letter-spacing: 2px;
  }
  .hud-item { text-align: center; }
  .hud-label { font-size: 11px; color: #94a3b8; margin-bottom: 4px; }
  .hud-value { font-size: 24px; font-weight: bold; text-shadow: 0 0 12px currentColor; }
  .hud-value.lives { color: #f87171; }
  .hud-value.missiles { color: #fbbf24; }
  .hud-value.wave { color: #a78bfa; }
  .hud-value.score { color: #38bdf8; }
  .hud-value.best { color: #34d399; }
  #start-screen {
    position: absolute; inset: 0; background: radial-gradient(circle, #1e1b4b 0%, #05050a 100%);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    z-index: 20; text-align: center; backdrop-filter: blur(8px);
  }
  .title { font-size: 60px; font-weight: bold; color: #38bdf8; letter-spacing: 10px;
    margin-bottom: 10px; text-shadow: 0 0 30px rgba(56,189,248,0.8); }
  .subtitle { font-size: 16px; color: #94a3b8; letter-spacing: 6px; margin-bottom: 40px;
    text-shadow: 0 0 15px rgba(148,163,184,0.4); font-style: italic; }
  .controls { display: grid; grid-template-columns: repeat(3,1fr); gap: 14px;
    max-width: 360px; margin-bottom: 40px; }
  .control { padding: 10px 16px; border: 1px solid #334155; border-radius: 6px;
    background: rgba(30,41,59,0.5); color: #cbd5e1; font-size: 12px;
    text-transform: uppercase; letter-spacing: 1px; }
  .control kbd { color: #38bdf8; font-weight: bold; }
  .press-start {
    padding: 14px 42px; font-size: 20px; font-family: inherit; font-weight: bold;
    color: #38bdf8; background: transparent; border: 2px solid #38bdf8;
    border-radius: 6px; cursor: pointer; text-transform: uppercase;
    letter-spacing: 4px; transition: all 0.2s;
    box-shadow: 0 0 20px rgba(56,189,248,0.4);
  }
  .press-start:hover { background: #38bdf8; color: #05050a;
    box-shadow: 0 0 35px rgba(56,189,248,0.9); }
  #game-over {
    position: absolute; inset: 0; background: rgba(5,5,10,0.94);
    display: none; flex-direction: column; align-items: center; justify-content: center;
    z-index: 20; text-align: center; backdrop-filter: blur(10px);
  }
  #game-over.visible { display: flex; }
  .game-title { font-size: 52px; font-weight: bold; color: #f87171; margin-bottom: 16px;
    text-shadow: 0 0 25px rgba(248,113,113,0.8); }
  .final-stats { font-size: 20px; color: #e2e8f0; margin-bottom: 8px; }
  .press-r {
    padding: 14px 42px; font-size: 20px; font-family: inherit; font-weight: bold;
    color: #38bdf8; background: transparent; border: 2px solid #38bdf8;
    border-radius: 6px; cursor: pointer; text-transform: uppercase;
    letter-spacing: 4px; transition: all 0.2s;
    box-shadow: 0 0 20px rgba(56,189,248,0.4);
  }
  .press-r:hover { background: #38bdf8; color: #05050a;
    box-shadow: 0 0 35px rgba(56,189,248,0.9); }
  .scanlines {
    position: absolute; inset: 0; pointer-events: none; z-index: 30;
    background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%,
      rgba(0,0,0,0.35) 50%, rgba(0,0,0,0.35)); background-size: 100% 4px;
  }
  .vignette {
    position: absolute; inset: 0; pointer-events: none; z-index: 31;
    background: radial-gradient(circle at center, transparent 40%, rgba(0,0,0,0.85) 100%);
  }
</style>
</head>
<body>
  <div class="scanlines"></div>
  <div class="vignette"></div>
  <canvas id="gameCanvas" width="1000" height="700"></canvas>
  <div id="hud">
    <div class="hud-item"><div class="hud-label">lives</div><div class="hud-value lives" id="livesDisplay">3</div></div>
    <div class="hud-item"><div class="hud-label">missiles</div><div class="hud-value missiles" id="missilesDisplay">6</div></div>
    <div class="hud-item"><div class="hud-label">wave</div><div class="hud-value wave" id="waveDisplay">1</div></div>
    <div class="hud-item"><div class="hud-label">score</div><div class="hud-value score" id="scoreDisplay">0</div></div>
    <div class="hud-item"><div class="hud-label">best</div><div class="hud-value best" id="bestScoreDisplay">0</div></div>
  </div>
  <div id="start-screen">
    <div class="title">SKY ACE</div>
    <div class="subtitle">Rule the skies. Destroy the enemy.</div>
    <div class="controls">
      <div class="control">Fly <kbd>WASD</kbd></div>
      <div class="control">Aim <kbd>MOUSE</kbd></div>
      <div class="control">Fire <kbd>CLICK</kbd> / Missile <kbd>SPACE</kbd></div>
    </div>
    <button class="press-start" id="startBtn">Launch</button>
  </div>
  <div id="game-over">
    <div class="game-title">Shot Down</div>
    <div class="final-stats" id="finalScore">Score: 0</div>
    <div class="final-stats" id="finalWave">Wave reached: 1</div>
    <div class="final-stats" id="finalBest">Best score: 0</div>
    <button class="press-r" id="restartBtn">Restart (R)</button>
  </div>
<script>
(function(){
  'use strict';
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const CW = canvas.width, CH = canvas.height;

  const livesDisplay = document.getElementById('livesDisplay');
  const missilesDisplay = document.getElementById('missilesDisplay');
  const waveDisplay = document.getElementById('waveDisplay');
  const scoreDisplay = document.getElementById('scoreDisplay');
  const bestScoreDisplay = document.getElementById('bestScoreDisplay');
  const startScreen = document.getElementById('start-screen');
  const gameOverScreen = document.getElementById('game-over');
  const startBtn = document.getElementById('startBtn');
  const restartBtn = document.getElementById('restartBtn');
  const finalScore = document.getElementById('finalScore');
  const finalWave = document.getElementById('finalWave');
  const finalBest = document.getElementById('finalBest');

  let bestScore = 0;
  try {
    const s = localStorage.getItem('skyAceBestScore');
    if (s !== null) bestScore = parseInt(s, 10) || 0;
  } catch (e) {}
  bestScoreDisplay.textContent = bestScore;

  const mouse = { x: CW/2, y: CH/2, down: false, justClicked: false };
  window.addEventListener('mousemove', (e) => {
    const rect = canvas.getBoundingClientRect();
    mouse.x = e.clientX - rect.left;
    mouse.y = e.clientY - rect.top;
  });
  window.addEventListener('mousedown', () => { mouse.down = true; mouse.justClicked = true; });
  window.addEventListener('mouseup', () => { mouse.down = false; });
  window.addEventListener('click', () => { mouse.justClicked = false; });
  canvas.addEventListener('contextmenu', e => e.preventDefault());

  const keys = {};
  window.addEventListener('keydown', (e) => { keys[e.code] = true; });
  window.addEventListener('keyup', (e) => { keys[e.code] = false; });

  function random(min, max) { return Math.random() * (max - min) + min; }
  function dist(x1, y1, x2, y2) {
    const dx = x2 - x1, dy = y2 - y1;
    return Math.sqrt(dx * dx + dy * dy);
  }
  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
  function angleTo(tx, ty, sx, sy) { return Math.atan2(ty - sy, tx - sx); }

  class Bullet {
    constructor(x, y, angle, speed, damage, color) {
      this.x = x; this.y = y; this.angle = angle;
      this.speed = speed; this.damage = damage; this.color = color;
      this.life = 45; this.radius = 3;
      this.vx = Math.cos(angle) * speed; this.vy = Math.sin(angle) * speed;
    }
    update() {
      this.x += this.vx; this.y += this.vy;
      this.life--;
    }
    draw() {
      ctx.fillStyle = this.color; ctx.shadowColor = this.color; ctx.shadowBlur = 6;
      ctx.beginPath(); ctx.arc(this.x, this.y, this.radius, 0, Math.PI*2); ctx.fill();
      ctx.shadowBlur = 0;
    }
  }
  class Missile {
    constructor(x, y, angle) {
      this.x = x; this.y = y; this.angle = angle;
      this.speed = 10; this.life = 90; this.radius = 5;
      this.damage = 40; this.vx = Math.cos(angle) * this.speed;
      this.vy = Math.sin(angle) * this.speed;
    }
    update() {
      this.x += this.vx; this.y += this.vy;
      this.life--;
    }
    draw() {
      ctx.fillStyle = '#fbbf24'; ctx.shadowColor = '#fbbf24'; ctx.shadowBlur = 10;
      ctx.beginPath(); ctx.arc(this.x, this.y, this.radius, 0, Math.PI*2); ctx.fill();
      ctx.shadowBlur = 0;
    }
  }
  class Enemy {
    constructor(wave) {
      this.radius = 10 + wave * 0.8;
      this.hp = 30 + wave * 15;
      this.maxHp = this.hp;
      this.speed = 2.0 + wave * 0.12;
      this.damage = 10 + wave * 2;
      this.xp = 15 + wave * 3;
      this.dead = false;
      this.hitFlash = 0;
      const side = Math.floor(random(0, 4));
      const margin = 60;
      if (side === 0) { this.x = random(-margin, CW + margin); this.y = random(-margin, -margin); }
      else if (side === 1) { this.x = CW + margin; this.y = random(0, CH); }
      else if (side === 2) { this.x = random(-margin, CW + margin); this.y = CH + margin; }
      else { this.x = random(-margin, -margin); this.y = random(0, CH); }
    }
    update(player) {
      if (this.dead) return;
      if (this.hitFlash > 0) this.hitFlash--;
      const ang = angleTo(player.x, player.y, this.x, this.y);
      this.x += Math.cos(ang) * this.speed;
      this.y += Math.sin(ang) * this.speed;
      if (dist(this.x, this.y, player.x, player.y) < this.radius + player.radius && player.invulnerable <= 0) {
        player.hp -= this.damage;
        player.invulnerable = 60;
        screenShake = 10;
        if (player.hp <= 0) player.dead = true;
      }
    }
    draw() {
      if (this.dead) return;
      ctx.save();
      ctx.translate(this.x, this.y);
      ctx.fillStyle = this.hitFlash > 0 ? '#fbbf24' : '#f87171';
      ctx.shadowColor = '#f87171'; ctx.shadowBlur = 10;
      ctx.beginPath();
      ctx.moveTo(0, -this.radius);
      ctx.lineTo(this.radius * 0.866, this.radius * 0.5);
      ctx.lineTo(0, -this.radius * 0.2);
      ctx.lineTo(-this.radius * 0.866, this.radius * 0.5);
      ctx.closePath(); ctx.fill();
      ctx.shadowBlur = 0;
      ctx.restore();
    }
  }
  class AAGun {
    constructor() {
      this.x = random(100, CW - 100);
      this.y = random(CH - 120, CH - 40);
      this.hp = 50; this.maxHp = 50;
      this.damage = 20; this.cooldown = 0;
      this.dead = false;
      this.range = 320;
    }
    update(player) {
      if (this.dead) return;
      if (this.cooldown > 0) this.cooldown--;
      if (dist(this.x, this.y, player.x, player.y) < this.range && this.cooldown <= 0) {
        const ang = angleTo(player.x, player.y, this.x, this.y);
        projectiles.push(new Bullet(this.x, this.y, ang, 8, this.damage, '#f87171'));
        this.cooldown = random(80, 140);
      }
    }
    draw() {
      if (this.dead) return;
      ctx.save();
      ctx.translate(this.x, this.y);
      ctx.fillStyle = '#ef4444'; ctx.shadowColor = '#ef4444'; ctx.shadowBlur = 10;
      ctx.fillRect(-12, -12, 24, 24);
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#f87171';
      ctx.fillRect(-4, -16, 8, 4);
      ctx.restore();
    }
  }
  class Particle {
    constructor(x, y, color) {
      this.x = x; this.y = y; this.color = color;
      const ang = random(0, Math.PI*2);
      const sp = random(1, 6);
      this.vx = Math.cos(ang) * sp; this.vy = Math.sin(ang) * sp;
      this.life = random(20, 40); this.maxLife = this.life;
      this.size = random(2, 5);
    }
    update() {
      this.x += this.vx; this.y += this.vy;
      this.vx *= 0.92; this.vy *= 0.92;
      this.life--;
    }
    draw() {
      const a = this.life / this.maxLife;
      ctx.globalAlpha = a; ctx.fillStyle = this.color;
      ctx.fillRect(this.x - this.size/2, this.y - this.size/2, this.size, this.size);
      ctx.globalAlpha = 1;
    }
  }

  let player;
  let bullets = [];
  let missiles = [];
  let enemies = [];
  let aaguns = [];
  let particles = [];
  let explosions = [];
  let smokeTrails = [];
  let clouds = [];
  let wave = 1;
  let score = 0;
  let lives = 3;
  let missilesLeft = 6;
  let gameRunning = false;
  let gameOver = false;
  let frameCount = 0;
  let spawnTimer = 0;
  let enemiesToSpawn = 0;
  let waveActive = false;
  let waveStartDelay = 60;
  let combo = 0;
  let comboTimer = 0;
  let comboMult = 1;
  let screenShake = 0;

  function updateHUD() {
    livesDisplay.textContent = lives;
    missilesDisplay.textContent = missilesLeft;
    waveDisplay.textContent = wave;
    scoreDisplay.textContent = score;
    bestScoreDisplay.textContent = bestScore;
  }

  function addScore(amount) {
    const total = amount * comboMult;
    score += total;
    if (score > bestScore) {
      bestScore = score;
      try { localStorage.setItem('skyAceBestScore', String(bestScore)); } catch (e) {}
    }
    updateHUD();
  }

  function createExplosion(x, y, color, count, speed) {
    for (let i = 0; i < count; i++) particles.push(new Particle(x, y, color));
  }

  function createSmoke(x, y) {
    smokeTrails.push({ x, y, life: random(20, 40), size: random(4, 8), alpha: 0.6 });
  }

  function endGame() {
    gameOver = true;
    gameRunning = false;
    finalScore.textContent = 'Score: ' + score;
    finalWave.textContent = 'Wave reached: ' + wave;
    finalBest.textContent = 'Best score: ' + bestScore;
    gameOverScreen.classList.add('visible');
    updateHUD();
  }

  function initGame() {
    player = { x: CW/2, y: CH/2, hp: 100, maxHp: 100, angle: 0, invulnerable: 0, dead: false, radius: 10, cooldown: 0 };
    bullets = []; missiles = []; enemies = []; aaguns = []; particles = []; explosions = [];
    smokeTrails = []; clouds = [];
    wave = 1; score = 0; lives = 3; missilesLeft = 6;
    combo = 0; comboTimer = 0; comboMult = 1;
    gameOver = false; frameCount = 0; spawnTimer = 0;
    enemiesToSpawn = 0; waveActive = false; waveStartDelay = 60; screenShake = 0;
    for (let i = 0; i < 6; i++) clouds.push({ x: random(0, CW), y: random(0, CH), w: random(80, 160), h: random(20, 40), sp: random(0.2, 0.6), a: random(0.3, 0.7) });
    updateHUD();
    startWave(1);
  }

  function startWave(w) {
    wave = w; waveActive = true;
    enemiesToSpawn = 5 + w * 4;
    enemiesToSpawn += Math.floor(w / 2);
    spawnTimer = 0;
    waveStartDelay = 0;
    updateHUD();
  }

  function spawnEnemy() {
    if (enemiesToSpawn <= 0) return;
    enemies.push(new Enemy(wave));
    enemiesToSpawn--;
    spawnTimer = random(20, 60) / (1 + wave * 0.05);
  }

  function spawnAAGuns() {
    aaguns = [];
    const count = 2 + Math.floor(wave / 3);
    for (let i = 0; i < count; i++) aaguns.push(new AAGun());
  }

  function startGame() {
    startScreen.style.display = 'none';
    gameOverScreen.classList.remove('visible');
    initGame();
    gameRunning = true;
    requestAnimationFrame(loop);
  }

  startBtn.addEventListener('click', startGame);
  restartBtn.addEventListener('click', startGame);

  let shootCooldown = 0;
  let missileCooldown = 0;
  function loop() {
    if (!gameRunning) return;
    frameCount++;

    if (keys['KeyR'] && gameOver) { startGame(); keys['KeyR'] = false; return; }

    if (keys['Space'] && missileCooldown <= 0 && missilesLeft > 0 && !player.dead) {
      const angle = player.angle;
      const bx = player.x + Math.cos(angle) * 16;
      const by = player.y + Math.sin(angle) * 16;
      missiles.push(new Missile(bx, by, angle));
      missilesLeft--;
      missileCooldown = 30;
      screenShake = 5;
      updateHUD();
    }

    if (mouse.down && shootCooldown <= 0 && !player.dead) {
      const angle = player.angle;
      const bx = player.x + Math.cos(angle) * 16;
      const by = player.y + Math.sin(angle) * 16;
      bullets.push(new Bullet(bx, by, angle, 14, 12 * (comboMult > 1 ? 1.2 : 1), '#38bdf8'));
      shootCooldown = 10;
      screenShake = 2;
      particles.push(new Particle(bx, by, '#38bdf8'));
    }
    if (shootCooldown > 0) shootCooldown--;
    if (missileCooldown > 0) missileCooldown--;

    // Player movement
    let dx = 0, dy = 0;
    if (keys['KeyW'] || keys['ArrowUp']) dy -= 1;
    if (keys['KeyS'] || keys['ArrowDown']) dy += 1;
    if (keys['KeyA'] || keys['ArrowLeft']) dx -= 1;
    if (keys['KeyD'] || keys['ArrowRight']) dx += 1;
    const len = Math.sqrt(dx*dx + dy*dy);
    if (len > 0) { dx /= len; dy /= len; }
    player.x += dx * 4.2; player.y += dy * 4.2;
    player.x = clamp(player.x, 16, CW - 16); player.y = clamp(player.y, 16, CH - 16);
    player.angle = angleTo(mouse.x, mouse.y, player.x, player.y);
    if (player.invulnerable > 0) player.invulnerable--;

    // Wave
    if (waveStartDelay > 0) {
      waveStartDelay--;
      if (waveStartDelay <= 0) startWave(wave);
    }

    if (waveActive) {
      if (enemiesToSpawn > 0 && spawnTimer <= 0) spawnEnemy();
      if (spawnTimer > 0) spawnTimer--;
      if (enemiesToSpawn <= 0 && enemies.length === 0) {
        waveActive = false;
        score += 100 + wave * 25;
        updateHUD();
        waveStartDelay = 150;
        setTimeout(() => { if (gameRunning && !gameOver) startWave(wave + 1); }, 1600);
      }
    }

    // Update projectiles
    for (let i = bullets.length - 1; i >= 0; i--) {
      bullets[i].update();
      if (bullets[i].life <= 0 || bullets[i].x < 0 || bullets[i].x > CW || bullets[i].y < 0 || bullets[i].y > CH) {
        bullets.splice(i, 1); continue;
      }
      for (let e = enemies.length - 1; e >= 0; e--) {
        const en = enemies[e];
        if (en.dead) continue;
        if (dist(bullets[i].x, bullets[i].y, en.x, en.y) < en.radius + 3) {
          en.hp -= bullets[i].damage;
          en.hitFlash = 6;
          bullets.splice(i, 1);
          if (en.hp <= 0) {
            en.dead = true;
            combo++;
            comboTimer = 120;
            comboMult = 1 + Math.floor(combo / 5) * 0.25;
            addScore(50 + wave * 5);
            createExplosion(en.x, en.y, '#f87171', 8, 25);
            createSmoke(en.x, en.y);
            enemies.splice(e, 1);
          }
          break;
        }
      }
    }

    for (let i = missiles.length - 1; i >= 0; i--) {
      missiles[i].update();
      if (missiles[i].life <= 0 || missiles[i].x < 0 || missiles[i].x > CW || missiles[i].y < 0 || missiles[i].y > CH) {
        missiles.splice(i, 1); continue;
      }
      for (let e = enemies.length - 1; e >= 0; e--) {
        const en = enemies[e];
        if (en.dead) continue;
        if (dist(missiles[i].x, missiles[i].y, en.x, en.y) < en.radius + 8) {
          en.hp -= missiles[i].damage;
          missiles.splice(i, 1);
          if (en.hp <= 0) {
            en.dead = true;
            combo++;
            comboTimer = 120;
            comboMult = 1 + Math.floor(combo / 5) * 0.25;
            addScore(75 + wave * 8);
            createExplosion(en.x, en.y, '#fbbf24', 14, 35);
            createSmoke(en.x, en.y);
            enemies.splice(e, 1);
          }
          break;
        }
      }
    }

    // Update enemies
    for (let i = enemies.length - 1; i >= 0; i--) {
      enemies[i].update(player);
    }

    // Update AA guns
    if (wave % 3 === 0) {
      for (let i = aaguns.length - 1; i >= 0; i--) {
        aaguns[i].update(player);
        for (let j = bullets.length - 1; j >= 0; j--) {
          const b = bullets[j];
          if (dist(b.x, b.y, aaguns[i].x, aaguns[i].y) < 16 && !aaguns[i].dead) {
            aaguns[i].hp -= 12;
            bullets.splice(j, 1);
            if (aaguns[i].hp <= 0) { aaguns[i].dead = true; addScore(100); createExplosion(aaguns[i].x, aaguns[i].y, '#f87171', 10, 30); }
            break;
          }
        }
      }
    }

    // Particles
    for (let i = particles.length - 1; i >= 0; i--) {
      particles[i].update();
      if (particles[i].life <= 0) particles.splice(i, 1);
    }
    for (let i = explosions.length - 1; i >= 0; i--) {
      const e = explosions[i];
      e.x += e.vx; e.y += e.vy;
      e.vx *= 0.9; e.vy *= 0.9;
      e.life--;
      if (e.life <= 0) explosions.splice(i, 1);
    }
    for (let i = smokeTrails.length - 1; i >= 0; i--) {
      smokeTrails[i].life--;
      smokeTrails[i].alpha *= 0.92;
      if (smokeTrails[i].life <= 0) smokeTrails.splice(i, 1);
    }
    for (let c of clouds) {
      c.x += c.sp;
      if (c.x > CW + c.w) c.x = -c.w;
    }

    if (screenShake > 0) screenShake *= 0.9;
    if (comboTimer > 0) { comboTimer--; if (comboTimer <= 0) { combo = 0; comboMult = 1; } }

    // Player death
    if (player.dead) {
      lives--;
      if (lives <= 0) endGame();
      else {
        player.dead = false; player.hp = player.maxHp; player.invulnerable = 120;
        player.x = CW/2; player.y = CH/2;
        combo = 0; comboMult = 1; comboTimer = 0;
        bullets = []; missiles = [];
        updateHUD();
      }
      return;
    }

    // Draw
    ctx.save();
    if (screenShake > 0) ctx.translate(random(-screenShake, screenShake), random(-screenShake, screenShake));

    ctx.fillStyle = '#05050a';
    ctx.fillRect(0, 0, CW, CH);

    // Clouds
    for (const c of clouds) {
      ctx.globalAlpha = c.a;
      ctx.fillStyle = '#1e293b';
      ctx.beginPath();
      ctx.arc(c.x, c.y, c.h/2, 0, Math.PI*2);
      ctx.arc(c.x + c.w/2, c.y, c.h/2, 0, Math.PI*2);
      ctx.arc(c.x + c.w/4, c.y - c.h/3, c.h*0.7, 0, Math.PI*2);
      ctx.fill();
      ctx.globalAlpha = 1;
    }

    // Ground
    ctx.fillStyle = '#0a0a14';
    ctx.fillRect(0, CH - 60, CW, 60);
    ctx.fillStyle = '#1a1a2e';
    ctx.fillRect(0, CH - 30, CW, 30);

    // Draw smoke trails
    for (const s of smokeTrails) {
      ctx.globalAlpha = s.alpha;
      ctx.fillStyle = '#64748b';
      ctx.beginPath(); ctx.arc(s.x, s.y, s.size * (40 - s.life)/40, 0, Math.PI*2); ctx.fill();
      ctx.globalAlpha = 1;
    }

    // Draw range hint for AA guns
    if (wave % 3 === 0) {
      for (const a of aaguns) {
        if (a.dead) continue;
        ctx.strokeStyle = 'rgba(248,113,113,0.15)'; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.arc(a.x, a.y, a.range, 0, Math.PI*2); ctx.stroke();
      }
    }

    for (const e of enemies) e.draw();
    for (const a of aaguns) a.draw();
    for (const b of bullets) b.draw();
    for (const m of missiles) m.draw();
    for (const p of particles) p.draw();
    for (const e of explosions) {
      ctx.globalAlpha = e.life / 30;
      ctx.strokeStyle = e.color; ctx.lineWidth = 2; ctx.shadowColor = e.color; ctx.shadowBlur = 10;
      ctx.beginPath(); ctx.arc(e.x, e.y, e.size * (30 - e.life)/10, 0, Math.PI*2); ctx.stroke();
      ctx.shadowBlur = 0; ctx.globalAlpha = 1;
    }
    player.draw();

    ctx.restore();
    updateHUD();
    requestAnimationFrame(loop);
  }

  startScreen.style.display = 'flex';
  gameOverScreen.classList.remove('visible');
  updateHUD();

})();
</script>
</body>
</html>
