<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SUBMERGED</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #02040a; color: #e2e8f0;
    font-family: 'Courier New', Courier, monospace;
    overflow: hidden; height: 100vh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
  }
  canvas {
    display: block; border: 2px solid #1e293b;
    box-shadow: 0 0 60px rgba(56,189,248,0.1), inset 0 0 60px rgba(0,0,0,0.9);
    background: linear-gradient(#02040a, #0f172a); max-width: 100%; max-height: 90vh;
    cursor: crosshair;
  }
  #hud {
    position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 55px; pointer-events: none; z-index: 10;
    text-transform: uppercase; letter-spacing: 2px;
  }
  .hud-item { text-align: center; }
  .hud-label { font-size: 11px; color: #94a3b8; margin-bottom: 4px; }
  .hud-value { font-size: 24px; font-weight: bold; text-shadow: 0 0 12px currentColor; }
  .hud-value.hull { color: #f87171; }
  .hud-value.oxygen { color: #38bdf8; }
  .hud-value.torpedo { color: #fbbf24; }
  .hud-value.region { color: #a78bfa; }
  .hud-value.score { color: #34d399; }
  .hud-value.best { color: #f472b6; }
  #start-screen {
    position: absolute; inset: 0; background: radial-gradient(circle, #0f172a 0%, #02040a 100%);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    z-index: 20; text-align: center; backdrop-filter: blur(8px);
  }
  .title { font-size: 60px; font-weight: bold; color: #38bdf8; letter-spacing: 10px;
    margin-bottom: 10px; text-shadow: 0 0 30px rgba(56,189,248,0.8); }
  .subtitle { font-size: 16px; color: #94a3b8; letter-spacing: 6px; margin-bottom: 40px;
    text-shadow: 0 0 15px rgba(148,163,184,0.4); font-style: italic; }
  .controls { display: grid; grid-template-columns: repeat(3,1fr); gap: 14px;
    max-width: 360px; margin-bottom: 40px; }
  .control { padding: 10px 16px; border: 1px solid #334155; border-radius: 6px;
    background: rgba(30,41,59,0.5); color: #cbd5e1; font-size: 12px;
    text-transform: uppercase; letter-spacing: 1px; }
  .control kbd { color: #38bdf8; font-weight: bold; }
  .press-start {
    padding: 14px 42px; font-size: 20px; font-family: inherit; font-weight: bold;
    color: #38bdf8; background: transparent; border: 2px solid #38bdf8;
    border-radius: 6px; cursor: pointer; text-transform: uppercase;
    letter-spacing: 4px; transition: all 0.2s;
    box-shadow: 0 0 20px rgba(56,189,248,0.4);
  }
  .press-start:hover { background: #38bdf8; color: #02040a;
    box-shadow: 0 0 35px rgba(56,189,248,0.9); }
  #game-over {
    position: absolute; inset: 0; background: rgba(2,4,10,0.94);
    display: none; flex-direction: column; align-items: center; justify-content: center;
    z-index: 20; text-align: center; backdrop-filter: blur(10px);
  }
  #game-over.visible { display: flex; }
  .game-title { font-size: 52px; font-weight: bold; color: #f87171; margin-bottom: 16px;
    text-shadow: 0 0 25px rgba(248,113,113,0.8); }
  .final-stats { font-size: 20px; color: #e2e8f0; margin-bottom: 8px; }
  .press-r {
    padding: 14px 42px; font-size: 20px; font-family: inherit; font-weight: bold;
    color: #38bdf8; background: transparent; border: 2px solid #38bdf8;
    border-radius: 6px; cursor: pointer; text-transform: uppercase;
    letter-spacing: 4px; transition: all 0.2s;
    box-shadow: 0 0 20px rgba(56,189,248,0.4);
  }
  .press-r:hover { background: #38bdf8; color: #02040a;
    box-shadow: 0 0 35px rgba(56,189,248,0.9); }
  .scanlines {
    position: absolute; inset: 0; pointer-events: none; z-index: 30;
    background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%,
      rgba(0,0,0,0.35) 50%, rgba(0,0,0,0.35)); background-size: 100% 4px;
  }
  .vignette {
    position: absolute; inset: 0; pointer-events: none; z-index: 31;
    background: radial-gradient(circle at center, transparent 40%, rgba(0,0,0,0.9) 100%);
  }
</style>
</head>
<body>
  <div class="scanlines"></div>
  <div class="vignette"></div>
  <canvas id="gameCanvas" width="1000" height="700"></canvas>
  <div id="hud">
    <div class="hud-item"><div class="hud-label">hull</div><div class="hud-value hull" id="hullDisplay">100</div></div>
    <div class="hud-item"><div class="hud-label">oxygen</div><div class="hud-value oxygen" id="oxygenDisplay">100</div></div>
    <div class="hud-item"><div class="hud-label">torpedo</div><div class="hud-value torpedo" id="torpedoDisplay">8</div></div>
    <div class="hud-item"><div class="hud-label">region</div><div class="hud-value region" id="regionDisplay">1</div></div>
    <div class="hud-item"><div class="hud-label">score</div><div class="hud-value score" id="scoreDisplay">0</div></div>
    <div class="hud-item"><div class="hud-label">best</div><div class="hud-value best" id="bestScoreDisplay">0</div></div>
  </div>
  <div id="start-screen">
    <div class="title">SUBMERGED</div>
    <div class="subtitle">The deep is dark. Survive the descent.</div>
    <div class="controls">
      <div class="control">Move <kbd>WASD</kbd></div>
      <div class="control">Aim <kbd>MOUSE</kbd></div>
      <div class="control">Torpedo <kbd>CLICK</kbd></div>
    </div>
    <button class="press-start" id="startBtn">Dive</button>
  </div>
  <div id="game-over">
    <div class="game-title">Crush Depth</div>
    <div class="final-stats" id="finalScore">Score: 0</div>
    <div class="final-stats" id="finalRegion">Region reached: 1</div>
    <div class="final-stats" id="finalBest">Best score: 0</div>
    <button class="press-r" id="restartBtn">Restart (R)</button>
  </div>
<script>
(function(){
  'use strict';
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const CW = canvas.width, CH = canvas.height;

  const hullDisplay = document.getElementById('hullDisplay');
  const oxygenDisplay = document.getElementById('oxygenDisplay');
  const torpedoDisplay = document.getElementById('torpedoDisplay');
  const regionDisplay = document.getElementById('regionDisplay');
  const scoreDisplay = document.getElementById('scoreDisplay');
  const bestScoreDisplay = document.getElementById('bestScoreDisplay');
  const startScreen = document.getElementById('start-screen');
  const gameOverScreen = document.getElementById('game-over');
  const startBtn = document.getElementById('startBtn');
  const restartBtn = document.getElementById('restartBtn');
  const finalScore = document.getElementById('finalScore');
  const finalRegion = document.getElementById('finalRegion');
  const finalBest = document.getElementById('finalBest');

  let bestScore = 0;
  try {
    const s = localStorage.getItem('submergedBestScore');
    if (s !== null) bestScore = parseInt(s, 10) || 0;
  } catch (e) {}
  bestScoreDisplay.textContent = bestScore;

  const mouse = { x: CW/2, y: CH/2, down: false, justClicked: false };
  window.addEventListener('mousemove', (e) => {
    const rect = canvas.getBoundingClientRect();
    mouse.x = e.clientX - rect.left;
    mouse.y = e.clientY - rect.top;
  });
  window.addEventListener('mousedown', () => { mouse.down = true; mouse.justClicked = true; });
  window.addEventListener('mouseup', () => { mouse.down = false; });
  window.addEventListener('click', () => { mouse.justClicked = false; });
  canvas.addEventListener('contextmenu', e => e.preventDefault());

  const keys = {};
  window.addEventListener('keydown', (e) => { keys[e.code] = true; });
  window.addEventListener('keyup', (e) => { keys[e.code] = false; });

  function random(min, max) { return Math.random() * (max - min) + min; }
  function dist(x1, y1, x2, y2) {
    const dx = x2 - x1, dy = y2 - y1;
    return Math.sqrt(dx * dx + dy * dy);
  }
  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
  function angleTo(tx, ty, sx, sy) { return Math.atan2(ty - sy, tx - sx); }

  class Torpedo {
    constructor(x, y, angle) {
      this.x = x; this.y = y; this.angle = angle;
      this.speed = 10; this.life = 60; this.radius = 4;
      this.damage = 25;
      this.vx = Math.cos(angle) * this.speed;
      this.vy = Math.sin(angle) * this.speed;
    }
    update() {
      this.x += this.vx; this.y += this.vy;
      this.life--;
    }
    draw() {
      ctx.fillStyle = '#38bdf8'; ctx.shadowColor = '#38bdf8'; ctx.shadowBlur = 8;
      ctx.beginPath(); ctx.arc(this.x, this.y, this.radius, 0, Math.PI*2); ctx.fill();
      ctx.shadowBlur = 0;
    }
  }
  class Enemy {
    constructor(region) {
      this.radius = 10 + region * 0.8;
      this.hp = 30 + region * 12;
      this.maxHp = this.hp;
      this.speed = 1.2 + region * 0.08;
      this.damage = 12 + region * 2;
      this.dead = false;
      this.hitFlash = 0;
      const side = Math.floor(random(0, 4));
      const margin = 60;
      if (side === 0) { this.x = random(-margin, CW + margin); this.y = random(-margin, -margin); }
      else if (side === 1) { this.x = CW + margin; this.y = random(0, CH); }
      else if (side === 2) { this.x = random(-margin, CW + margin); this.y = CH + margin; }
      else { this.x = random(-margin, -margin); this.y = random(0, CH); }
    }
    update(player) {
      if (this.dead) return;
      if (this.hitFlash > 0) this.hitFlash--;
      const ang = angleTo(player.x, player.y, this.x, this.y);
      this.x += Math.cos(ang) * this.speed;
      this.y += Math.sin(ang) * this.speed;
      if (dist(this.x, this.y, player.x, player.y) < this.radius + player.radius && player.invulnerable <= 0) {
        player.hull -= this.damage;
        player.invulnerable = 60;
        screenShake = 8;
        if (player.hull <= 0) player.dead = true;
      }
    }
    draw() {
      if (this.dead) return;
      ctx.save();
      ctx.translate(this.x, this.y);
      ctx.fillStyle = this.hitFlash > 0 ? '#fbbf24' : '#f87171';
      ctx.shadowColor = '#f87171'; ctx.shadowBlur = 10;
      ctx.beginPath();
      ctx.moveTo(0, -this.radius);
      ctx.lineTo(this.radius * 0.866, this.radius * 0.5);
      ctx.lineTo(0, -this.radius * 0.2);
      ctx.lineTo(-this.radius * 0.866, this.radius * 0.5);
      ctx.closePath(); ctx.fill();
      ctx.shadowBlur = 0;
      ctx.restore();
    }
  }
  class Salvage {
    constructor() {
      this.x = random(40, CW - 40);
      this.y = random(40, CH - 40);
      this.radius = 6;
      this.value = 15;
      this.life = 500;
      this.bob = 0;
    }
    update() {
      this.bob += 0.12;
      this.life--;
    }
    draw() {
      ctx.save();
      ctx.translate(this.x, this.y + Math.sin(this.bob) * 4);
      ctx.fillStyle = '#fbbf24'; ctx.shadowColor = '#fbbf24'; ctx.shadowBlur = 12;
      ctx.beginPath(); ctx.arc(0, 0, this.radius, 0, Math.PI*2); ctx.fill();
      ctx.shadowBlur = 0;
      ctx.restore();
    }
  }
  class Particle {
    constructor(x, y, color) {
      this.x = x; this.y = y; this.color = color;
      const ang = random(0, Math.PI*2);
      const sp = random(1, 6);
      this.vx = Math.cos(ang) * sp; this.vy = Math.sin(ang) * sp;
      this.life = random(20, 40); this.maxLife = this.life;
      this.size = random(2, 5);
    }
    update() {
      this.x += this.vx; this.y += this.vy;
      this.vx *= 0.92; this.vy *= 0.92;
      this.life--;
    }
    draw() {
      const a = this.life / this.maxLife;
      ctx.globalAlpha = a; ctx.fillStyle = this.color;
      ctx.fillRect(this.x - this.size/2, this.y - this.size/2, this.size, this.size);
      ctx.globalAlpha = 1;
    }
  }

  let player;
  let torpedoes = [];
  let enemies = [];
  let salvages = [];
  let particles = [];
  let explosions = [];
  let bubbles = [];
  let depthHazards = [];
  let region = 1;
  let score = 0;
  let hull = 100;
  let maxHull = 100;
  let oxygen = 100;
  let maxOxygen = 100;
  let torpedoesLeft = 8;
  let gameRunning = false;
  let gameOver = false;
  let frameCount = 0;
  let spawnTimer = 0;
  let enemiesToSpawn = 0;
  let regionActive = false;
  let regionStartDelay = 60;
  let screenShake = 0;
  let oxygenDrainTimer = 0;

  function updateHUD() {
    hullDisplay.textContent = Math.ceil(hull);
    oxygenDisplay.textContent = Math.ceil(oxygen);
    torpedoDisplay.textContent = torpedoesLeft;
    regionDisplay.textContent = region;
    scoreDisplay.textContent = score;
    bestScoreDisplay.textContent = bestScore;
  }

  function addScore(amount) {
    score += amount;
    if (score > bestScore) {
      bestScore = score;
      try { localStorage.setItem('submergedBestScore', String(bestScore)); } catch (e) {}
    }
    updateHUD();
  }

  function createExplosion(x, y, color, count, speed) {
    for (let i = 0; i < count; i++) particles.push(new Particle(x, y, color));
  }

  function endGame() {
    gameOver = true;
    gameRunning = false;
    finalScore.textContent = 'Score: ' + score;
    finalRegion.textContent = 'Region reached: ' + region;
    finalBest.textContent = 'Best score: ' + bestScore;
    gameOverScreen.classList.add('visible');
    updateHUD();
  }

  function initGame() {
    player = { x: CW/2, y: CH/2, angle: 0, invulnerable: 0, dead: false, radius: 10, cooldown: 0 };
    hull = 100; maxHull = 100; oxygen = 100; maxOxygen = 100;
    torpedoesLeft = 8; score = 0; region = 1;
    torpedoes = []; enemies = []; salvages = []; particles = []; explosions = [];
    bubbles = []; depthHazards = [];
    gameOver = false; frameCount = 0; spawnTimer = 0;
    enemiesToSpawn = 0; regionActive = false; regionStartDelay = 60; screenShake = 0;
    oxygenDrainTimer = 0;
    for (let i = 0; i < 15; i++) bubbles.push({ x: random(0, CW), y: random(0, CH), r: random(2, 6), sp: random(0.5, 1.5), a: random(0.2, 0.6) });
    updateHUD();
    startRegion(1);
  }

  function startRegion(r) {
    region = r; regionActive = true;
    enemiesToSpawn = 4 + r * 3;
    spawnTimer = 0;
    regionStartDelay = 0;
    updateHUD();
  }

  function spawnEnemy() {
    if (enemiesToSpawn <= 0) return;
    enemies.push(new Enemy(region));
    enemiesToSpawn--;
    spawnTimer = random(30, 70) / (1 + region * 0.06);
  }

  function spawnSalvage() {
    if (random(0, 1) < 0.25) salvages.push(new Salvage());
  }

  function startGame() {
    startScreen.style.display = 'none';
    gameOverScreen.classList.remove('visible');
    initGame();
    gameRunning = true;
    requestAnimationFrame(loop);
  }

  startBtn.addEventListener('click', startGame);
  restartBtn.addEventListener('click', startGame);

  let torpedoCooldown = 0;
  function loop() {
    if (!gameRunning) return;
    frameCount++;

    if (keys['KeyR'] && gameOver) { startGame(); keys['KeyR'] = false; return; }

    if (mouse.down && torpedoCooldown <= 0 && torpedoesLeft > 0 && !player.dead) {
      const angle = player.angle;
      const bx = player.x + Math.cos(angle) * 16;
      const by = player.y + Math.sin(angle) * 16;
      torpedoes.push(new Torpedo(bx, by, angle));
      torpedoesLeft--;
      torpedoCooldown = 18;
      screenShake = 4;
      updateHUD();
    }
    if (torpedoCooldown > 0) torpedoCooldown--;

    // Player movement
    let dx = 0, dy = 0;
    if (keys['KeyW'] || keys['ArrowUp']) dy -= 1;
    if (keys['KeyS'] || keys['ArrowDown']) dy += 1;
    if (keys['KeyA'] || keys['ArrowLeft']) dx -= 1;
    if (keys['KeyD'] || keys['ArrowRight']) dx += 1;
    const len = Math.sqrt(dx*dx + dy*dy);
    if (len > 0) { dx /= len; dy /= len; }
    player.x += dx * 3.4; player.y += dy * 3.4;
    player.x = clamp(player.x, 16, CW - 16); player.y = clamp(player.y, 16, CH - 16);
    player.angle = angleTo(mouse.x, mouse.y, player.x, player.y);
    if (player.invulnerable > 0) player.invulnerable--;

    // Oxygen drain
    oxygenDrainTimer++;
    if (oxygenDrainTimer > 60) {
      oxygen -= 0.4;
      oxygenDrainTimer = 0;
      if (oxygen <= 0) {
        oxygen = 0;
        hull -= 0.5;
        screenShake = 4;
      }
      if (hull <= 0) player.dead = true;
    }

    // Region
    if (regionStartDelay > 0) {
      regionStartDelay--;
      if (regionStartDelay <= 0) startRegion(region);
    }

    if (regionActive) {
      if (enemiesToSpawn > 0 && spawnTimer <= 0) spawnEnemy();
      if (spawnTimer > 0) spawnTimer--;
      if (enemiesToSpawn <= 0 && enemies.length === 0) {
        regionActive = false;
        score += 150 + region * 30;
        addScore(0);
        regionStartDelay = 150;
        setTimeout(() => { if (gameRunning && !gameOver) startRegion(region + 1); }, 1600);
      }
    }

    // Torpedoes
    for (let i = torpedoes.length - 1; i >= 0; i--) {
      torpedoes[i].update();
      if (torpedoes[i].life <= 0 || torpedoes[i].x < 0 || torpedoes[i].x > CW || torpedoes[i].y < 0 || torpedoes[i].y > CH) {
        torpedoes.splice(i, 1); continue;
      }
      for (let e = enemies.length - 1; e >= 0; e--) {
        const en = enemies[e];
        if (en.dead) continue;
        if (dist(torpedoes[i].x, torpedoes[i].y, en.x, en.y) < en.radius + 4) {
          en.hp -= torpedoes[i].damage;
          torpedoes.splice(i, 1);
          if (en.hp <= 0) {
            en.dead = true;
            addScore(50 + region * 8);
            createExplosion(en.x, en.y, '#f87171', 10, 25);
            if (random(0, 1) < 0.3) salvages.push(new Salvage());
            enemies.splice(e, 1);
          }
          break;
        }
      }
    }

    // Enemies
    for (let i = enemies.length - 1; i >= 0; i--) {
      enemies[i].update(player);
    }

    // Salvage
    for (let i = salvages.length - 1; i >= 0; i--) {
      salvages[i].update();
      if (dist(salvages[i].x, salvages[i].y, player.x, player.y) < player.radius + salvages[i].radius) {
        addScore(salvages[i].value);
        salvages.splice(i, 1);
      } else if (salvages[i].life <= 0) {
        salvages.splice(i, 1);
      }
    }

    // Depth hazards (spikes on floor)
    if (frameCount % 400 === 0 && depthHazards.length < 6) {
      depthHazards.push({ x: random(60, CW - 60), y: CH - 40, w: random(40, 80), h: 20, life: 300 });
    }
    for (let i = depthHazards.length - 1; i >= 0; i--) {
      depthHazards[i].life--;
      if (dist(player.x, player.y, depthHazards[i].x + depthHazards[i].w/2, depthHazards[i].y) < player.radius + 30 && player.invulnerable <= 0) {
        hull -= 1;
        player.invulnerable = 30;
        screenShake = 3;
      }
      if (depthHazards[i].life <= 0) depthHazards.splice(i, 1);
    }

    // Particles
    for (let i = particles.length - 1; i >= 0; i--) {
      particles[i].update();
      if (particles[i].life <= 0) particles.splice(i, 1);
    }
    for (let i = explosions.length - 1; i >= 0; i--) {
      const e = explosions[i];
      e.x += e.vx; e.y += e.vy;
      e.vx *= 0.9; e.vy *= 0.9;
      e.life--;
      if (e.life <= 0) explosions.splice(i, 1);
    }
    // Bubbles rise
    for (const b of bubbles) {
      b.y -= b.sp;
      b.x += Math.sin(frameCount * 0.05 + b.x) * 0.5;
      if (b.y < -b.r) { b.y = CH + b.r; b.x = random(0, CW); }
    }

    if (screenShake > 0) screenShake *= 0.9;

    // Player death
    if (player.dead) {
      endGame();
      return;
    }

    // Draw
    ctx.save();
    if (screenShake > 0) ctx.translate(random(-screenShake, screenShake), random(-screenShake, screenShake));

    ctx.fillStyle = '#02040a';
    ctx.fillRect(0, 0, CW, CH);

    // Subtle depth gradient
    const grad = ctx.createLinearGradient(0, 0, 0, CH);
    grad.addColorStop(0, '#02040a');
    grad.addColorStop(1, '#0a0a1a');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, CW, CH);

    // Bubbles
    for (const b of bubbles) {
      ctx.globalAlpha = b.a;
      ctx.fillStyle = '#38bdf8';
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI*2); ctx.fill();
      ctx.globalAlpha = 1;
    }

    // Seafloor
    ctx.fillStyle = '#0a0a14';
    ctx.fillRect(0, CH - 60, CW, 60);
    ctx.fillStyle = '#1a1a2e';
    ctx.fillRect(0, CH - 25, CW, 25);
    // Depth lines
    ctx.strokeStyle = 'rgba(56,189,248,0.1)';
    ctx.lineWidth = 1;
    for (let y = CH - 60; y < CH; y += 8) {
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(CW, y); ctx.stroke();
    }

    // Depth hazards
    ctx.fillStyle = '#f87171';
    for (const h of depthHazards) {
      ctx.beginPath();
      for (let i = 0; i <= 4; i++) {
        const x = h.x + (i / 4) * h.w;
        const hgt = i % 2 === 0 ? h.h : h.h * 0.7;
        if (i === 0) ctx.moveTo(x, CH - 25);
        ctx.lineTo(x, CH - 25 - hgt);
        ctx.lineTo(x + h.w/4, CH - 25);
      }
      ctx.fill();
    }

    // Salvage
    for (const s of salvages) s.draw();

    // Torpedoes
    for (const t of torpedoes) t.draw();

    // Enemies
    for (const e of enemies) e.draw();

    // Particles
    for (const p of particles) p.draw();

    // Explosions
    for (const e of explosions) {
      ctx.globalAlpha = e.life / 30;
      ctx.strokeStyle = e.color; ctx.lineWidth = 2; ctx.shadowColor = e.color; ctx.shadowBlur = 10;
      ctx.beginPath(); ctx.arc(e.x, e.y, e.size * (30 - e.life)/10, 0, Math.PI*2); ctx.stroke();
      ctx.shadowBlur = 0; ctx.globalAlpha = 1;
    }

    // Player (submarine)
    ctx.save();
    ctx.translate(player.x, player.y);
    ctx.rotate(player.angle);
    ctx.fillStyle = '#38bdf8'; ctx.shadowColor = '#38bdf8'; ctx.shadowBlur = 14;
    ctx.beginPath();
    ctx.moveTo(14, 0); ctx.lineTo(-10, -9); ctx.lineTo(-6, 0); ctx.lineTo(-10, 9); ctx.closePath();
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.restore();

    ctx.restore();
    updateHUD();
    requestAnimationFrame(loop);
  }

  startScreen.style.display = 'flex';
  gameOverScreen.classList.remove('visible');
  updateHUD();

})();
</script>
</body>
