<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DUNGEON ZERO</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a0f; color: #e2e8f0;
    font-family: 'Courier New', Courier, monospace;
    overflow: hidden; height: 100vh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
  }
  canvas {
    display: block; border: 2px solid #334155;
    box-shadow: 0 0 60px rgba(16,185,129,0.15), inset 0 0 60px rgba(0,0,0,0.9);
    background: #050508; max-width: 100%; max-height: 90vh;
    cursor: crosshair;
  }
  #hud {
    position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 55px; pointer-events: none; z-index: 10;
    text-transform: uppercase; letter-spacing: 2px;
  }
  .hud-item { text-align: center; }
  .hud-label { font-size: 11px; color: #94a3b8; margin-bottom: 4px; }
  .hud-value { font-size: 24px; font-weight: bold; text-shadow: 0 0 12px currentColor; }
  .hud-value.hp { color: #f87171; }
  .hud-value.xp { color: #38bdf8; }
  .hud-value.floor { color: #a78bfa; }
  .hud-value.score { color: #fbbf24; }
  .hud-value.best { color: #34d399; }
  #upgrades-panel {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: 520px; display: none; flex-direction: column; gap: 14px;
    z-index: 20; background: rgba(10,10,15,0.95);
    border: 2px solid #38bdf8; border-radius: 12px; padding: 24px;
    backdrop-filter: blur(8px);
  }
  #upgrades-panel.visible { display: flex; }
  .upgrade-title { font-size: 24px; color: #38bdf8; text-align: center;
    margin-bottom: 16px; text-transform: uppercase; letter-spacing: 4px;
    text-shadow: 0 0 20px rgba(56,189,248,0.8); }
  .upgrade-option {
    display: flex; gap: 16px; background: rgba(30,41,59,0.8);
    border: 1px solid #475569; border-radius: 8px; padding: 14px;
    cursor: pointer; transition: all 0.15s; user-select: none;
  }
  .upgrade-option:hover { border-color: #38bdf8; background: rgba(30,41,59,1); }
  .upgrade-option h4 { color: #e2e8f0; margin-bottom: 4px; }
  .upgrade-option p { font-size: 12px; color: #94a3b8; }
  .upgrade-option .key { color: #fbbf24; font-weight: bold; margin-right: 8px; }
  #start-screen {
    position: absolute; inset: 0; background: radial-gradient(circle, #1a1a2e 0%, #0a0a0f 100%);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    z-index: 20; text-align: center; backdrop-filter: blur(8px);
  }
  .title { font-size: 60px; font-weight: bold; color: #38bdf8; letter-spacing: 8px;
    margin-bottom: 10px; text-shadow: 0 0 30px rgba(56,189,248,0.8); }
  .subtitle { font-size: 16px; color: #94a3b8; letter-spacing: 6px; margin-bottom: 40px;
    text-shadow: 0 0 15px rgba(148,163,184,0.4); font-style: italic; }
  .controls { display: grid; grid-template-columns: repeat(3,1fr); gap: 14px;
    max-width: 360px; margin-bottom: 40px; }
  .control { padding: 10px 16px; border: 1px solid #334155; border-radius: 6px;
    background: rgba(30,41,59,0.5); color: #cbd5e1; font-size: 12px;
    text-transform: uppercase; letter-spacing: 1px; }
  .control kbd { color: #38bdf8; font-weight: bold; }
  .press-start {
    padding: 14px 42px; font-size: 20px; font-family: inherit; font-weight: bold;
    color: #38bdf8; background: transparent; border: 2px solid #38bdf8;
    border-radius: 6px; cursor: pointer; text-transform: uppercase;
    letter-spacing: 4px; transition: all 0.2s;
    box-shadow: 0 0 20px rgba(56,189,248,0.4);
  }
  .press-start:hover { background: #38bdf8; color: #0a0a0f;
    box-shadow: 0 0 35px rgba(56,189,248,0.9); }
  #game-over {
    position: absolute; inset: 0; background: rgba(10,10,15,0.94);
    display: none; flex-direction: column; align-items: center; justify-content: center;
    z-index: 20; text-align: center; backdrop-filter: blur(10px);
  }
  #game-over.visible { display: flex; }
  .game-title { font-size: 52px; font-weight: bold; color: #f87171; margin-bottom: 16px;
    text-shadow: 0 0 25px rgba(248,113,113,0.8); }
  .final-stats { font-size: 20px; color: #e2e8f0; margin-bottom: 8px; }
  .press-r {
    padding: 14px 42px; font-size: 20px; font-family: inherit; font-weight: bold;
    color: #38bdf8; background: transparent; border: 2px solid #38bdf8;
    border-radius: 6px; cursor: pointer; text-transform: uppercase;
    letter-spacing: 4px; transition: all 0.2s;
    box-shadow: 0 0 20px rgba(56,189,248,0.4);
  }
  .press-r:hover { background: #38bdf8; color: #0a0a0f;
    box-shadow: 0 0 35px rgba(56,189,248,0.9); }
  .scanlines {
    position: absolute; inset: 0; pointer-events: none; z-index: 30;
    background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%,
      rgba(0,0,0,0.35) 50%, rgba(0,0,0,0.35)); background-size: 100% 4px;
  }
  .vignette {
    position: absolute; inset: 0; pointer-events: none; z-index: 31;
    background: radial-gradient(circle at center, transparent 40%, rgba(0,0,0,0.85) 100%);
  }
</style>
</head>
<body>
  <div class="scanlines"></div>
  <div class="vignette"></div>
  <canvas id="gameCanvas" width="1000" height="700"></canvas>
  <div id="hud">
    <div class="hud-item"><div class="hud-label">hp</div><div class="hud-value hp" id="hpDisplay">100</div></div>
    <div class="hud-item"><div class="hud-label">xp</div><div class="hud-value xp" id="xpDisplay">0</div></div>
    <div class="hud-item"><div class="hud-label">floor</div><div class="hud-value floor" id="floorDisplay">1</div></div>
    <div class="hud-item"><div class="hud-label">score</div><div class="hud-value score" id="scoreDisplay">0</div></div>
    <div class="hud-item"><div class="hud-label">best floor</div><div class="hud-value best" id="bestFloorDisplay">0</div></div>
  </div>
  <div id="upgrades-panel">
    <div class="upgrade-title">Level Up!</div>
    <div class="upgrade-option" id="opt1"><h4>Option 1</h4><p>Description</p></div>
    <div class="upgrade-option" id="opt2"><h4>Option 2</h4><p>Description</p></div>
    <div class="upgrade-option" id="opt3"><h4>Option 3</h4><p>Description</p></div>
  </div>
  <div id="start-screen">
    <div class="title">DUNGEON ZERO</div>
    <div class="subtitle">Descend into the depths. Survive the dark.</div>
    <div class="controls">
      <div class="control">Move <kbd>WASD</kbd></div>
      <div class="control">Aim <kbd>MOUSE</kbd></div>
      <div class="control">Attack <kbd>CLICK</kbd></div>
    </div>
    <button class="press-start" id="startBtn">Begin Descent</button>
  </div>
  <div id="game-over">
    <div class="game-title">Run Ended</div>
    <div class="final-stats" id="finalScore">Score: 0</div>
    <div class="final-stats" id="finalFloor">Floor reached: 1</div>
    <div class="final-stats" id="finalBest">Best floor: 0</div>
    <button class="press-r" id="restartBtn">Restart (R)</button>
  </div>
<script>
(function(){
  'use strict';
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const CW = canvas.width, CH = canvas.height;

  const hpDisplay = document.getElementById('hpDisplay');
  const xpDisplay = document.getElementById('xpDisplay');
  const floorDisplay = document.getElementById('floorDisplay');
  const scoreDisplay = document.getElementById('scoreDisplay');
  const bestFloorDisplay = document.getElementById('bestFloorDisplay');
  const startScreen = document.getElementById('start-screen');
  const gameOverScreen = document.getElementById('game-over');
  const startBtn = document.getElementById('startBtn');
  const restartBtn = document.getElementById('restartBtn');
  const finalScore = document.getElementById('finalScore');
  const finalFloor = document.getElementById('finalFloor');
  const finalBest = document.getElementById('finalBest');
  const upgradesPanel = document.getElementById('upgrades-panel');

  let bestFloor = 0;
  try {
    const s = localStorage.getItem('dungeonZeroBestFloor');
    if (s !== null) bestFloor = parseInt(s, 10) || 0;
  } catch (e) {}
  bestFloorDisplay.textContent = bestFloor;

  const mouse = { x: CW/2, y: CH/2 };
  window.addEventListener('mousemove', (e) => {
    const rect = canvas.getBoundingClientRect();
    mouse.x = e.clientX - rect.left;
    mouse.y = e.clientY - rect.top;
  });
  window.addEventListener('mousedown', () => { mouse.down = true; });
  window.addEventListener('mouseup', () => { mouse.down = false; });
  canvas.addEventListener('contextmenu', e => e.preventDefault());

  const keys = {};
  window.addEventListener('keydown', (e) => { keys[e.code] = true; });
  window.addEventListener('keyup', (e) => { keys[e.code] = false; });

  function random(min, max) { return Math.random() * (max - min) + min; }
  function dist(x1, y1, x2, y2) {
    const dx = x2 - x1, dy = y2 - y1;
    return Math.sqrt(dx * dx + dy * dy);
  }
  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
  function angleTo(tx, ty, sx, sy) { return Math.atan2(ty - sy, tx - sx); }

  // Upgrade definitions for level up
  const UPGRADES = [
    { name: 'Might', desc: '+20% damage', apply: s => { s.dmgMult *= 1.2; } },
    { name: 'Vigor', desc: '+25 max HP', apply: s => { s.maxHp += 25; s.hp = s.maxHp; } },
    { name: 'Agility', desc: '+10% move speed', apply: s => { s.speed *= 1.1; } },
    { name: 'Focus', desc: '+15% attack speed', apply: s => { s.atkMult *= 1.15; } },
    { name: 'Resilience', desc: '+15 max HP, heal', apply: s => { s.maxHp += 15; s.hp = Math.min(s.hp + 15, s.maxHp); } },
    { name: 'Celerity', desc: '+20% move speed', apply: s => { s.speed *= 1.2; } },
  ];

  class Player {
    constructor() { this.reset(); }
    reset() {
      this.x = CW / 2; this.y = CH / 2;
      this.vx = 0; this.vy = 0;
      this.angle = 0;
      this.radius = 10;
      this.hp = 100; this.maxHp = 100;
      this.xp = 0; this.xpToNext = 30; this.level = 1;
      this.score = 0;
      this.speed = 4.0;
      this.dmgMult = 1.0; this.atkMult = 1.0;
      this.cooldown = 0;
      this.dead = false;
      this.invulnerable = 0;
    }
    get atkCooldown() { return Math.max(6, 20 / this.atkMult); }
    update() {
      if (this.dead) return;
      let dx = 0, dy = 0;
      if (keys['KeyW'] || keys['ArrowUp']) dy -= 1;
      if (keys['KeyS'] || keys['ArrowDown']) dy += 1;
      if (keys['KeyA'] || keys['ArrowLeft']) dx -= 1;
      if (keys['KeyD'] || keys['ArrowRight']) dx += 1;
      const len = Math.sqrt(dx*dx + dy*dy);
      if (len > 0) { dx /= len; dy /= len; }
      this.vx = dx * this.speed; this.vy = dy * this.speed;
      this.x += this.vx; this.y += this.vy;
      this.x = clamp(this.x, 12, CW - 12); this.y = clamp(this.y, 12, CH - 12);
      this.angle = angleTo(mouse.x, mouse.y, this.x, this.y);
      if (this.cooldown > 0) this.cooldown--;
      if (this.invulnerable > 0) this.invulnerable--;
    }
    draw() {
      if (this.dead) return;
      ctx.save();
      ctx.translate(this.x, this.y);
      ctx.rotate(this.angle);
      const flash = this.invulnerable > 0 && frameCount % 6 < 3;
      if (flash) ctx.globalAlpha = 0.4;
      ctx.lineWidth = 3;
      ctx.strokeStyle = '#38bdf8'; ctx.shadowColor = '#38bdf8'; ctx.shadowBlur = 14;
      ctx.beginPath();
      ctx.moveTo(14, 0); ctx.lineTo(-10, -9); ctx.lineTo(-6, 0); ctx.lineTo(-10, 9); ctx.closePath();
      ctx.stroke();
      ctx.fillStyle = '#38bdf8'; ctx.globalAlpha = 0.25; ctx.fill();
      ctx.globalAlpha = 1; ctx.shadowBlur = 0;
      ctx.strokeStyle = 'rgba(56,189,248,0.35)'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(Math.cos(this.angle)*130, Math.sin(this.angle)*130); ctx.stroke();
      ctx.restore();
      this.drawHpBar();
    }
    drawHpBar() {
      const bw = 36, bh = 4;
      const x = this.x - bw/2, y = this.y - 20;
      ctx.fillStyle = '#111'; ctx.fillRect(x, y, bw, bh);
      ctx.fillStyle = this.hp > 30 ? '#10b981' : '#f87171';
      ctx.fillRect(x, y, bw * (this.hp / this.maxHp), bh);
      ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1; ctx.strokeRect(x, y, bw, bh);
    }
    takeDamage(amount) {
      if (this.invulnerable > 0) return;
      this.hp -= amount;
      this.invulnerable = 60;
      createExplosion(this.x, this.y, '#f87171', 8, 20);
      screenShake = 10;
      if (this.hp <= 0) { this.hp = 0; this.dead = true; endGame(); }
      updateHUD();
    }
    gainXp(amount) {
      this.xp += amount;
      if (this.xp >= this.xpToNext) {
        this.xp -= this.xpToNext;
        this.level++;
        this.xpToNext = Math.floor(this.xpToNext * 1.5);
        openUpgrades();
      }
      updateHUD();
    }
  }
  class Projectile {
    constructor(x, y, angle, damage, speed, color) {
      this.x = x; this.y = y; this.angle = angle;
      this.damage = damage; this.speed = speed; this.color = color;
      this.life = 45; this.radius = 3;
      this.vx = Math.cos(angle) * speed;
      this.vy = Math.sin(angle) * speed;
    }
    update() {
      this.x += this.vx; this.y += this.vy;
      this.life--;
    }
    draw() {
      ctx.fillStyle = this.color; ctx.shadowColor = this.color; ctx.shadowBlur = 8;
      ctx.beginPath(); ctx.arc(this.x, this.y, this.radius, 0, Math.PI*2);
      ctx.fill(); ctx.shadowBlur = 0;
    }
  }
  class Enemy {
    constructor(floor) {
      this.radius = 9 + floor * 0.5;
      this.hp = 25 + floor * 15;
      this.maxHp = this.hp;
      this.speed = 1.2 + floor * 0.08;
      this.damage = 10 + floor * 2;
      this.xpValue = 15 + floor * 3;
      this.dead = false;
      this.hitFlash = 0;
      const side = Math.floor(random(0, 4));
      const margin = 40;
      if (side === 0) { this.x = random(0, CW); this.y = -margin; }
      else if (side === 1) { this.x = CW + margin; this.y = random(0, CH); }
      else if (side === 2) { this.x = random(0, CW); this.y = CH + margin; }
      else { this.x = -margin; this.y = random(0, CH); }
    }
    update(player) {
      if (this.dead) return;
      if (this.hitFlash > 0) this.hitFlash--;
      const ang = angleTo(player.x, player.y, this.x, this.y);
      this.x += Math.cos(ang) * this.speed;
      this.y += Math.sin(ang) * this.speed;
      if (dist(this.x, this.y, player.x, player.y) < this.radius + player.radius && player.invulnerable <= 0) {
        player.takeDamage(this.damage);
      }
    }
    takeDamage(amount) {
      this.hp -= amount;
      this.hitFlash = 6;
      if (this.hp <= 0 && !this.dead) {
        this.dead = true;
        return true;
      }
      return false;
    }
    draw() {
      if (this.dead) return;
      ctx.save();
      ctx.translate(this.x, this.y);
      ctx.fillStyle = this.hitFlash > 0 ? '#fbbf24' : '#ef4444';
      ctx.shadowColor = '#ef4444'; ctx.shadowBlur = 10;
      ctx.beginPath();
      ctx.moveTo(0, -this.radius);
      ctx.lineTo(this.radius * 0.866, this.radius * 0.5);
      ctx.lineTo(0, -this.radius * 0.2);
      ctx.lineTo(-this.radius * 0.866, this.radius * 0.5);
      ctx.closePath(); ctx.fill();
      ctx.shadowBlur = 0;
      ctx.restore();
    }
  }
  class Item {
    constructor(x, y, type) {
      this.x = x; this.y = y; this.type = type; // 'heal', 'xp', 'trap'
      this.radius = 7;
      this.bob = 0;
      this.collected = false;
      this.life = type === 'trap' ? 9999 : 300;
    }
    update() {
      if (this.collected) return;
      this.bob += 0.15;
      this.life--;
      if (this.life <= 0 && this.type !== 'trap') this.collected = true;
    }
    draw() {
      if (this.collected) return;
      ctx.save();
      ctx.translate(this.x, this.y + Math.sin(this.bob) * 4);
      if (this.type === 'heal') {
        ctx.fillStyle = '#10b981'; ctx.shadowColor = '#10b981'; ctx.shadowBlur = 12;
        ctx.beginPath(); ctx.arc(0, 0, this.radius, 0, Math.PI*2); ctx.fill();
      } else if (this.type === 'xp') {
        ctx.fillStyle = '#38bdf8'; ctx.shadowColor = '#38bdf8'; ctx.shadowBlur = 12;
        ctx.beginPath(); ctx.arc(0, 0, this.radius, 0, Math.PI*2); ctx.fill();
      } else {
        ctx.fillStyle = '#f87171'; ctx.shadowColor = '#f87171'; ctx.shadowBlur = 12;
        ctx.beginPath(); ctx.moveTo(0, -this.radius); ctx.lineTo(this.radius, this.radius);
        ctx.lineTo(0, this.radius*0.3); ctx.lineTo(-this.radius, this.radius); ctx.closePath(); ctx.fill();
      }
      ctx.shadowBlur = 0;
      ctx.restore();
    }
  }
  class Particle {
    constructor(x, y, color) {
      this.x = x; this.y = y; this.color = color;
      const ang = random(0, Math.PI*2);
      const sp = random(1, 6);
      this.vx = Math.cos(ang) * sp; this.vy = Math.sin(ang) * sp;
      this.life = random(20, 40); this.maxLife = this.life;
      this.size = random(2, 5);
    }
    update() {
      this.x += this.vx; this.y += this.vy;
      this.vx *= 0.92; this.vy *= 0.92;
      this.life--;
    }
    draw() {
      const a = this.life / this.maxLife;
      ctx.globalAlpha = a; ctx.fillStyle = this.color;
      ctx.fillRect(this.x - this.size/2, this.y - this.size/2, this.size, this.size);
      ctx.globalAlpha = 1;
    }
  }

  // Dungeon generation
  const ROOM_MIN = 70, ROOM_MAX = 140;
  const MAX_ROOMS = 10;
  let rooms = [];
  let doors = [];

  function generateDungeon(floor) {
    rooms = []; doors = [];
    const attempts = 200;
    for (let i = 0; i < attempts; i++) {
      const w = random(ROOM_MIN, ROOM_MAX);
      const h = random(ROOM_MIN, ROOM_MAX);
      const x = random(60, CW - 60 - w);
      const y = random(60, CH - 60 - h);
      const newRoom = { x, y, w, h, cx: x + w/2, cy: y + h/2 };
      let ok = true;
      for (const r of rooms) {
        if (newRoom.x < r.x + r.w + 12 && newRoom.x + newRoom.w > r.x - 12 &&
            newRoom.y < r.y + r.h + 12 && newRoom.y + newRoom.h > r.y - 12) {
          ok = false; break;
        }
      }
      if (!ok) continue;
      rooms.push(newRoom);
      if (rooms.length > 1) {
        const prev = rooms[rooms.length - 2];
        doors.push({ x: (prev.cx + newRoom.cx)/2, y: (prev.cy + newRoom.cy)/2 });
      }
      if (rooms.length >= MAX_ROOMS) break;
    }
  }

  // Game state
  let player;
  let projectiles = [];
  let enemies = [];
  let items = [];
  let particles = [];
  let explosions = [];
  let floor = 1;
  let score = 0;
  let gameRunning = false;
  let gameOver = false;
  let frameCount = 0;
  let screenShake = 0;
  let spawnTimer = 0;
  let upgradesOpen = false;

  function updateHUD() {
    hpDisplay.textContent = Math.ceil(player.hp) + '/' + player.maxHp;
    xpDisplay.textContent = player.xp + '/' + player.xpToNext;
    floorDisplay.textContent = floor;
    scoreDisplay.textContent = score;
    bestFloorDisplay.textContent = bestFloor;
  }

  function createExplosion(x, y, color, count, speed) {
    for (let i = 0; i < count; i++) explosions.push({ x, y, color, vx: (random(0,1)-0.5)*speed*2, vy: (random(0,1)-0.5)*speed*2, life: random(15,30), size: random(2,5) });
  }

  function openUpgrades() {
    upgradesOpen = true;
    gameRunning = false;
    const opts = [];
    const used = new Set();
    while (opts.length < 3 && used.size < UPGRADES.length) {
      const idx = Math.floor(random(0, UPGRADES.length));
      if (used.has(idx)) continue;
      used.add(idx);
      opts.push(UPGRADES[idx]);
    }
    const els = [
      { el: document.getElementById('opt1'), u: opts[0] },
      { el: document.getElementById('opt2'), u: opts[1] },
      { el: document.getElementById('opt3'), u: opts[2] },
    ];
    for (const { el, u } of els) {
      el.querySelector('h4').textContent = u.name;
      el.querySelector('p').textContent = u.desc;
      el.onclick = () => { u.apply(player); closeUpgrades(); };
    }
    upgradesPanel.classList.add('visible');
    updateHUD();
  }

  function closeUpgrades() {
    upgradesOpen = false;
    upgradesPanel.classList.remove('visible');
    gameRunning = true;
    requestAnimationFrame(loop);
  }

  function initGame() {
    player = new Player();
    projectiles = []; enemies = []; items = []; particles = []; explosions = [];
    floor = 1; score = 0; frameCount = 0; screenShake = 0; spawnTimer = 0;
    gameOver = false; gameRunning = true; upgradesOpen = false;
    generateDungeon(floor);
    updateHUD();
    upgradesPanel.classList.remove('visible');
  }

  function nextFloor() {
    floor++;
    player.xpToNext = Math.floor(player.xpToNext * 1.4);
    generateDungeon(floor);
    enemies = []; projectiles = [];
    screenShake = 15;
    createExplosion(player.x, player.y, '#38bdf8', 15, 30);
    updateHUD();
  }

  function endGame() {
    gameOver = true;
    gameRunning = false;
    if (floor > bestFloor) {
      bestFloor = floor;
      try { localStorage.setItem('dungeonZeroBestFloor', String(bestFloor)); } catch (e) {}
    }
    finalScore.textContent = 'Score: ' + score;
    finalFloor.textContent = 'Floor reached: ' + floor;
    finalBest.textContent = 'Best floor: ' + bestFloor;
    gameOverScreen.classList.add('visible');
    updateHUD();
  }

  function startGame() {
    startScreen.style.display = 'none';
    gameOverScreen.classList.remove('visible');
    initGame();
    requestAnimationFrame(loop);
  }

  startBtn.addEventListener('click', startGame);
  restartBtn.addEventListener('click', startGame);

  function loop() {
    if (!gameRunning || upgradesOpen) return;
    frameCount++;

    if (keys['KeyR'] && gameOver) { startGame(); keys['KeyR'] = false; return; }

    player.update();

    if (mouse.down && player.cooldown <= 0 && !player.dead) {
      const angle = player.angle;
      const bx = player.x + Math.cos(angle) * 16;
      const by = player.y + Math.sin(angle) * 16;
      projectiles.push(new Projectile(bx, by, angle, 12 * player.dmgMult, 14, '#38bdf8'));
      player.cooldown = player.atkCooldown;
      screenShake = 3;
      for (let i = 0; i < 2; i++) particles.push(new Particle(bx, by, '#38bdf8'));
    }

    for (let i = projectiles.length - 1; i >= 0; i--) {
      projectiles[i].update();
      if (projectiles[i].life <= 0 || projectiles[i].x < 0 || projectiles[i].x > CW ||
          projectiles[i].y < 0 || projectiles[i].y > CH) {
        projectiles.splice(i, 1); continue;
      }
      for (let e = enemies.length - 1; e >= 0; e--) {
        const en = enemies[e];
        if (en.dead) continue;
        if (dist(projectiles[i].x, projectiles[i].y, en.x, en.y) < en.radius + 3) {
          if (en.takeDamage(projectiles[i].damage)) {
            score += 25 + floor * 5;
            player.gainXp(en.xpValue);
            createExplosion(en.x, en.y, '#ef4444', 6, 20);
            if (random(0, 1) < 0.3) items.push(new Item(en.x, en.y, 'heal'));
            if (random(0, 1) < 0.2) items.push(new Item(en.x, en.y, 'xp'));
            enemies.splice(e, 1);
          }
          projectiles.splice(i, 1);
          break;
        }
      }
    }

    if (spawnTimer <= 0 && enemies.length < 4 + floor * 2) {
      enemies.push(new Enemy(floor));
      spawnTimer = random(60, 140) / (1 + floor * 0.05);
    }
    if (spawnTimer > 0) spawnTimer--;

    for (let i = enemies.length - 1; i >= 0; i--) {
      enemies[i].update(player);
    }

    for (let i = items.length - 1; i >= 0; i--) {
      const it = items[i];
      it.update();
      if (it.collected) { items.splice(i, 1); continue; }
      if (dist(it.x, it.y, player.x, player.y) < player.radius + it.radius) {
        if (it.type === 'heal') {
          player.hp = Math.min(player.hp + 30, player.maxHp);
          score += 10;
        } else if (it.type === 'xp') {
          player.gainXp(40);
          score += 10;
        } else {
          player.takeDamage(20);
        }
        items.splice(i, 1);
        updateHUD();
      }
    }

    for (let i = particles.length - 1; i >= 0; i--) {
      particles[i].update();
      if (particles[i].life <= 0) particles.splice(i, 1);
    }
    for (let i = explosions.length - 1; i >= 0; i--) {
      const e = explosions[i];
      e.x += e.vx; e.y += e.vy;
      e.vx *= 0.9; e.vy *= 0.9;
      e.life--;
      if (e.life <= 0) explosions.splice(i, 1);
    }

    if (screenShake > 0) screenShake *= 0.9;

    // Floor clear check
    if (enemies.length === 0) {
      nextFloor();
    }

    ctx.save();
    if (screenShake > 0) {
      ctx.translate(random(-screenShake, screenShake), random(-screenShake, screenShake));
    }

    ctx.fillStyle = '#050508';
    ctx.fillRect(0, 0, CW, CH);

    // Draw rooms
    ctx.fillStyle = '#0f172a'; ctx.strokeStyle = '#38bdf8'; ctx.lineWidth = 2;
    ctx.shadowColor = '#38bdf8'; ctx.shadowBlur = 10;
    for (const r of rooms) {
      ctx.beginPath(); ctx.rect(r.x, r.y, r.w, r.h); ctx.stroke();
      ctx.fillStyle = 'rgba(56,189,248,0.06)'; ctx.fill();
      ctx.fillStyle = '#0f172a';
    }
    ctx.shadowBlur = 0;

    // Draw doors
    ctx.fillStyle = '#fbbf24'; ctx.shadowColor = '#fbbf24'; ctx.shadowBlur = 12;
    for (const d of doors) {
      ctx.beginPath(); ctx.arc(d.x, d.y, 10, 0, Math.PI*2); ctx.fill();
    }
    ctx.shadowBlur = 0;

    for (const p of projectiles) p.draw();
    for (const e of enemies) e.draw();
    for (const it of items) it.draw();
    for (const p of particles) p.draw();
    player.draw();

    ctx.restore();

    updateHUD();
    requestAnimationFrame(loop);
  }

  startScreen.style.display = 'flex';
  gameOverScreen.classList.remove('visible');
  updateHUD();

})();
</script>
