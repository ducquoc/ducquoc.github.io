<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CYBER SURVIVOR</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a0f; color: #e2e8f0;
    font-family: 'Courier New', Courier, monospace;
    overflow: hidden; height: 100vh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
  }
  canvas {
    display: block; border: 2px solid #1e293b;
    box-shadow: 0 0 60px rgba(255,0,255,0.15), inset 0 0 60px rgba(0,0,0,0.9);
    background: #050508; max-width: 100%; max-height: 90vh;
    cursor: crosshair;
  }
  #hud {
    position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 55px; pointer-events: none; z-index: 10;
    text-transform: uppercase; letter-spacing: 2px;
  }
  .hud-item { text-align: center; }
  .hud-label { font-size: 11px; color: #94a3b8; margin-bottom: 4px; }
  .hud-value { font-size: 24px; font-weight: bold; text-shadow: 0 0 12px currentColor; }
  .hud-value.hp { color: #f87171; }
  .hud-value.xp { color: #38bdf8; }
  .hud-value.level { color: #a78bfa; }
  .hud-value.kills { color: #fbbf24; }
  .hud-value.timer { color: #34d399; }
  .hud-value.best { color: #f472b6; }
  #upgrades-panel {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: 520px; display: none; flex-direction: column; gap: 14px;
    z-index: 20; background: rgba(10,10,15,0.95);
    border: 2px solid #a78bfa; border-radius: 12px; padding: 24px;
    backdrop-filter: blur(8px);
  }
  #upgrades-panel.visible { display: flex; }
  .upgrade-title { font-size: 24px; color: #a78bfa; text-align: center;
    margin-bottom: 16px; text-transform: uppercase; letter-spacing: 4px;
    text-shadow: 0 0 20px rgba(167,139,250,0.8); }
  .upgrade-option {
    display: flex; gap: 16px; background: rgba(30,41,59,0.8);
    border: 1px solid #475569; border-radius: 8px; padding: 14px;
    cursor: pointer; transition: all 0.15s; user-select: none;
  }
  .upgrade-option:hover { border-color: #a78bfa; background: rgba(30,41,59,1); }
  .upgrade-option h4 { color: #e2e8f0; margin-bottom: 4px; }
  .upgrade-option p { font-size: 12px; color: #94a3b8; }
  .upgrade-option .key { color: #fbbf24; font-weight: bold; margin-right: 8px; }
  #start-screen {
    position: absolute; inset: 0; background: radial-gradient(circle, #1a1a2e 0%, #0a0a0f 100%);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    z-index: 20; text-align: center; backdrop-filter: blur(8px);
  }
  .title { font-size: 60px; font-weight: bold; color: #a78bfa; letter-spacing: 10px;
    margin-bottom: 10px; text-shadow: 0 0 30px rgba(167,139,250,0.8); }
  .subtitle { font-size: 16px; color: #94a3b8; letter-spacing: 6px; margin-bottom: 40px;
    text-shadow: 0 0 15px rgba(148,163,184,0.4); font-style: italic; }
  .controls { display: grid; grid-template-columns: repeat(3,1fr); gap: 14px;
    max-width: 360px; margin-bottom: 40px; }
  .control { padding: 10px 16px; border: 1px solid #334155; border-radius: 6px;
    background: rgba(30,41,59,0.5); color: #cbd5e1; font-size: 12px;
    text-transform: uppercase; letter-spacing: 1px; }
  .control kbd { color: #a78bfa; font-weight: bold; }
  .press-start {
    padding: 14px 42px; font-size: 20px; font-family: inherit; font-weight: bold;
    color: #a78bfa; background: transparent; border: 2px solid #a78bfa;
    border-radius: 6px; cursor: pointer; text-transform: uppercase;
    letter-spacing: 4px; transition: all 0.2s;
    box-shadow: 0 0 20px rgba(167,139,250,0.4);
  }
  .press-start:hover { background: #a78bfa; color: #0a0a0f;
    box-shadow: 0 0 35px rgba(167,139,250,0.9); }
  #game-over {
    position: absolute; inset: 0; background: rgba(10,10,15,0.94);
    display: none; flex-direction: column; align-items: center; justify-content: center;
    z-index: 20; text-align: center; backdrop-filter: blur(10px);
  }
  #game-over.visible { display: flex; }
  .game-title { font-size: 52px; font-weight: bold; color: #f87171; margin-bottom: 16px;
    text-shadow: 0 0 25px rgba(248,113,113,0.8); }
  .final-stats { font-size: 20px; color: #e2e8f0; margin-bottom: 8px; }
  .press-r {
    padding: 14px 42px; font-size: 20px; font-family: inherit; font-weight: bold;
    color: #a78bfa; background: transparent; border: 2px solid #a78bfa;
    border-radius: 6px; cursor: pointer; text-transform: uppercase;
    letter-spacing: 4px; transition: all 0.2s;
    box-shadow: 0 0 20px rgba(167,139,250,0.4);
  }
  .press-r:hover { background: #a78bfa; color: #0a0a0f;
    box-shadow: 0 0 35px rgba(167,139,250,0.9); }
  .scanlines {
    position: absolute; inset: 0; pointer-events: none; z-index: 30;
    background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%,
      rgba(0,0,0,0.35) 50%, rgba(0,0,0,0.35)); background-size: 100% 4px;
  }
  .vignette {
    position: absolute; inset: 0; pointer-events: none; z-index: 31;
    background: radial-gradient(circle at center, transparent 40%, rgba(0,0,0,0.9) 100%);
  }
</style>
</head>
<body>
  <div class="scanlines"></div>
  <div class="vignette"></div>
  <canvas id="gameCanvas" width="1000" height="700"></canvas>
  <div id="hud">
    <div class="hud-item"><div class="hud-label">hp</div><div class="hud-value hp" id="hpDisplay">100</div></div>
    <div class="hud-item"><div class="hud-label">xp</div><div class="hud-value xp" id="xpDisplay">0</div></div>
    <div class="hud-item"><div class="hud-label">level</div><div class="hud-value level" id="levelDisplay">1</div></div>
    <div class="hud-item"><div class="hud-label">kills</div><div class="hud-value kills" id="killsDisplay">0</div></div>
    <div class="hud-item"><div class="hud-label">time</div><div class="hud-value timer" id="timerDisplay">0:00</div></div>
    <div class="hud-item"><div class="hud-label">best</div><div class="hud-value best" id="bestTimerDisplay">0:00</div></div>
  </div>
  <div id="upgrades-panel">
    <div class="upgrade-title">Level Up!</div>
    <div class="upgrade-option" id="opt1"><h4>Option 1</h4><p>Description</p></div>
    <div class="upgrade-option" id="opt2"><h4>Option 2</h4><p>Description</p></div>
    <div class="upgrade-option" id="opt3"><h4>Option 3</h4><p>Description</p></div>
  </div>
  <div id="start-screen">
    <div class="title">CYBER SURVIVOR</div>
    <div class="subtitle">Survive the horde. Evolve or die.</div>
    <div class="controls">
      <div class="control">Move <kbd>WASD</kbd></div>
      <div class="control">Weapons <kbd>AUTO</kbd></div>
      <div class="control">Upgrade <kbd>LEVEL UP</kbd></div>
    </div>
    <button class="press-start" id="startBtn">Survive</button>
  </div>
  <div id="game-over">
    <div class="game-title">Core Breach</div>
    <div class="final-stats" id="finalScore">Score: 0</div>
    <div class="final-stats" id="finalTime">Survived: 0:00</div>
    <div class="final-stats" id="finalBest">Best time: 0:00</div>
    <button class="press-r" id="restartBtn">Restart (R)</button>
  </div>
<script>
(function(){
  'use strict';
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const CW = canvas.width, CH = canvas.height;

  const hpDisplay = document.getElementById('hpDisplay');
  const xpDisplay = document.getElementById('xpDisplay');
  const levelDisplay = document.getElementById('levelDisplay');
  const killsDisplay = document.getElementById('killsDisplay');
  const timerDisplay = document.getElementById('timerDisplay');
  const bestTimerDisplay = document.getElementById('bestTimerDisplay');
  const startScreen = document.getElementById('start-screen');
  const gameOverScreen = document.getElementById('game-over');
  const startBtn = document.getElementById('startBtn');
  const restartBtn = document.getElementById('restartBtn');
  const finalScore = document.getElementById('finalScore');
  const finalTime = document.getElementById('finalTime');
  const finalBest = document.getElementById('finalBest');
  const upgradesPanel = document.getElementById('upgrades-panel');

  let bestTimeSec = 0;
  try {
    const s = localStorage.getItem('cyberSurvivorBestTime');
    if (s !== null) bestTimeSec = parseInt(s, 10) || 0;
  } catch (e) {}
  bestTimerDisplay.textContent = formatTime(bestTimeSec);

  function formatTime(sec) {
    const m = Math.floor(sec / 60);
    const s = Math.floor(sec % 60);
    return m + ':' + (s < 10 ? '0' : '') + s;
  }

  const keys = {};
  window.addEventListener('keydown', (e) => { keys[e.code] = true; });
  window.addEventListener('keyup', (e) => { keys[e.code] = false; });

  function random(min, max) { return Math.random() * (max - min) + min; }
  function dist(x1, y1, x2, y2) {
    const dx = x2 - x1, dy = y2 - y1;
    return Math.sqrt(dx * dx + dy * dy);
  }
  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

  class XPGem {
    constructor(x, y, value) {
      this.x = x; this.y = y; this.value = value;
      this.radius = 5;
      this.collected = false;
      const ang = random(0, Math.PI*2);
      this.vx = Math.cos(ang) * 1;
      this.vy = Math.sin(ang) * 1;
      this.life = 600;
    }
    update(player) {
      if (this.collected) return;
      this.x += this.vx; this.y += this.vy;
      this.vx *= 0.96; this.vy *= 0.96;
      this.x = clamp(this.x, 0, CW); this.y = clamp(this.y, 0, CH);
      this.life--;
      if (dist(this.x, this.y, player.x, player.y) < player.radius + this.radius) {
        this.collected = true;
        return this.value;
      }
      return 0;
    }
    draw() {
      if (this.collected) return;
      ctx.fillStyle = '#38bdf8'; ctx.shadowColor = '#38bdf8'; ctx.shadowBlur = 10;
      ctx.beginPath(); ctx.arc(this.x, this.y, this.radius, 0, Math.PI*2); ctx.fill();
      ctx.shadowBlur = 0;
    }
  }
  class Projectile {
    constructor(x, y, angle, speed, damage, color, pierce) {
      this.x = x; this.y = y; this.angle = angle;
      this.speed = speed; this.damage = damage; this.color = color;
      this.pierce = pierce || false;
      this.life = 50; this.radius = 3;
      this.vx = Math.cos(angle) * speed;
      this.vy = Math.sin(angle) * speed;
      this.hitEnemies = [];
    }
    update() {
      this.x += this.vx; this.y += this.vy;
      this.life--;
    }
    draw() {
      ctx.fillStyle = this.color; ctx.shadowColor = this.color; ctx.shadowBlur = 6;
      ctx.beginPath(); ctx.arc(this.x, this.y, this.radius, 0, Math.PI*2); ctx.fill();
      ctx.shadowBlur = 0;
    }
  }
  class Enemy {
    constructor(timeSec) {
      this.radius = 9 + timeSec * 0.02;
      this.hp = 20 + timeSec * 2;
      this.maxHp = this.hp;
      this.speed = 1.2 + timeSec * 0.008;
      this.damage = 8 + timeSec * 0.5;
      this.xp = 5;
      this.dead = false;
      this.hitFlash = 0;
      const side = Math.floor(random(0, 4));
      const margin = 60;
      if (side === 0) { this.x = random(-margin, CW + margin); this.y = random(-margin, -margin); }
      else if (side === 1) { this.x = CW + margin; this.y = random(0, CH); }
      else if (side === 2) { this.x = random(-margin, CW + margin); this.y = CH + margin; }
      else { this.x = random(-margin, -margin); this.y = random(0, CH); }
    }
    update(player) {
      if (this.dead) return;
      if (this.hitFlash > 0) this.hitFlash--;
      const ang = angleTo(player.x, player.y, this.x, this.y);
      this.x += Math.cos(ang) * this.speed;
      this.y += Math.sin(ang) * this.speed;
      if (dist(this.x, this.y, player.x, player.y) < this.radius + player.radius && player.invulnerable <= 0) {
        player.hp -= this.damage;
        player.invulnerable = 30;
        screenShake = 6;
        if (player.hp <= 0) player.dead = true;
      }
    }
    draw() {
      if (this.dead) return;
      ctx.save();
      ctx.translate(this.x, this.y);
      ctx.fillStyle = this.hitFlash > 0 ? '#fbbf24' : '#ef4444';
      ctx.shadowColor = '#ef4444'; ctx.shadowBlur = 10;
      ctx.beginPath();
      ctx.moveTo(0, -this.radius);
      ctx.lineTo(this.radius * 0.866, this.radius * 0.5);
      ctx.lineTo(0, -this.radius * 0.2);
      ctx.lineTo(-this.radius * 0.866, this.radius * 0.5);
      ctx.closePath(); ctx.fill();
      ctx.shadowBlur = 0;
      ctx.restore();
    }
  }
  class Particle {
    constructor(x, y, color) {
      this.x = x; this.y = y; this.color = color;
      const ang = random(0, Math.PI*2);
      const sp = random(1, 6);
      this.vx = Math.cos(ang) * sp; this.vy = Math.sin(ang) * sp;
      this.life = random(20, 40); this.maxLife = this.life;
      this.size = random(2, 5);
    }
    update() {
      this.x += this.vx; this.y += this.vy;
      this.vx *= 0.92; this.vy *= 0.92;
      this.life--;
    }
    draw() {
      const a = this.life / this.maxLife;
      ctx.globalAlpha = a; ctx.fillStyle = this.color;
      ctx.fillRect(this.x - this.size/2, this.y - this.size/2, this.size, this.size);
      ctx.globalAlpha = 1;
    }
  }

  function angleTo(tx, ty, sx, sy) { return Math.atan2(ty - sy, tx - sx); }
  function dist(x1, y1, x2, y2) { const dx = x2 - x1, dy = y2 - y1; return Math.sqrt(dx*dx + dy*dy); }
  function random(min, max) { return Math.random() * (max - min) + min; }

  // Weapon definitions
  const WEAPONS = {
    basic:   { name: 'Pulse Blaster',  damage: 8,  speed: 14, cooldown: 18,  spread: 0,   count: 1,  color: '#22d3ee', pierce: false },
    spread:  { name: 'Spread Cannon',   damage: 5,  speed: 12, cooldown: 22,  spread: 0.3, count: 3,  color: '#34d399', pierce: false },
    laser:   { name: 'Rail Laser',     damage: 18, speed: 18, cooldown: 35,  spread: 0,   count: 1,  color: '#a78bfa', pierce: true },
    chain:   { name: 'Chain Gun',      damage: 4,  speed: 16, cooldown: 6,   spread: 0.15,count: 2,  color: '#fbbf24', pierce: false },
    plasma:  { name: 'Plasma Thrower', damage: 12, speed: 9,  cooldown: 14,  spread: 0.25,count: 2,  color: '#f472b6', pierce: true },
  };

  let player;
  let xpGems = [];
  let projectiles = [];
  let enemies = [];
  let particles = [];
  let explosions = [];
  let timeSec = 0;
  let score = 0;
  let kills = 0;
  let level = 1;
  let xp = 0;
  let xpToNext = 30;
  let hp = 100;
  let maxHp = 100;
  let gameRunning = false;
  let gameOver = false;
  let frameCount = 0;
  let spawnTimer = 0;
  let weaponLevel = { basic: 1, spread: 0, laser: 0, chain: 0, plasma: 0 };
  let activeWeapon = 'basic';
  let screenShake = 0;
  let upgradesOpen = false;

  function updateHUD() {
    hpDisplay.textContent = Math.ceil(hp);
    xpDisplay.textContent = xp + '/' + xpToNext;
    levelDisplay.textContent = level;
    killsDisplay.textContent = kills;
    timerDisplay.textContent = formatTime(timeSec);
    bestTimerDisplay.textContent = formatTime(bestTimeSec);
  }

  function addXP(amount) {
    xp += amount;
    if (xp >= xpToNext) {
      xp -= xpToNext;
      level++;
      xpToNext = Math.floor(xpToNext * 1.5);
      openUpgrades();
    }
    updateHUD();
  }

  function createExplosion(x, y, color, count, speed) {
    for (let i = 0; i < count; i++) particles.push(new Particle(x, y, color));
  }

  function openUpgrades() {
    upgradesOpen = true;
    gameRunning = false;
    const opts = [];
    const used = new Set();
    while (opts.length < 3 && used.size < WEAPONS.length + 4) {
      const idx = Math.floor(random(0, WEAPONS.length + 4));
      if (used.has(idx)) continue;
      used.add(idx);
      if (idx < WEAPONS.length) {
        const key = Object.keys(WEAPONS)[idx];
        opts.push({ type: 'weapon', key, w: WEAPONS[key] });
      } else {
        opts.push({ type: 'stat', kind: idx - WEAPONS.length });
      }
    }
    const statNames = ['hp', 'speed', 'damage', 'firerate'];
    const statDescs = ['+20 Max HP', '+10% Move Speed', '+15% Damage', '+10% Fire Rate'];
    const els = [
      { el: document.getElementById('opt1'), u: opts[0] },
      { el: document.getElementById('opt2'), u: opts[1] },
      { el: document.getElementById('opt3'), u: opts[2] },
    ];
    for (let i = 0; i < 3; i++) {
      const u = opts[i];
      const el = els[i].el;
      if (u.type === 'weapon') {
        el.querySelector('h4').textContent = u.w.name + ' L' + (weaponLevel[u.key] + 1);
        el.querySelector('p').textContent = u.w.desc || u.w.name;
        el.onclick = () => { weaponLevel[u.key]++; activeWeapon = u.key; closeUpgrades(); };
      } else {
        const si = u.kind;
        el.querySelector('h4').textContent = statNames[si];
        el.querySelector('p').textContent = statDescs[si];
        el.onclick = () => { applyStat(si); closeUpgrades(); };
      }
    }
    upgradesPanel.classList.add('visible');
    updateHUD();
  }

  function applyStat(kind) {
    if (kind === 0) { maxHp += 20; hp = maxHp; }
    else if (kind === 1) { player.speedMult = (player.speedMult || 1) * 1.1; }
    else if (kind === 2) { player.dmgMult = (player.dmgMult || 1) * 1.15; }
    else if (kind === 3) { player.cdMult = (player.cdMult || 1) * 0.9; }
    updateHUD();
  }

  function closeUpgrades() {
    upgradesOpen = false;
    upgradesPanel.classList.remove('visible');
    gameRunning = true;
    requestAnimationFrame(loop);
  }

  function initGame() {
    player = { x: CW/2, y: CH/2, angle: 0, invulnerable: 0, dead: false, radius: 10,
      speed: 3.8, speedMult: 1, dmgMult: 1, cdMult: 1, cooldown: 0 };
    hp = 100; maxHp = 100; xp = 0; xpToNext = 30; level = 1; score = 0; kills = 0;
    timeSec = 0; frameCount = 0; spawnTimer = 0; screenShake = 0;
    xpGems = []; projectiles = []; enemies = []; particles = []; explosions = [];
    weaponLevel = { basic: 1, spread: 0, laser: 0, chain: 0, plasma: 0 };
    activeWeapon = 'basic';
    gameOver = false; upgradesOpen = false;
    updateHUD();
    upgradesPanel.classList.remove('visible');
  }

  function startGame() {
    startScreen.style.display = 'none';
    gameOverScreen.classList.remove('visible');
    initGame();
    gameRunning = true;
    requestAnimationFrame(loop);
  }

  startBtn.addEventListener('click', startGame);
  restartBtn.addEventListener('click', startGame);

  for (const key of Object.keys(WEAPONS)) {
    document.getElementById('opt' + (Object.keys(WEAPONS).indexOf(key) + 1)).onclick = null;
  }

  function loop() {
    if (!gameRunning || upgradesOpen) return;
    frameCount++;

    if (keys['KeyR'] && gameOver) { startGame(); keys['KeyR'] = false; return; }

    timeSec += 1/60;
    updateHUD();

    // Player movement
    let dx = 0, dy = 0;
    if (keys['KeyW'] || keys['ArrowUp']) dy -= 1;
    if (keys['KeyS'] || keys['ArrowDown']) dy += 1;
    if (keys['KeyA'] || keys['ArrowLeft']) dx -= 1;
    if (keys['KeyD'] || keys['ArrowRight']) dx += 1;
    const len = Math.sqrt(dx*dx + dy*dy);
    if (len > 0) { dx /= len; dy /= len; }
    player.x += dx * player.speed * player.speedMult;
    player.y += dy * player.speed * player.speedMult;
    player.x = clamp(player.x, 16, CW - 16); player.y = clamp(player.y, 16, CH - 16);
    if (player.invulnerable > 0) player.invulnerable--;

    // Auto-fire weapons
    const w = WEAPONS[activeWeapon];
    if (player.cooldown > 0) player.cooldown--;
    if (player.cooldown <= 0 && enemies.length > 0) {
      // Aim at nearest enemy
      let target = null, tDist = 1e9;
      for (const e of enemies) {
        if (!e.dead) {
          const d = dist(player.x, player.y, e.x, e.y);
          if (d < tDist) { tDist = d; target = e; }
        }
      }
      if (target) {
        const baseAng = angleTo(target.x, target.y, player.x, player.y);
        for (let i = 0; i < w.count; i++) {
          const ang = baseAng + (i - (w.count-1)/2) * w.spread;
          const bx = player.x + Math.cos(ang) * 14;
          const by = player.y + Math.sin(ang) * 14;
          projectiles.push(new Projectile(bx, by, ang, w.speed * (1 + weaponLevel[activeWeapon] * 0.1),
            w.damage * player.dmgMult * (1 + weaponLevel[activeWeapon] * 0.2), w.color, w.pierce));
        }
        player.cooldown = Math.max(4, w.cooldown * player.cdMult - weaponLevel[activeWeapon] * 2);
        createExplosion(player.x, player.y, w.color, 2, 8);
      }
    }

    // Spawn enemies
    if (spawnTimer <= 0) {
      const count = 1 + Math.floor(timeSec / 10);
      for (let i = 0; i < count; i++) enemies.push(new Enemy(timeSec));
      spawnTimer = random(20, 60) / (1 + timeSec * 0.01);
    }
    if (spawnTimer > 0) spawnTimer--;

    // Update projectiles
    for (let i = projectiles.length - 1; i >= 0; i--) {
      projectiles[i].update();
      if (projectiles[i].life <= 0 || projectiles[i].x < 0 || projectiles[i].x > CW ||
          projectiles[i].y < 0 || projectiles[i].y > CH) {
        projectiles.splice(i, 1); continue;
      }
      for (let e = enemies.length - 1; e >= 0; e--) {
        const en = enemies[e];
        if (en.dead) continue;
        if (dist(projectiles[i].x, projectiles[i].y, en.x, en.y) < en.radius + 3) {
          if (projectiles[i].hitEnemies.includes(en)) continue;
          en.hp -= projectiles[i].damage;
          en.hitFlash = 6;
          projectiles[i].hitEnemies.push(en);
          if (!projectiles[i].pierce) projectiles[i].life = 0;
          if (en.hp <= 0) {
            en.dead = true;
            kills++;
            score += 10 + Math.floor(timeSec);
            addXP(5);
            createExplosion(en.x, en.y, '#ef4444', 5, 18);
            if (random(0, 1) < 0.4) xpGems.push(new XPGem(en.x, en.y, 1));
            enemies.splice(e, 1);
          }
          break;
        }
      }
    }

    // Update enemies
    for (let i = enemies.length - 1; i >= 0; i--) {
      enemies[i].update(player);
      if (dist(enemies[i].x, enemies[i].y, player.x, player.y) < enemies[i].radius + player.radius && player.invulnerable <= 0) {
        // handled in update
      }
    }

    // XP gems
    for (let i = xpGems.length - 1; i >= 0; i--) {
      const g = xpGems[i];
      const gained = g.update(player);
      if (g.collected) { xpGems.splice(i, 1); addXP(g.value); }
    }

    // Particles
    for (let i = particles.length - 1; i >= 0; i--) {
      particles[i].update();
      if (particles[i].life <= 0) particles.splice(i, 1);
    }
    for (let i = explosions.length - 1; i >= 0; i--) {
      const e = explosions[i];
      e.x += e.vx; e.y += e.vy;
      e.vx *= 0.9; e.vy *= 0.9;
      e.life--;
      if (e.life <= 0) explosions.splice(i, 1);
    }

    if (screenShake > 0) screenShake *= 0.9;

    // Player death
    if (player.dead) {
      endGame();
      return;
    }

    // Draw
    ctx.save();
    if (screenShake > 0) ctx.translate(random(-screenShake, screenShake), random(-screenShake, screenShake));

    ctx.fillStyle = '#050508';
    ctx.fillRect(0, 0, CW, CH);

    // Grid floor
    ctx.strokeStyle = 'rgba(167,139,250,0.08)';
    ctx.lineWidth = 1;
    const gs = 60;
    const off = (frameCount * 0.3) % gs;
    for (let x = -gs + off; x < CW; x += gs) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, CH); ctx.stroke(); }
    for (let y = -gs + off; y < CH; y += gs) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(CW, y); ctx.stroke(); }

    for (const g of xpGems) g.draw();
    for (const p of projectiles) p.draw();
    for (const e of enemies) e.draw();
    for (const p of particles) p.draw();
    for (const e of explosions) {
      ctx.globalAlpha = e.life / 30;
      ctx.strokeStyle = e.color; ctx.lineWidth = 2; ctx.shadowColor = e.color; ctx.shadowBlur = 10;
      ctx.beginPath(); ctx.arc(e.x, e.y, e.size * (30 - e.life)/10, 0, Math.PI*2); ctx.stroke();
      ctx.shadowBlur = 0; ctx.globalAlpha = 1;
    }
    // Player
    ctx.save();
    ctx.translate(player.x, player.y);
    const flash = player.invulnerable > 0 && frameCount % 6 < 3;
    if (flash) ctx.globalAlpha = 0.4;
    ctx.fillStyle = '#a78bfa'; ctx.shadowColor = '#a78bfa'; ctx.shadowBlur = 14;
    ctx.beginPath();
    ctx.moveTo(14, 0); ctx.lineTo(-10, -9); ctx.lineTo(-6, 0); ctx.lineTo(-10, 9); ctx.closePath();
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.restore();

    ctx.restore();
    requestAnimationFrame(loop);
  }

  function endGame() {
    gameOver = true;
    gameRunning = false;
    const totalSec = Math.floor(timeSec);
    if (totalSec > bestTimeSec) {
      bestTimeSec = totalSec;
      try { localStorage.setItem('cyberSurvivorBestTime', String(bestTimeSec)); } catch (e) {}
    }
    finalScore.textContent = 'Score: ' + score;
    finalTime.textContent = 'Survived: ' + formatTime(totalSec);
    finalBest.textContent = 'Best time: ' + formatTime(bestTimeSec);
    gameOverScreen.classList.add('visible');
    updateHUD();
  }

  startScreen.style.display = 'flex';
  gameOverScreen.classList.remove('visible');
  updateHUD();

})();
</script>
